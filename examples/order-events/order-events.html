<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Order events</title><style>
.tp{

  --tp-halo:#040405;--tp-halo-opacity:.9;--tp-dot:#e8e8ea;

}
.tp[data-theme="light"]{
  --tp-page:#f1f1ee;--tp-card:#fafaf8;--tp-text:#56565a;--tp-strong:#18181a;--tp-muted:#8b8b90;
  --tp-face:#ffffff;--tp-top:#ffffff;--tp-lit-top:#ffffff;--tp-lit-shade:#ededea;
  --tp-shade-0:#dbdbd8;--tp-shade-1:#e4e4e1;--tp-shade-2:#ecece9;--tp-shade-3:#f3f3f0;
  --tp-hi:#25252a;--tp-mid:#89898e;--tp-lo:#b3b3b7;--tp-faint:#d3d3d5;--tp-lit:#000000;
  --tp-halo:#88887e;--tp-halo-opacity:.3;--tp-dot:#39393d;
  --tp-red:#e5484d;--tp-green:#30a46c;--tp-blue:#3e63dd;--tp-amber:#c27c0e;
}
.k-svg{display:block;width:100%;height:auto;overflow:visible;margin:0 auto}
.k-svg path,.k-svg circle{vector-effect:non-scaling-stroke}
.k-fill{fill:var(--tp-card);stroke:none}
.k-solid[data-lit]>.k-fill{fill:var(--tp-face)}
.k-shade,.k-top{stroke:none}
.k-shade[data-shade="0"]{fill:var(--tp-shade-0)}
.k-shade[data-shade="1"]{fill:var(--tp-shade-1)}
.k-shade[data-shade="2"]{fill:var(--tp-shade-2)}
.k-shade[data-shade="3"]{fill:var(--tp-shade-3)}
.k-top{fill:var(--tp-top)}
.k-solid[data-lit]>.k-top{fill:var(--tp-lit-top)}
.k-solid[data-lit]>.k-shade{fill:var(--tp-lit-shade)}
.k-solid[data-lit]>.k-edge{stroke:var(--tp-lit)}
.k-halo{fill:var(--tp-halo);stroke:none;filter:blur(9px);opacity:var(--tp-halo-opacity);transform:translateY(3px)}
.k-line{fill:none;stroke:var(--tp-lo);stroke-width:var(--tp-weight);stroke-linecap:round;stroke-linejoin:round}
.k-line[data-tone="hi"]{stroke:var(--tp-hi)}
.k-line[data-tone="mid"]{stroke:var(--tp-mid)}
.k-line[data-tone="faint"]{stroke:var(--tp-faint)}
.k-line[data-tone="lit"]{stroke:var(--tp-lit)}
.k-line[data-dashed]{stroke-dasharray:3 3}
.k-dots circle{fill:var(--tp-dot);stroke:none;opacity:.32}
.k-dots[data-tone="hi"] circle{opacity:.85}
.k-dots[data-tone="mid"] circle{opacity:.45}
.k-dots[data-tone="lo"] circle{opacity:.22}
.k-text{fill:var(--tp-mid);font-family:var(--tp-mono);letter-spacing:.04em}
.k-text[data-tone="hi"]{fill:var(--tp-hi)}
.k-text[data-tone="lo"]{fill:var(--tp-lo)}
.k-figure{margin:32px 0 36px}
.k-card{position:relative;padding:52px 24px;background:var(--tp-card);box-shadow:0 0 0 1px var(--tp-mid)}
.k-corners{position:absolute;inset:18px 20px;pointer-events:none}
.k-corner{position:absolute;color:var(--tp-muted);font-family:var(--tp-mono);font-size:10.5px;line-height:1;letter-spacing:.04em;white-space:nowrap}
.k-corner[data-corner="fig"]{top:0;left:0;color:var(--tp-text)}
.k-corner[data-corner="title"]{top:0;right:0;text-transform:uppercase;letter-spacing:.1em}
.k-corner[data-corner="hint"]{bottom:0;left:0;text-transform:uppercase;letter-spacing:.1em}
.k-corner[data-corner="readout"]{right:0;bottom:0;color:var(--tp-text);font-variant-numeric:tabular-nums}
.k-legend{display:grid;gap:8px;margin-top:12px;color:var(--tp-muted);font-size:13px;line-height:1.55}
.k-keys{display:flex;flex-wrap:wrap;gap:6px 18px}
.k-key{display:inline-flex;align-items:center;gap:7px}
.k-swatch{width:16px;height:10px;flex:none;overflow:visible}
.k-swatch path{fill:none;stroke:var(--tp-hi);stroke-width:1;stroke-linejoin:round;stroke-linecap:round;vector-effect:non-scaling-stroke}
.k-swatch[data-mark="raised"] path{stroke:var(--tp-mid)}
.k-swatch[data-mark="lit"] path{stroke:var(--tp-lit)}
.k-swatch[data-mark="dashed"] path{stroke-dasharray:3 2.5}
.k-swatch[data-mark="red"] path{stroke:var(--tp-red)}
.k-swatch[data-mark="green"] path{stroke:var(--tp-green)}
.k-swatch[data-mark="blue"] path{stroke:var(--tp-blue)}
.k-swatch[data-mark="amber"] path{stroke:var(--tp-amber)}
@media (max-width:560px){.k-card{padding:48px 12px 70px}.k-corner[data-corner="hint"]{bottom:18px}}

body{margin:0;background:var(--tp-page);color:var(--tp-text);font:14px/1.6 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}

.tp-stage{position:relative;outline:none;touch-action:manipulation}
.tp-stage:focus-visible{outline:1px dashed var(--tp-faint);outline-offset:6px}
.tp-svg[hidden]{display:none}
.tp-node{cursor:pointer;transition:opacity .25s var(--tp-ease)}
.tp-edge .k-line{transition:stroke .2s}
.tp-edge-bed{fill:none;stroke:var(--tp-card);stroke-width:3.4px;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke}
.tp-iso .tp-edge-bed{stroke:none}
.tp-port{fill:var(--tp-card);stroke:var(--tp-mid);stroke-width:var(--tp-weight);vector-effect:non-scaling-stroke}
.tp-stage[data-focus] .tp-node:not([data-near]){opacity:.38}
.tp-stage[data-focus] .tp-edge:not([data-near]) .k-line{stroke:var(--tp-faint)}
.tp-stage[data-focus] .tp-edge[data-near] .k-line{stroke:var(--tp-hi)}
.tp-stage[data-focus] .tp-label:not([data-near]) text{fill:var(--tp-lo)}
.tp-label .tp-ft{fill:var(--tp-text)}
.tp-node[data-sel] .k-solid>.k-edge{stroke:var(--tp-lit)}
.tp-node[data-sel] .tp-f{stroke:var(--tp-lit)}
.tp-led{fill:var(--tp-lo);stroke:none;transition:fill .5s}
.tp-led[data-on]{fill:var(--tp-green);transition:none}
.tp-node[data-down] .tp-led{fill:var(--tp-red)}
.tp-node[data-down]>*:not(.tp-led){opacity:.4}
.tp-node[data-down] .k-edge,.tp-node[data-down] .tp-f{stroke-dasharray:2 2}
.tp-screen{fill:var(--tp-shade-0);stroke:var(--tp-lo);stroke-width:var(--tp-weight);vector-effect:non-scaling-stroke}
.tp-cell[data-on] .k-top{fill:var(--tp-hi)}
.tp-cell[data-on] .k-shade{fill:var(--tp-mid)}
.tp-cell[data-on] .k-edge{stroke:var(--tp-hi)}
.tp-fcell{fill:var(--tp-card);stroke:var(--tp-lo);stroke-width:var(--tp-weight);vector-effect:non-scaling-stroke}
.tp-fcell[data-on]{fill:var(--tp-hi);stroke:var(--tp-hi)}
.tp-fcursor{fill:none;stroke:var(--tp-lit);stroke-width:1.4px;vector-effect:non-scaling-stroke;stroke-linecap:round}

.tp-fcursor[data-g="2"]{stroke:var(--tp-green)}

.tp-cursor[data-g="2"] .k-edge{stroke:var(--tp-green)}
.tp-f{fill:var(--tp-card);stroke:var(--tp-mid);stroke-width:var(--tp-weight);vector-effect:non-scaling-stroke}
.tp-f-back{stroke:var(--tp-lo)}
.tp-f-top{fill:var(--tp-face)}
.tp-f-chip{fill:var(--tp-face);stroke:var(--tp-lo)}
.tp-f-mark{fill:none;stroke:var(--tp-lo);stroke-width:var(--tp-weight);vector-effect:non-scaling-stroke}
.tp-fzone{fill:var(--tp-shade-1);stroke:var(--tp-lo);stroke-width:var(--tp-weight);stroke-dasharray:3 3;vector-effect:non-scaling-stroke}
.tp-ft{fill:var(--tp-hi);font-family:var(--tp-mono);letter-spacing:.02em}
.tp-ft-dim{fill:var(--tp-muted)}
.tp-zone .k-text{letter-spacing:.14em}
.tp-pk{pointer-events:none}
.tp-pk[data-kind="request"]{--pk:var(--tp-lit)}
.tp-pk[data-kind="response"]{--pk:var(--tp-mid)}
.tp-pk[data-kind="record"]{--pk:var(--tp-blue)}
.tp-pk[data-kind="replication"]{--pk:var(--tp-green)}
.tp-pk[data-kind="drop"]{--pk:var(--tp-red)}
.tp-pk[data-kind="error"]{--pk:var(--tp-red)}
.tp-pk[data-kind="retry"]{--pk:var(--tp-amber)}
.tp-pk[data-kind="late"]{--pk:var(--tp-lo)}
.k-swatch[data-mark="amber"] path{stroke:var(--tp-amber)}
.tp-ext .k-edge,.tp-f-ext{stroke-dasharray:2.5 2}
.tp-f-dot{fill:var(--tp-mid)}
.tp-f-knob{fill:var(--tp-lit);stroke:none}
.tp-breaker{fill:var(--tp-card);stroke:var(--tp-mid);stroke-width:1px;vector-effect:non-scaling-stroke}
.tp-breaker[data-state="open"]{fill:var(--tp-red);stroke:var(--tp-red)}
.tp-breaker[data-state="half"]{fill:var(--tp-amber);stroke:var(--tp-amber)}

.tp-edge[data-kind="config"] .k-line{stroke-dasharray:1 3}
.tp-elabel .k-text,.tp-elabel-text{fill:var(--tp-muted);font-variant-numeric:tabular-nums}
.tp-elabel-text{paint-order:stroke;stroke:var(--tp-card);stroke-width:2.5px;stroke-linejoin:round}
.tp-elabel[data-bad] .k-text,.tp-elabel[data-bad] .tp-elabel-text{fill:var(--tp-red)}
.tp-lane{transition:opacity .3s}
.tp-lane[data-paused]{opacity:.3}
.tp-broker{cursor:pointer}
.tp-broker[data-down] .tp-led{fill:var(--tp-red)}
.tp-broker[data-down]>*:not(.tp-led){opacity:.4}
.tp-qcell[data-on] .k-top{fill:var(--tp-amber)}

.tp-story{margin:18px 0 -10px}
.tp-timeline{display:flex;align-items:center;gap:10px;font-family:var(--tp-mono);font-size:10.5px;color:var(--tp-muted)}
.tp-play{all:unset;flex:none;cursor:pointer;width:24px;height:22px;text-align:center;line-height:22px;font-size:9px;color:var(--tp-strong);box-shadow:0 0 0 1px var(--tp-lo)}
.tp-play:focus-visible,.tp-track:focus-visible{outline:1px solid var(--tp-lit);outline-offset:2px}
.tp-track{position:relative;flex:1;height:28px;cursor:pointer;touch-action:none}
.tp-track::before{content:"";position:absolute;left:0;right:0;top:20px;height:1px;background:var(--tp-lo)}
.tp-phase{all:unset;position:absolute;top:0;bottom:0;box-sizing:border-box;border-left:1px solid var(--tp-lo);cursor:pointer}
.tp-phase span{position:absolute;left:5px;top:2px;max-width:calc(100% - 8px);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--tp-muted)}
.tp-phase:hover span,.tp-phase[data-now] span{color:var(--tp-strong)}
.tp-phase[data-now]{background:color-mix(in srgb,var(--tp-hi) 5%,transparent)}
.tp-tick{position:absolute;top:16px;width:1px;height:9px;background:var(--tp-mid);pointer-events:none}
.tp-head{position:absolute;top:12px;height:17px;width:2px;margin-left:-1px;background:var(--tp-lit);pointer-events:none}
.tp-time{flex:none;min-width:40px;text-align:right;font-variant-numeric:tabular-nums}
.tp-say{margin:8px 0 0 34px;min-height:3em;font-size:12.5px;line-height:1.5;color:var(--tp-text)}
.tp-story[data-mode="free"] .tp-track{opacity:.4}
@media (max-width:560px){.tp-say{margin-left:0}}
.tp-pk .pk-top{fill:var(--pk)}
.tp-pk .pk-side{fill:color-mix(in srgb,var(--pk) 55%,var(--tp-card))}

.tp-pk circle{fill:var(--pk)}
.tp-views{position:absolute;top:13px;left:50%;transform:translateX(-50%);display:flex;gap:0;z-index:2;font-family:var(--tp-mono);font-size:10px;letter-spacing:.08em}

.tp-views button[aria-pressed="true"]{color:var(--tp-strong);box-shadow:0 0 0 1px var(--tp-mid);background:var(--tp-shade-2)}
.tp-views button:focus-visible{outline:1px solid var(--tp-lit)}

.8" width="3.7" height="4.5" rx="1"/><rect class="tp-cell tp-fcell" data-cell="topic:2:5" x="452.4" y="187.8" width="3.7" height="4.5" rx="1"/><rect class="tp-cell tp-fcell" data-cell="topic:2:6" x="457.7" y="187.8" width="3.7" height="4.5" rx="1"/><rect class="tp-cell tp-fcell" data-cell="topic:2:7" x="463.1" y="187.8" width="3.7" height="4.5" rx="1"/><rect class="tp-cell tp-fcell" data-cell="topic:2:8" x="468.4" y="187.8" width="3.7" height="4.5" rx="1"/><rect class="tp-cell tp-fcell" data-cell="topic:2:9" x="473.7" y="187.8" width="3.7" height="4.5" rx="1"/><rect class="tp-cell tp-fcell" data-cell="topic:2:10" x="479" y="187.8" width="3.7" height="4.5" rx="1"/><rect class="tp-cell tp-fcell" data-cell="topic:2:11" x="484.3" y="187.8" width="3.7" height="4.5" rx="1"/><path class="tp-cursor tp-fcursor" data-cursor="topic:0:2" data-g="0" d="M425.1 185V195"/><path class="tp-cursor tp-fcursor" data-cursor="topic:1:2" data-g="1" d="M425.1 184V196"/></g><circle class="tp-led" data-led="topic:b0" cx="490.9" cy="171" r="1.1"/><circle class="tp-led" data-led="topic:b1" cx="490.9" cy="175" r="1.1"/><circle class="tp-led" data-led="topic:b2" cx="490.9" cy="179" r="1.1"/></g><g class="tp-node" data-node="indexer" data-kind="worker"><rect class="tp-f" x="573" y="169.1" width="41" height="27.3" rx="4"/><path class="k-line" data-tone="faint" d="M573 180.1L614 180.1"/><circle class="tp-led" data-led="indexer:0" cx="579" cy="174.6" r="1.7"/><circle class="tp-f-mark" cx="607" cy="174.6" r="2.6"/></g></svg></div></div><figcaption class="k-legend"><span class="k-keys"><span class="k-key"><svg class="k-swatch" data-mark="lit" viewBox="0 0 16 10" aria-hidden="true"><path d="M2 4.5 8 1.5 14 4.5 14 6 8 9 2 6Z"/></svg>Request</span><span class="k-key"><svg class="k-swatch" data-mark="raised" viewBox="0 0 16 10" aria-hidden="true"><path d="M2 4.5 8 1.5 14 4.5 14 6 8 9 2 6Z"/></svg>Response</span><span class="k-key"><svg class="k-swatch" data-mark="blue" viewBox="0 0 16 10" aria-hidden="true"><path d="M1.5 5h13"/></svg>Record pulled by a consumer</span><span class="k-key"><svg class="k-swatch" data-mark="green" viewBox="0 0 16 10" aria-hidden="true"><path d="M1.5 5h13"/></svg>Replication</span><span class="k-key"><svg class="k-swatch" data-mark="dashed" viewBox="0 0 16 10" aria-hidden="true"><path d="M1.5 5h13"/></svg>Async link</span><span class="k-key"><svg class="k-swatch" data-mark="red" viewBox="0 0 16 10" aria-hidden="true"><path d="M1.5 5h13"/></svg>Error, refused or dropped</span></span><span class="k-caption">Clients call orders-api through the load balancer. Each order is written to Postgres, replicated to a read replica, and published to orders.v1 (3 partitions). Billing (2 consumers) and the search indexer (1 consumer) read the topic as separate consumer groups, each with its own committed offset: the white and blue cursors on each partition.</span></figcaption></figure></main><script type="module">// The model behind every figure: a small, seeded, tick-based simulation of requests moving
// through a system. The page inlines this file (exports stripped) and draws `sim.packets`;
// `scripts/build.mjs --check` runs the same code in Node and prints what the readout will say.
// Every number a figure shows comes from here.
//
// Time. Sim time is real time for everything the model decides (service time, queue waits,
// timeouts, backoff, breaker windows, rates), except packet travel, which is slowed down so
// people can watch it. Latency is therefore built up in model time rather than measured off
// the clock: a job costs its queue wait plus its service time plus its slowest sync call, and a
// call costs its network round trip (`ms` on the edge, default `sim.net`) plus the callee's job,
// plus any earlier failed attempts and their backoff.

const SIM_DEFAULTS = { speed: 150, per: 1, rebalance: 0.9, window: 2, seed: 7, refuse: 0.02, net: 0.5, length: 0, loop: true };
const SERVICE_MS = { client: 0, lb: 0.3, gateway: 1, service: 8, worker: 15, cache: 0.4, db: 4, storage: 20, kafka: 2, queue: 1, cdn: 0.5, dns: 1, external: 120, flags: 1, scheduler: 0, box: 5 };
const DETECT = { lb: 0.6, gateway: 0.6, dns: 3 };

function rngOf(seed) {
  let s = seed >>> 0 || 1;
  return () => {
    s ^= s << 13;
    s ^= s >>> 17;
    s ^= s << 5;
    return (s >>> 0) / 4294967296;
  };
}

const isLog = (node) => node.kind === "kafka" || node.kind === "queue";
const routeOf = (node) => node.route || (node.kind === "lb" || node.kind === "gateway" || node.kind === "dns" ? "roundrobin" : "all");

function hashOf(text) {
  let h = 2166136261;
  for (let i = 0; i < text.length; i++) h = Math.imul(h ^ text.charCodeAt(i), 16777619);
  return h >>> 0;
}

// Scenario steps may name a phase instead of a time: { phase: "incident", after: 1.5 }.
function normalizeScenario(scenario) {
  if (!scenario) return null;
  const phases = (scenario.phases || []).map((phase) => ({ ...phase })).sort((a, b) => a.at - b.at);
  const byName = new Map(phases.map((phase) => [phase.name, phase]));
  const steps = (scenario.steps || []).map((step, index) => {
    let at = step.at;
    if (at == null && step.phase != null) {
      const phase = byName.get(step.phase);
      if (!phase) throw new Error(`scenario step ${index}: unknown phase "${step.phase}"`);
      at = phase.at + (step.after || 0);
    }
    if (at == null) throw new Error(`scenario step ${index}: needs \`at\` or \`phase\``);
    return { ...step, at, index };
  });
  steps.sort((a, b) => a.at - b.at || a.index - b.index);
  const last = Math.max(0, ...steps.map((step) => step.at), ...phases.map((phase) => phase.at));
  const length = scenario.length || Math.ceil(last + 8);
  phases.forEach((phase, index) => (phase.end = phases[index + 1]?.at ?? length));
  return { length, loop: scenario.loop !== false, steps, phases };
}

const quantile = (sorted, q) => (sorted.length ? sorted[Math.min(sorted.length - 1, Math.floor(q * sorted.length))] : 0);

// spec: { nodes, edges (with `len` in world units), sim, scenario, flags, features }.
function createSim(spec) {
  const features = spec.features || {};
  const on = (name) => features[name] !== false;
  const cfg = { ...SIM_DEFAULTS, ...(spec.sim || {}) };
  const scenario = on("scenario") ? normalizeScenario(spec.scenario) : null;
  if (scenario) cfg.length = scenario.length;
  const rand = rngOf(cfg.seed);
  const nodes = new Map();
  const edges = spec.edges.map((edge, index) => ({
    ...edge,
    index,
    sent: 0,
    dropped: 0,
    failed: 0,
    fast: 0,
    recent: [],
    recentErrors: [],
    flow: 0,
    errorRate: 0,
    breaker: on("breakers") && edge.breaker ? { errors: 0.5, min: 8, window: 2, open: 3, ...(edge.breaker === true ? {} : edge.breaker), state: "closed", outcomes: [], until: 0, trial: false } : null,
  }));
  for (const node of spec.nodes) {
    nodes.set(node.id, {
      ...node,
      up: node.up !== false,
      downSince: node.up === false ? 0 : null,
      ms: node.ms ?? SERVICE_MS[node.kind] ?? 5,
      queueMax: on("queues") ? node.queue || 0 : 0,
      out: [],
      into: [],
      rr: 0,
      tokens: 0,
      bucket: node.capacity ? node.capacity * (node.burst ?? 0.25) + 1 : 0,
      handled: 0,
      jobs: new Set(),
      working: [],
      waiting: [],
      clock: rand() / Math.max(typeof node.emit === "number" ? node.emit : 1, 0.001),
      nextBurst: 0,
      flow: 0,
      dropRate: 0,
      errorRate: 0,
      recent: [],
      recentDrops: [],
      recentErrors: [],
      service: [],
      roots: [],
      hist: [],
      replica: 0,
    });
  }
  for (const edge of edges) {
    nodes.get(edge.from).out.push(edge);
    nodes.get(edge.to).into.push(edge);
  }

  // Feature flags in the modelled system. A service evaluates flags locally from the last
  // config it got; while the flag service is down, changes don't reach anyone.
  const flags = new Map();
  if (on("flags")) for (const [name, flag] of Object.entries(spec.flags || {})) flags.set(name, { name, rollout: flag.rollout ?? 0, sticky: !!flag.sticky, effective: flag.rollout ?? 0 });
  const flagNode = on("flags") ? [...nodes.values()].find((node) => node.kind === "flags") : null;

  // Logs: kafka topics (partitions, consumer groups with exclusive assignment) and queues
  // (one lane, competing consumers).
  const logs = new Map();
  for (const node of nodes.values()) {
    if (!isLog(node)) continue;
    const partitions = node.kind === "queue" ? 1 : node.partitions || 3;
    const groups = new Map();
    for (const edge of node.out) {
      const name = node.kind === "queue" ? "queue" : edge.group || "default";
      if (!groups.has(name)) groups.set(name, { name, members: [], committed: Array(partitions).fill(0), assign: new Map(), pause: 0, generation: 0 });
      groups.get(name).members.push(edge);
    }
    const log = { node, partitions, end: Array(partitions).fill(0), rr: 0, groups: [...groups.values()], appended: 0 };
    // Brokers: each partition has `rf` replicas, led round-robin. Losing a leader pauses its
    // partitions for `election` seconds; with acks "all", a partition whose in-sync replicas
    // fall below `minIsr` refuses writes.
    if (node.kind === "kafka" && node.brokers) {
      const n = node.brokers;
      log.brokers = Array(n).fill(true);
      log.rf = Math.min(node.rf ?? 3, n);
      log.minIsr = Math.min(node.minIsr ?? 2, log.rf);
      log.acks = node.acks ?? 1;
      log.election = node.election ?? 2;
      log.parts = Array.from({ length: partitions }, (_, p) => ({ replicas: Array.from({ length: log.rf }, (_, i) => (p + i) % n), leader: p % n, electUntil: 0 }));
    }
    logs.set(node.id, log);
  }

  const durationOf = (edge) => Math.max(edge.len / cfg.speed, 0.08);
  // Timeouts are judged in model time when the reply arrives. For a reply that never comes,
  // a backstop deadline in sim time: the call's animation round trip, the slowest sync call
  // its target makes in turn, the timeout and a second's grace.
  const allowance = new Map();
  const allowanceOf = (edge, seen = new Set()) => {
    if (allowance.has(edge.index)) return allowance.get(edge.index);
    if (seen.has(edge.index)) return 0;
    seen.add(edge.index);
    const target = nodes.get(edge.to);
    const below = target.out.filter((e) => e.sync && e.kind !== "replication").map((e) => allowanceOf(e, seen));
    const value = 2 * durationOf(edge) + Math.max(0, ...below);
    allowance.set(edge.index, value);
    return value;
  };
  edges.forEach((edge) => allowanceOf(edge));

  const sim = { cfg, nodes, edges, logs, flags, scenario, features, packets: [], time: 0, events: [], rand, calls: new Set(), timers: [], stepIndex: 0, histClock: 0, hist: [] };
  let ids = 0;
  const newMsg = (source) => ({ id: ++ids, source, born: sim.time, draws: null });

  function rebalance(log, group, now) {
    const live = group.members.filter((edge) => nodes.get(edge.to).up);
    group.assign = new Map();
    if (log.node.kind === "queue") {
      for (const edge of live) group.assign.set(edge.index, [0]);
    } else {
      live.forEach((edge) => group.assign.set(edge.index, []));
      for (let p = 0; p < log.partitions; p++) if (live.length) group.assign.get(live[p % live.length].index).push(p);
      group.generation++;
      if (now > 0) group.pause = cfg.rebalance;
    }
    sim.events.push({ type: "rebalance", log: log.node.id, group: group.name, at: now });
  }
  for (const log of logs.values()) for (const group of log.groups) rebalance(log, group, 0);

  function launch(edge, kind, extra = {}) {
    const packet = { edge: edge.index, t: 0, dir: kind === "response" || kind === "error" ? -1 : 1, kind, duration: durationOf(edge), launched: sim.time, ...extra };
    if (packet.dir > 0) {
      edge.sent++;
      edge.recent.push(sim.time);
    }
    sim.packets.push(packet);
    return packet;
  }

  const burst = (edge, at = 1) => sim.packets.push({ edge: edge.index, t: at, dir: 1, kind: "drop", age: 0, duration: 1 });

  // --- jobs -----------------------------------------------------------------------------------

  function startJob(node, msg, call, extra = {}) {
    const job = { node, msg, call, waiting: 0, forwarded: false, failed: false, dead: false, done: false, arrived: sim.time, cost: 0, ...extra };
    node.jobs.add(job);
    node.handled++;
    node.recent.push(sim.time);
    node.replica = (node.replica + 1) % Math.max(1, node.replicas || 1);
    sim.events.push({ type: "handle", node: node.id, replica: node.replica, at: sim.time });
    if (!node.capacity) return begin(job);
    if (node.bucket >= 1) {
      node.bucket -= 1;
      return begin(job);
    }
    if (node.waiting.length < node.queueMax) return node.waiting.push(job);
    reject(job);
  }

  function begin(job) {
    const node = job.node;
    // Service time varies: ±40% around `ms`, and one request in 30 takes 2-5x as long.
    const base = node.ms + (node.sidecar ? node.sidecarMs ?? 1.5 : 0);
    const spread = cfg.jitter === false ? 1 : (0.6 + 0.8 * rand()) * (rand() < 1 / 30 ? 2 + 3 * rand() : 1);
    job.readyAt = sim.time + (base * spread) / 1000;
    node.working.push(job);
  }

  // Over capacity with a full buffer: answer 503 at once.
  function reject(job) {
    const node = job.node;
    node.recentDrops.push(sim.time);
    if (job.call) {
      job.call.edge.dropped++;
      burst(job.call.edge);
    } else if (job.via) burst(job.via);
    respond(job, false);
  }

  function respond(job, ok) {
    if (job.dead || job.done) return;
    job.done = true;
    const node = job.node;
    node.jobs.delete(job);
    if (!ok) node.recentErrors.push(sim.time);
    const own = job.readyAt != null ? (job.readyAt - job.arrived) * 1000 : 0;
    const ms = own + job.cost;
    node.service.push({ at: sim.time, ms });
    if (job.call) launch(job.call.edge, ok ? "response" : "error", { call: job.call, ms });
    if (job.root) node.roots.push({ at: sim.time, ms, ok });
  }

  function ready(job) {
    if (job.dead || job.done) return;
    const node = job.node;
    if (!node.up) return;
    if (isLog(node)) return respond(job, true);
    if (node.errorRate && rand() < node.errorRate) return respond(job, false);
    forward(job);
    job.forwarded = true;
    if (job.waiting === 0) respond(job, !job.failed);
  }

  const decide = (msg, name) => {
    const flag = flags.get(name);
    if (!flag) return false;
    if (flag.sticky) return (hashOf(`${msg.source}:${name}`) % 10000) / 10000 < flag.effective;
    msg.draws ??= {};
    if (msg.draws[name] === undefined) msg.draws[name] = rand() < flag.effective;
    return msg.draws[name];
  };
  const healthy = (node, router) => node.up || sim.time - node.downSince < (router.detect ?? router.ttl ?? DETECT[router.kind] ?? 0);

  function forward(job) {
    const node = job.node;
    const usable = node.out.filter((edge) => edge.kind !== "config").filter((edge) => (edge.flag && on("flags") ? decide(job.msg, edge.flag) : edge.unless && on("flags") ? !decide(job.msg, edge.unless) : true));
    for (const edge of usable) if (edge.kind === "replication") {
      launch(edge, "replication", { msg: job.msg });
    }
    const data = usable.filter((edge) => edge.kind !== "replication");
    if (!data.length) return;
    const mode = routeOf(node);
    const chosen = [];
    if (mode === "roundrobin") {
      // Health checks notice a dead target only after `detect` seconds (`ttl` for DNS).
      for (let tries = 0; tries < data.length; tries++) {
        const edge = data[node.rr++ % data.length];
        if (node.health === false || healthy(nodes.get(edge.to), node)) {
          chosen.push(edge);
          break;
        }
      }
      if (!chosen.length) job.failed = true;
    } else if (mode === "random") {
      const total = data.reduce((sum, edge) => sum + (edge.p ?? 1), 0);
      let pick = rand() * total;
      chosen.push(data.find((edge) => (pick -= edge.p ?? 1) <= 0) || data[data.length - 1]);
    } else {
      // A CDN or cache with `hit` sends only its misses on.
      for (const edge of data) if (rand() < (edge.p ?? (node.hit != null ? 1 - node.hit : 1))) chosen.push(edge);
    }
    for (const edge of chosen) {
      if (edge.sync) {
        job.waiting++;
        callOut(job, edge, 0);
      } else launch(edge, "request", { msg: job.msg });
    }
  }

  // --- calls: one attempt of a sync request ---------------------------------------------------

  const netOf = (edge) => (edge.ms ?? cfg.net) * 2;

  function callOut(job, edge, attempt, prior = 0) {
    const br = edge.breaker;
    let trial = false;
    if (br) {
      if (br.state === "open" && sim.time >= br.until) setBreaker(edge, "half");
      if (br.state === "open" || (br.state === "half" && br.trial)) {
        edge.fast++;
        return finish(job, false, prior);
      }
      if (br.state === "half") {
        br.trial = true;
        trial = true;
      }
    }
    const call = { job, edge, attempt, trial, prior, sent: sim.time, deadline: edge.timeout ? sim.time + allowance.get(edge.index) + edge.timeout + 1 : Infinity, done: false, packets: [] };
    sim.calls.add(call);
    call.packets.push(launch(edge, attempt ? "retry" : "request", { call, msg: job.msg }));
  }

  function setBreaker(edge, state) {
    const br = edge.breaker;
    br.state = state;
    br.trial = false;
    if (state === "open") br.until = sim.time + br.open;
    if (state === "closed") br.outcomes = [];
    sim.events.push({ type: "breaker", edge: edge.index, state, at: sim.time });
  }

  function settle(call, ok, ms) {
    if (call.done) return;
    const spent = call.prior + ms;
    call.done = true;
    sim.calls.delete(call);
    const { edge, job } = call;
    if (!ok) {
      edge.failed++;
      edge.recentErrors.push(sim.time);
    }
    const br = edge.breaker;
    if (br) {
      if (call.trial) setBreaker(edge, ok ? "closed" : "open");
      else if (br.state === "closed") {

      const wait = (edge.backoff ?? 0.05) * 2 ** call.attempt * (0.5 + rand());
      sim.timers.push({ at: sim.time + wait, run: () => !job.dead && !job.done && callOut(job, edge, call.attempt + 1, spent + wait * 1000) });
      return;
    }
    finish(job, ok, spent);
  }

  function finish(job, ok, ms) {
    job.waiting--;

  function arrive(packet) {

      if (packet.call) {

    }
    if (isLog(node)) {
      const log = logs.get(node.id);
      const p = chooseP(log, edge, packet);
      if (!writable(log, p)) {

  const isrOf = (log, part) => part.replicas.filter((b) => log.brokers[b]).length;
  const readable = (log, p) => !log.parts || (sim.time >= log.parts[p].electUntil && log.brokers[log.parts[p].leader]);
  const writable = (log, p) => readable(log, p) && (!log.parts || log.acks !== "all" || isrOf(log, log.parts[p]) >= log.minIsr);

  function setBroker(id, b, up) {
    const log = logs.get(id);
    if (!log?.brokers || b < 0 || b >= log.brokers.length || log.brokers[b] === up) return;
    log.brokers[b] = up;
    sim.events.push({ type: up ? "broker-up" : "broker-down", node: id, broker: b, at: sim.time });
    for (const part of log.parts) {
      if (!up && part.leader === b) {
        const next = part.replicas.find((r) => log.brokers[r]);
        if (next != null) {

  function chooseP(log, edge, packet) {
    if (packet.partition != null) return packet.partition;

    const skew = log.node.skew;
    if (skew) {
      const total = skew.reduce((a, b) => a + b, 0);
      let pick = rand() * total;
      for (let p = 0; p < log.partitions; p++) if ((pick -= skew[p] ?? 0) <= 0) return p;

    return log.rr++ % log.partitions;

  // --- sources --------------------------------------------------------------------------------

  const emitAt = (node, t) => {
    const emit = node.emit;
    if (typeof emit === "number") return emit;
    if (Array.isArray(emit)) {
      const span = cfg.length || emit[emit.length - 1][0] || 1;
      const x = cfg.loop && cfg.length ? t % span : t;
      if (x <= emit[0][0]) return emit[0][1];
      for (let i = 1; i < emit.length; i++) {
        const [t1, r1] = emit[i];
        const [t0, r0] = emit[i - 1];

  function emitOne(node) {
    const msg = newMsg(node.id);

    node.recent.push(sim.time);

    job.forwarded = true;
    if (job.waiting === 0) {
      job.done = true;
      node.jobs.delete(job);

  // --- the tick -------------------------------------------------------------------------------

  function step(dt) {

    }

      const due = sim.timers.filter((timer) => timer.at <= now);
      if (due.length) {

  const totalIn = () => [...nodes.values()].reduce((sum, node) => sum + (node.emit && node.up ? node.flow : 0), 0);

  function setUp(id, up) {

        job.dead = true;
      }
      node.jobs.clear();
      node.working = [];
      node.waiting = [];
    }
    if (up && node === flagNode) for (const flag of flags.values()) syncFlag(flag);
    sim.events.push({ type: up ? "recover" : "fail", node: id, at: sim.time });
    for (const log of logs.values()) for (const group of log.groups) if (group.members.some((edge) => edge.to === id)) rebalance(log, group, sim.time);
  }

  function syncFlag(flag) {
    if (flagNode && !flagNode.up) return;
    if (flag.effective === flag.rollout) return;
    flag.effective = flag.rollout;
    sim.events.push({ type: "flag", flag: flag.name, rollout: flag.effective, at: sim.time });
  }

  // "from>to" in a scenario's `set` changes that edge: retries, timeout, backoff, p, breaker.
  const EDGE_SETTABLE = new Set(["retries", "timeout", "backoff", "p", "breaker", "rate"]);
  function setEdge(key, props) {
    const [from, to] = key.split(">");
    const list = edges.filter((edge) => edge.from === from && edge.to === to);
    if (!list.length) throw new Error(`scenario: no edge "${key}"`);
    for (const edge of list) for (const [name, value] of Object.entries(props)) {
      if (!EDGE_SETTABLE.has(name)) throw new Error(`scenario: can't set "${name}" on an edge (settable: ${[...EDGE_SETTABLE].join(", ")})`);

      if (name === "timeout") allowanceOf(edge);
    }
  }

  const SETTABLE = new Set(["emit", "rate", "capacity", "burst", "errorRate", "ms", "queue", "detect", "ttl", "route", "health", "sidecarMs"]);
  function apply(step) {
    if (step.fail) [].concat(step.fail).forEach((id) => setUp(id, false));
    if (step.recover) [].concat(step.recover).forEach((id) => setUp(id, true));
    if (step.set) {
      for (const [id, props] of Object.entries(step.set)) {
        if (id.includes(">")) {
          setEdge(id, props);
          continue;
        }
        const node = nodes.get(id);
        if (!node) throw new Error(`scenario: unknown node "${id}"`);
        for (const [key, value] of Object.entries(props)) {
          if (!SETTABLE.has(key)) throw new Error(`scenario: can't set "${key}" (settable: ${[...SETTABLE].join(", ")})`);

        syncFlag(flag);
      }
      if (step.kill) {
        const flag = flags.get(step.kill);
        if (!flag) throw new Error(`scenario: unknown flag "${step.kill}"`);
        flag.rollout = 0;
        syncFlag(flag);
      }
    }
  }

  sim.step = (dt) => {
    // Sub-step so a long frame doesn't teleport packets past their arrival.
    const n = Math.max(1, Math.ceil(dt / (1 / 60)));
    for (let i = 0; i < n; i++) step(dt / n);
  };
  sim.setUp = setUp;
  sim.setBroker = setBroker;
  sim.readable = readable;
  sim.isrOf = isrOf;
  sim.apply = apply;
  sim.totalIn = totalIn;
  sim.lagOf = (id, groupName) => {
    const log = logs.get(id);
    if (!log) return 0;
    const group = groupName ? log.groups.find((g) => g.name === groupName) : log.groups[0];
    if (!group) return 0;
    return log.end.reduce((sum, end, p) => sum + end - group.committed[p], 0);
  };

}

// p50 / p99 of completed requests started at these sources, over the last 3 s of model time.
function latencyOf(sources) {
  const samples = [];
  let failed = 0;
  for (const node of sources) for (const root of node?.roots || []) {
    if (root.ok) samples.push(root.ms);
    else failed++;
  }
  samples.sort((a, b) => a - b);
  return { p50: quantile(samples, 0.5), p99: quantile(samples, 0.99), count: samples.length, failed };
}

const fmt = (n) => (n >= 10000 ? `${(n / 1000).toFixed(0)}k` : n >= 1000 ? `${(n / 1000).toFixed(1)}k` : n >= 10 ? n.toFixed(0) : n.toFixed(1));

const formatCount = (n, per = 1) => fmt(n * per).replace(/\.0$/, "");
const formatMs = (ms) => (ms >= 1000 ? `${(ms / 1000).toFixed(1)}s` : ms >= 10 ? `${ms.toFixed(0)}ms` : `${ms.toFixed(1)}ms`);

function statsOf(sim, id) {
  const node = sim.nodes.get(id);
  if (!node) return "";
  const per = sim.cfg.per;
  const name = node.label || node.id;
  if (!node.up) return `${name} · down${node.dropRate ? ` · ${formatRate(node.dropRate, per)} refused` : ""}`;
  const log = sim.logs.get(id);
  if (log) {
    const parts = log.groups.map((group) => {
      const lag = log.end.reduce((sum, end, p) => sum + end - group.committed[p], 0);
      const live = [...group.assign.values()].filter((list) => list.length).length;
      return `${log.groups.length > 1 ? group.name + " " : ""}lag ${formatCount(lag, per)}${group.pause > 0 ? " · rebalancing" : node.kind === "kafka" ? ` · ${live}/${group.members.length} consumers` : ""}`;
    });
    if (log.brokers) {
      const live = log.brokers.filter(Boolean).length;
      const electing = log.parts.filter((part) => sim.time < part.electUntil).length;
      const offline = log.parts.filter((part) => !log.brokers[part.leader]).length;
      const under = log.parts.filter((part) => sim.isrOf(log, part) < log.minIsr).length;
      parts.push(`brokers ${live}/${log.brokers.length}`);
      if (electing) parts.push(`${electing} electing`);
      if (offline) parts.push(`${offline} offline`);
      if (under) parts.push(`${under} under min ISR${log.acks === "all" ? " (writes refused)" : ""}`);
    }
    return `${name} · in ${formatRate(node.flow, per)} · ${parts.join(" · ")}`;
  }
  if (node.kind === "flags") {
    const list = [...sim.flags.values()].map((flag) => `${flag.name} ${Math.round(flag.effective * 100)}%${flag.effective !== flag.rollout ? ` (→${Math.round(flag.rollout * 100)}%)` : ""}`);
    return `${name} · ${list.join(" · ") || "no flags"}`;
  }
  const bits = [`${name} · ${formatRate(node.flow, per)}`];
  if (node.roots.length) {
    const lat = latencyOf([node]);
    if (lat.count) bits.push(`p50 ${formatMs(lat.p50)} · p99 ${formatMs(lat.p99)}`);
  } else if (node.service.length) {
    const sorted = node.service.map((s) => s.ms).sort((a, b) => a - b);
    bits.push(`${formatMs(quantile(sorted, 0.5))} p50`);
  }
  if (node.capacity) bits.push(`cap ${formatRate(node.capacity, per)}`);
  if (node.queueMax) bits.push(`queue ${node.waiting.length}/${node.queueMax}`);
  if (node.dropRate) bits.push(`${formatRate(node.dropRate, per)} rejected`);
  if (node.errorRateSeen) bits.push(`${formatRate(node.errorRateSeen, per)} errors`);
  for (const edge of node.out) if (edge.breaker && edge.breaker.state !== "closed") bits.push(`breaker → ${sim.nodes.get(edge.to).label || edge.to} ${edge.breaker.state}`);
  return bits.join(" · ");
}

function summaryOf(sim) {
  const per = sim.cfg.per;
  let lag = 0;
  let drops = 0;
  for (const node of sim.nodes.values()) drops += node.dropRate;
  for (const id of sim.logs.keys()) lag += sim.lagOf(id);
  const bits = [`${formatRate(sim.totalIn(), per)} in`];
  const lat = sim.latencyOf();
  if (lat.count) bits.push(`p50 ${formatMs(lat.p50)} · p99 ${formatMs(lat.p99)}`);
  if (sim.logs.size) bits.push(`lag ${formatCount(lag, per)}`);
  const failing = lat.failed / 3;
  const down = [...sim.nodes.values()].filter((node) => !node.up).length;
  bits.push(failing > 0.05 ? `${formatRate(failing, per)} failing` : drops ? `${formatRate(drops, per)} lost` : down ? `${down} down` : "healthy");
  return bits.join(" · ");

  if (part && id) {
    const b = +part.dataset.part.slice(7);
    for (const hook of hooks.takeover) hook(id);
    sim.setBroker(id, b, !sim.logs.get(id).brokers[b]);
    drawStatus();
    say(true);
  } else if (id) toggle(id);
});
const ring = [...DATA.spec.nodes].map((node) => node.id);
stage.addEventListener("keydown", (event) => {
  const here = focus ? ring.indexOf(focus) : -1;
  if (hooks.key.some((hook) => hook(event))) {
    event.preventDefault();
    return;
  }
  if (event.key === "ArrowRight" || event.key === "ArrowDown") {
    pinned = true;
    setFocus(ring[(here + 1) % ring.length]);
  } else if (event.key === "ArrowLeft" || event.key === "ArrowUp") {
    pinned = true;
    setFocus(ring[(here - 1 + ring.length) % ring.length]);
  } else if ((event.key === "Enter" || event.key === " ") && focus) {
    toggle(focus);
  } else if (event.key === "v" || event.key === "V") {
    setView(view === "iso" ? "flat" : "iso");
  } else if (event.key === "Escape") {
    pinned = false;
    setFocus(null);
  } else return;
  event.preventDefault();
});
document.querySelectorAll(".tp-views button").forEach((button) => button.addEventListener("click", () => setView(button.dataset.view)));

// Swap in another sim (a scrub re-simulates from 0) and bring every attribute up to date.
function resetVisuals(next) {
  sim = next;
  for (const v of Object.values(views)) {
    v.pool.forEach((slot) => {
      slot.g.style.display = "none";
      slot.shown = false;
    });
    v.cellState.clear();
    v.cursors.forEach((cursor) => (cursor.at = -1));
    v.status.clear();
    for (const [id, el] of v.nodes) el.toggleAttribute("data-down", !sim.nodes.get(id).up);
  }
  for (const el of lit.keys()) el.removeAttribute("data-on");
  lit.clear();
  sim.events.length = 0;
  drawLogs();
  drawStatus();
  drawPackets();
  say(true);
}

window.__topo = { get sim() { return sim; }, setView, setFocus, toggle, resetVisuals, get view() { return view; } };
drawLogs();
drawStatus();
say(true);

// The scenario player, inlined after topo-live.js when the spec has a `scenario` and the
// `scenario` feature is on. A timeline under the stage shows the named phases and each step;
// the story plays and loops on its own. Scrubbing or jumping to a phase re-simulates from 0
// (the sim is seeded, so the same time always looks the same). Clicking a node takes over:
// the story stops applying and the reader plays freely until they press play again.
(() => {
  const story = normalizeScenario(DATA.spec.scenario);
  if (!story) return;
  const plate = stage.closest(".k-card");
  const hint = plate.querySelector('[data-corner="hint"]');
  const hintText = hint ? hint.textContent : "";
  const pct = (t) => `${((100 * t) / story.length).toFixed(3)}%`;
  const esc = (text) => String(text).replace(/&/g, "&amp;").replace(/</g, "&lt;");

  const phases = story.phases
    .map((phase, index) => `<button type="button" class="tp-phase" data-at="${phase.at}" style="left:${pct(phase.at)};width:${pct(phase.end - phase.at)}" title="${esc(phase.name)} (${index + 1})"><span>${esc(phase.name)}</span></button>`)
    .join("");
  const ticks = story.steps.map((step) => `<i class="tp-tick" style="left:${pct(step.at)}"${step.say ? ` title="${esc(step.say)}"` : ""}></i>`).join("");
  const bar = document.createElement("div");
  bar.className = "tp-story";
  bar.innerHTML = `<div class="tp-timeline"><button type="button" class="tp-play"></button><div class="tp-track" tabindex="0" role="slider" aria-label="Story time" aria-valuemin="0" aria-valuemax="${story.length}">${phases}${ticks}<div class="tp-head"></div></div><span class="tp-time"></span></div><p class="tp-say" aria-live="polite"></p>`;
  stage.after(bar);
  const play = bar.querySelector(".tp-play");
  const track = bar.querySelector(".tp-track");
  const head = bar.querySelector(".tp-head");
  const clock = bar.querySelector(".tp-time");
  const line = bar.querySelector(".tp-say");

  let mode = "story";
  let playing = !still.matches;
  paused = !playing;
  let preview = null;

  function seek(t) {
    const next = createSim(DATA.spec);
    const steps = Math.round(Math.max(0, Math.min(t, story.length)) * 60);
    for (let i = 0; i < steps; i++) next.step(1 / 60);
    resetVisuals(next);
    mode = "story";
    render();
  }

  const phaseAt = (t) => story.phases.filter((phase) => phase.at <= t + 1e-6).pop();
  const sayAt = (t) => story.steps.filter((step) => step.say && step.at <= t + 1e-6).pop();
  let shown = { say: null, phase: null };
  function render() {
    const t = preview ?? Math.min(sim.time, story.length);
    head.style.left = pct(t);
    clock.textContent = `${t.toFixed(1)}s`;
    track.setAttribute("aria-valuenow", t.toFixed(1));
    bar.dataset.mode = mode;
    play.textContent = playing && mode === "story" ? "❚❚" : "▶";
    play.setAttribute("aria-label", mode === "free" ? "Resume the story" : playing ? "Pause" : "Play");
    const phase = mode === "story" ? phaseAt(t) : null;
    const step = mode === "story" ? sayAt(t) : null;
    if (phase !== shown.phase) {
      shown.phase = phase;
      bar.querySelectorAll(".tp-phase").forEach((el) => el.toggleAttribute("data-now", phase && +el.dataset.at === phase.at));
      if (hint) hint.textContent = mode === "free" ? "Free play · ▶ resumes the story" : story.phases.length > 1 ? `Click to take over · 1–${Math.min(9, story.phases.length)} jump` : hintText;
    }
    const text = mode === "free" ? "You've taken over: click nodes to fail and restore them." : step ? step.say : "";
    if (text !== shown.say) {
      shown.say = text;
      line.textContent = text;
    }
  }

  hooks.tick.push(() => {
    if (mode === "story" && sim.time >= story.length) {
      if (story.loop) seek(0);
      else {
        playing = false;
        paused = true;
      }
    }
    render();
  });
  hooks.takeover.push(() => {
    if (mode !== "story") return;
    mode = "free";
    playing = true;
    paused = false;
    // Free play: the rest of the script no longer applies.
    sim.stepIndex = Infinity;
    shown.phase = undefined;
    render();
  });
  hooks.key.push((event) => {
    if (/^[1-9]$/.test(event.key) && story.phases[+event.key - 1]) {
      seek(story.phases[+event.key - 1].at);
      return true;
    }
    if (event.key === "p" || event.key === "P") {
      toggle_();
      return true;
    }
    return false;
  });

  function toggle_() {
    if (mode === "free") {
      seek(sim.time);
      playing = true;
    } else playing = !playing;
    paused = !playing;
    render();
  }
  play.addEventListener("click", toggle_);
  bar.querySelectorAll(".tp-phase").forEach((el) =>
    el.addEventListener("click", (event) => {
      event.stopPropagation();
      seek(+el.dataset.at);
    }),
  );
  const fractionOf = (event) => {
    const box = track.getBoundingClientRect();
    return Math.max(0, Math.min(1, (event.clientX - box.left) / box.width));
  };
  track.addEventListener("pointerdown", (event) => {
    if (event.target.closest(".tp-phase")) return;
    track.setPointerCapture(event.pointerId);
    preview = fractionOf(event) * story.length;
    render();
  });
  track.addEventListener("pointermove", (event) => {
    if (preview == null) return;
    preview = fractionOf(event) * story.length;
    render();
  });
  const release = () => {
    if (preview == null) return;
    const t = preview;
    preview = null;
    seek(t);
  };
  track.addEventListener("pointerup", release);
  track.addEventListener("pointercancel", release);
  track.addEventListener("keydown", (event) => {
    const t = Math.min(sim.time, story.length);
    if (event.key === "ArrowRight") seek(t + 1);
    else if (event.key === "ArrowLeft") seek(t - 1);
    else if (event.key === "Home") seek(0);
    else if (event.key === " ") toggle_();
    else return;
    event.preventDefault();
  });
  window.__topo.story = { seek, get mode() { return mode; }, get playing() { return playing; }, story };
  render();
})();
</script></body></html>
