          inserted.push(axis === "x" ? [along, hop.line + offset] : [hop.line + offset, along]);
        }
      }
      edge.points.splice(i, 0, ...inserted);
    }
    measure(edge);
    edge.hops = hops.length;
  }
}

// Where a link meets a node: on the face, `offset` along it. Round bodies (disks, the
// octagonal LB) and inset ones (the DNS tower's base) are met on their real outline, so a
// link spread off-centre still touches the body.
const ROUND = { db: 1, storage: 1, cdn: 0, lb: Math.cos(Math.PI / 8) };
const INSET = { dns: 4 };
function portOf(node, side, offset) {
  const across = side.endsWith("x");
  const sign = side[0] === "+" ? 1 : -1;
  const half = across ? node.w / 2 : node.d / 2;
  let reach = half - (INSET[node.kind] || 0);
  if (ROUND[node.kind]) {
    const r = (Math.min(node.w, node.d) / 2) * ROUND[node.kind];
    reach = Math.sqrt(Math.max(0, r * r - offset * offset));
  }
  return across ? [node.cx + sign * reach, node.cy + offset] : [node.cx + offset, node.cy + sign * reach];
}

// Cumulative lengths along an edge's points: packets are placed by them.
function measure(edge) {
  edge.lens = [0];
  for (let i = 1; i < edge.points.length; i++) edge.lens.push(edge.lens[i - 1] + Math.hypot(edge.points[i][0] - edge.points[i - 1][0], edge.points[i][1] - edge.points[i - 1][1]));
  edge.len = edge.lens[edge.lens.length - 1];
}

function rounded(points, radius, steps = 5) {
  if (points.length < 3) return points.map((p) => [...p]);
  const out = [points[0]];
  for (let i = 1; i < points.length - 1; i++) {
    const [a, b, c] = [points[i - 1], points[i], points[i + 1]];
    const l1 = Math.hypot(b[0] - a[0], b[1] - a[1]);
    const l2 = Math.hypot(c[0] - b[0], c[1] - b[1]);
    const r = Math.min(radius, l1 / 2, l2 / 2);
    if (r < 0.5) {
      out.push(b);
      continue;
    }
    const u = [(a[0] - b[0]) / l1, (a[1] - b[1]) / l1];
    const v = [(c[0] - b[0]) / l2, (c[1] - b[1]) / l2];
    const s = [b[0] + u[0] * r, b[1] + u[1] * r];
    const e = [b[0] + v[0] * r, b[1] + v[1] * r];
    for (let t = 0; t <= steps; t++) {
      const f = t / steps;
      // quadratic Bézier through the corner: close to a quarter circle for right angles
      const m = (1 - f) * (1 - f);
      const n = 2 * (1 - f) * f;
      const o = f * f;
      out.push([m * s[0] + n * b[0] + o * e[0], m * s[1] + n * b[1] + o * e[1]]);
    }
  }
  out.push(points[points.length - 1]);
  return out;
}

// ---------------------------------------------------------------------------------------------
// Views

const VIEWS = {
  iso: { azimuth: 56, elevation: 32 },
  flat: { azimuth: 90, elevation: 90 },
};

function extentOf(model, view) {
  const pts = [];
  for (const node of model.nodes) pts.push(...k.boxCorners(node.plan, 0, view === "iso" ? heightOf(node) : 0));
  for (const group of model.groups) pts.push(...k.boxCorners(group.box, -2, 0));
  for (const node of model.nodes) pts.push([node.cx - node.label.length * 2.6, node.plan.y + node.plan.d + 14, 0], [node.cx + node.label.length * 2.6, node.plan.y + node.plan.d + 14, 0]);
  return pts;
}

function heightOf(node) {
  if (node.kind === "service" || node.kind === "worker") return node.replicas * 8.8 + 1;
  if (isLog(node)) return 10;
  return node.h;
}

function projectionOf(model, view, width = 640, camera, { maxScale } = {}) {
  const { azimuth, elevation } = camera || VIEWS[view];
  const pts = extentOf(model, view);
  const unit = { origin: [0, 0], scale: 1, azimuth, elevation };
  const flat = pts.map((p) => k.iso(p, unit));
  const xs = flat.map(([x]) => x);
  const ys = flat.map(([, y]) => y);
  const [spanX, spanY] = [Math.max(...xs) - Math.min(...xs), Math.max(...ys) - Math.min(...ys)];
  const pad = 26;
  // With a scale cap the height follows the content; otherwise the card keeps a sensible minimum.
  const scale = Math.min(maxScale ?? Infinity, (width - pad * 2) / spanX);
  const height = Math.round(Math.min(760, Math.max(maxScale ? 120 : 240, spanY * scale + pad * 2)));
  return { P: k.fitProjection(pts, width, height, { pad, azimuth, elevation, maxScale }), width, height };
}

// ---------------------------------------------------------------------------------------------
// Isometric renderers. Each returns markup for one node at rest; the live page only toggles
// attributes (LEDs, record cells, down) and moves cursors and packets.

function isoKit(P) {
  const at = (p) => k.iso(p, P);
  const S = (paths, style) => k.solidSvg(paths, style);
  const L = (d, style) => k.lineSvg(d, style);
  const led = (id, p, r = 1.3) => {
    const [x, y] = at(p);
    return `<circle class="tp-led" data-led="${escape(id)}" cx="${r1(x)}" cy="${r1(y)}" r="${r}"/>`;
  };
  const dots = (pts, style) => k.dotsSvg(pts.map(at), style);
  // A closed rectangle on the +y face (the face toward the lower left).
  const faceY = (x0, x1, y, z0, z1) => k.pathOf([at([x0, y, z0]), at([x1, y, z0]), at([x1, y, z1]), at([x0, y, z1])], true);
  const faceX = (x, y0, y1, z0, z1) => k.pathOf([at([x, y0, z0]), at([x, y1, z0]), at([x, y1, z1]), at([x, y0, z1])], true);
  return { at, S, L, led, dots, faceY, faceX, P };
}

const ISO = {
  service(node, c) {
    const { plan } = node;
    const out = [];
    for (let r = 0; r < node.replicas; r++) {
      const z = r * 8.8;
      const top = r === node.replicas - 1;
      out.push(c.S(k.slabOf(plan, z, 8, c.P, 3, 0.6), { tone: "mid", crease: "faint" }));
      const fy = plan.y + plan.d;
      for (let b = 0; b < 3; b++) out.push(c.L(c.faceY(plan.x + 14 + b * 11, plan.x + 23 + b * 11, fy, z + 2.4, z + 5.6), { tone: "lo" }));
      out.push(c.L(c.faceX(plan.x + plan.w, plan.y + 6, plan.y + plan.d - 6, z + 3.2, z + 4.8), { tone: "faint" }));
      out.push(c.led(`${node.id}:${r}`, [plan.x + 6, fy, z + 4]));
      if (top) {
        out.push(c.L(k.planOutline(k.insetPlan(plan, 4), z + 8, c.P, 3), { tone: "faint" }));
        out.push(c.dots(k.corners(plan, 2.2).map(([x, y]) => [x, y, z + 8]), { size: 0.5, tone: "lo" }));
        if (node.kind === "worker") out.push(c.L(k.ring(node.cx, node.cy, 6, z + 8, c.P, 24) + k.ring(node.cx, node.cy, 2.4, z + 8, c.P, 16), { tone: "lo" }));
      }
    }
    return out.join("");
  },
  worker(node, c) {
    return ISO.service(node, c);
  },
  cache(node, c) {
    const { plan } = node;
    const out = [c.S(k.slabOf(plan, 0, 5, c.P, 3, 0.6), { tone: "mid" })];
    out.push(c.L(k.planOutline(k.insetPlan(plan, 3), 5, c.P, 3), { tone: "faint" }));
    const chips = [];
    for (let row = 0; row < 2; row++)
      for (let col = 0; col < 4; col++) chips.push({ x: plan.x + 6 + col * 11.4, y: plan.y + 6 + row * 13, w: 8.6, d: 10, r: 0.8 });
    chips.sort((a, b) => a.x + a.y - (b.x + b.y));
    for (const chip of chips) out.push(c.S(k.slabOf(chip, 5, 2.6, c.P, 2), { tone: "hi", crease: "lo" }));
    out.push(c.led(`${node.id}:0`, [plan.x + 5, plan.y + plan.d, 2.5]));
    out.push(c.dots([[plan.x + 11, plan.y + plan.d, 2.5], [plan.x + 15, plan.y + plan.d, 2.5]], { size: 0.6, tone: "lo" }));
    return out.join("");
  },
  db(node, c) {
    const r = Math.min(node.w, node.d) / 2;
    const out = [];
    const toward = [Math.cos(Math.PI / 4), Math.sin(Math.PI / 4)];
    for (let s = 0; s < 3; s++) {
      const z = s * 10;
      out.push(c.S(k.cylinder(node.cx, node.cy, r, z, 9, c.P, 48, s === 2 ? 0.8 : 0), { tone: "mid" }));
      out.push(c.L(k.sideArc(node.cx, node.cy, r, z + 4.5, c.P, 32), { tone: "faint" }));
      out.push(c.led(`${node.id}:${s === 2 ? 0 : "x" + s}`, [node.cx + r * toward[0], node.cy + r * toward[1], z + 4.5], 1.1));
    }
    out.push(c.L(k.ring(node.cx, node.cy, r - 4, 29, c.P, 40), { tone: "lo" }));
    out.push(c.dots([[node.cx, node.cy, 29]], { size: 0.8, tone: "mid" }));
    if (node.role) out.push(k.faceTextSvg(k.topMatrix([node.cx, node.cy + 4], 29, c.P, "x"), node.role.toUpperCase(), { size: 4, tone: "lo", anchor: "middle" }));
    // Level 0 for a database with tables: a live row count, nothing more.
    if (node.tables || node.hasTables) out.push(`<g class="tp-rows-badge" data-rows="${escape(node.id)}">${k.faceTextSvg(k.topMatrix([node.cx, node.cy + 11], 29, c.P, "x"), "0 rows", { size: 4, tone: "mid", anchor: "middle" })}</g>`);
    return out.join("");
  },
  storage(node, c) {
    const r = Math.min(node.w, node.d) / 2;
    const out = [];
    [r - 5, r - 2.5, r].forEach((radius, s) => {
      out.push(c.S(k.cylinder(node.cx, node.cy, radius, s * 8, s === 2 ? 10 : 8, c.P, 48, s === 2 ? 0.8 : 0), { tone: "mid" }));
    });
    out.push(c.L(k.ring(node.cx, node.cy, r - 3, 26, c.P, 40), { tone: "lo" }));
    out.push(c.L(k.ring(node.cx, node.cy, r - 7, 26, c.P, 40), { tone: "faint" }));
    out.push(c.led(`${node.id}:0`, [node.cx + r * 0.707, node.cy + r * 0.707, 21], 1.1));
    return out.join("");
  },
  lb(node, c) {
    const r = Math.min(node.w, node.d) / 2;
    const rot = Array.from({ length: 8 }, (_, i) => {
      const a = ((i + 0.5) / 8) * Math.PI * 2;
      return [node.cx + r * Math.cos(a), node.cy + r * Math.sin(a)];
    });
    const out = [c.S(k.extrude(rot, 0, 10, c.P, { bevel: 0.8 }), { tone: "mid" })];
    out.push(c.L(k.ring(node.cx, node.cy, r - 6, 10, c.P, 40), { tone: "faint" }));
    const fan = [-0.6, 0, 0.6].map((a) => k.lineOnTop([node.cx - 9, node.cy], [node.cx + 11 * Math.cos(a), node.cy + 11 * Math.sin(a)], 10, c.P)).join("");
    out.push(c.L(fan, { tone: "mid", free: "end" }));
    out.push(c.dots([[node.cx - 9, node.cy, 10]], { size: 0.9, tone: "hi" }));
    out.push(c.led(`${node.id}:0`, [node.cx + r * 0.92 * 0.707, node.cy + r * 0.92 * 0.707, 5], 1.2));
    return out.join("");
  },
  gateway(node, c) {
    const { plan } = node;
    const out = [c.S(k.slabOf(plan, 0, 4, c.P, 3, 0.6), { tone: "mid" })];
    const posts = [
      { x: plan.x + 4, y: plan.y + 4, w: 9, d: plan.d - 8, r: 1 },
      { x: plan.x + plan.w - 13, y: plan.y + 4, w: 9, d: plan.d - 8, r: 1 },
    ];
    for (const post of posts) out.push(c.S(k.slabOf(post, 4, 9, c.P, 2, 0.4), { tone: "mid" }));
    const beam = { x: plan.x + 2, y: plan.y + 3, w: plan.w - 4, d: plan.d - 6, r: 1.5 };
    out.push(c.S(k.slabOf(beam, 13, 3, c.P, 3, 0.6), { tone: "hi", crease: "lo" }));
    out.push(c.L(k.planOutline(k.insetPlan(beam, 3), 16, c.P, 3), { tone: "faint" }));
    out.push(c.led(`${node.id}:0`, [plan.x + plan.w / 2, plan.y + plan.d - 3, 14.5]));
    return out.join("");
  },
  client(node, c) {
    const { plan } = node;
    const out = [];
    const deck = { x: plan.x, y: plan.y + 8, w: plan.w, d: plan.d - 8, r: 2 };
    out.push(c.S(k.slabOf(deck, 0, 2.4, c.P, 3, 0.4), { tone: "mid" }));
    out.push(c.L(k.planOutline(k.insetPlan({ ...deck, y: deck.y + 3, d: deck.d - 9 }, 3), 2.4, c.P, 2), { tone: "faint" }));
    out.push(c.L(k.planOutline({ x: node.cx - 6, y: deck.y + deck.d - 6, w: 12, d: 4, r: 1 }, 2.4, c.P, 2), { tone: "faint" }));
    const lid = { x: plan.x, y: plan.y + 4, w: plan.w, d: 3, r: 1 };
    out.push(c.S(k.slabOf(lid, 2.4, 22, c.P, 2, 0.4), { tone: "mid" }));
    const fy = lid.y + lid.d;
    out.push(`<path class="tp-screen" d="${c.faceY(plan.x + 3, plan.x + plan.w - 3, fy, 5, 22)}"/>`);
    for (let i = 0; i < 3; i++) out.push(c.L(k.segment([plan.x + 7, fy, 18 - i * 4], [plan.x + 7 + [22, 16, 19][i], fy, 18 - i * 4], c.P), { tone: "lo", free: true }));
    out.push(c.led(`${node.id}:0`, [plan.x + plan.w - 7, fy, 8]));
    return out.join("");
  },
  box(node, c) {
    const { plan } = node;
    const out = [c.S(k.slabOf(plan, 0, 14, c.P, 3, 0.6), { tone: "mid" })];
    out.push(c.L(k.planOutline(k.insetPlan(plan, 4), 14, c.P, 3), { tone: "faint" }));
    out.push(c.L(k.sideSeam(plan, 4, c.P, 3), { tone: "faint" }));
    out.push(c.led(`${node.id}:0`, [plan.x + 6, plan.y + plan.d, 9]));
    return out.join("");
  },
  kafka(node, c) {
    const { plan } = node;
    const out = [c.S(k.slabOf(plan, 0, 6, c.P, 3, 0.8), { tone: "mid" })];
    const fy = plan.y + plan.d;
    if (node.brokers) {
      // One small broker unit per broker down the left end; click one to fail it.
      const n = node.brokers;
      const span = (plan.d - 8) / n;
      for (let i = n - 1; i >= 0; i--) {
        const unit = { x: plan.x + 5, y: plan.y + 4 + i * span + 0.8, w: 12, d: span - 1.6, r: 1 };
        out.push(`<g class="tp-broker" data-part="broker:${i}">${c.S(k.slabOf(unit, 6, 5, c.P, 2, 0.4), { tone: "mid" })}${c.led(`${node.id}:b${i}`, [unit.x + unit.w, unit.y + unit.d / 2, 8.5], 1)}</g>`);
      }
    } else {
      for (let b = 0; b < 3; b++) out.push(c.led(`${node.id}:b${b}`, [plan.x + 6 + b * 5, fy, 3], 1.1));
      out.push(c.L(c.faceY(plan.x + 24, plan.x + plan.w - 6, fy, 2, 4), { tone: "faint" }));
    }
    for (let p = 0; p < node.partitions; p++) {
      const lane = laneOf(node, p);
      out.push(`<g class="tp-lane" data-lane="${escape(node.id)}:${p}">`);
      out.push(c.S(k.slabOf({ ...lane, x: lane.x - 2, w: lane.w + 4, y: lane.y - 0.5, d: lane.d + 1, r: 1 }, 6, 0.6, c.P, 2), { tone: "lo", crease: "none" }));
      for (let i = 0; i < SLOTS; i++) {
        const cell = { x: lane.x + i * PITCH + 0.7, y: lane.y + 0.8, w: PITCH - 1.4, d: lane.d - 1.6, r: 0.6 };
        out.push(`<g class="tp-cell" data-cell="${escape(node.id)}:${p}:${i}">${c.S(k.slabOf(cell, 6.6, 2.2, c.P, 2), { tone: "lo", crease: "none" })}</g>`);
      }
      (node.groups || ["default"]).slice(0, 3).forEach((_, g) => {
        const post = { x: lane.x - 0.8, y: lane.y - 1.4, w: 1.6, d: lane.d + 2.8, r: 0.4 };
        out.push(`<g class="tp-cursor" data-cursor="${escape(node.id)}:${g}:${p}" data-g="${g}">${c.S(k.slabOf(post, 6.6, 4.4 + g * 1.6, c.P, 1), { tone: "hi", lit: g === 0 })}</g>`);
      });
      out.push(`</g>`);
    }
    return out.join("");
  },
  cdn(node, c) {
    const { plan } = node;
    const r = Math.min(plan.w, plan.d) / 2 - 5;
    const out = [c.S(k.slabOf(plan, 0, 4, c.P, 3, 0.6), { tone: "mid" })];
    out.push(c.S(k.cylinder(node.cx, node.cy, r, 4, 6, c.P, 48, 0.6), { tone: "hi", crease: "lo" }));
    out.push(c.L(k.sideArc(node.cx, node.cy, r, 7, c.P, 32), { tone: "faint" }));
    out.push(c.L(k.ring(node.cx, node.cy, r * 0.62, 10, c.P, 40) + k.ring(node.cx, node.cy, r * 0.25, 10, c.P, 24), { tone: "lo" }));
    out.push(c.L(k.lineOnTop([node.cx - r, node.cy], [node.cx + r, node.cy], 10, c.P) + k.lineOnTop([node.cx, node.cy - r], [node.cx, node.cy + r], 10, c.P), { tone: "faint" }));
    out.push(c.led(`${node.id}:0`, [plan.x + 5, plan.y + plan.d, 2]));
    return out.join("");
  },
  dns(node, c) {
    const out = [c.S(k.slabOf(k.insetPlan(node.plan, 4), 0, 3, c.P, 3, 0.5), { tone: "mid" })];
    out.push(c.S(k.cylinder(node.cx, node.cy, 3, 3, 17, c.P, 20), { tone: "mid", crease: "none" }));
    out.push(c.L([8, 13].map((z) => k.sideArc(node.cx, node.cy, 3, z, c.P, 12)).join(""), { tone: "faint" }));
    out.push(c.S(k.cylinder(node.cx, node.cy, 10, 20, 2.4, c.P, 40, 0.5), { tone: "hi", crease: "lo" }));
    out.push(c.L(k.ring(node.cx, node.cy, 6, 22.4, c.P, 32), { tone: "lo" }));
    out.push(c.led(`${node.id}:0`, [node.cx, node.cy, 22.4], 1.3));
    return out.join("");
  },
  external(node, c) {
    const { plan } = node;
    const out = [`<g class="tp-ext">${c.S(k.slabOf(plan, 0, 14, c.P, 3, 0.6), { tone: "mid" })}</g>`];
    out.push(c.L(k.planOutline(k.insetPlan(plan, 4), 14, c.P, 3), { tone: "faint", dashed: true }));
    out.push(c.dots([0, 1, 2].map((i) => [node.cx - 5 + i * 5, node.cy, 14]), { size: 0.9, tone: "mid" }));
    out.push(c.led(`${node.id}:0`, [plan.x + 6, plan.y + plan.d, 9]));
    return out.join("");
  },
  scheduler(node, c) {
    const { plan } = node;
    const out = [c.S(k.slabOf(plan, 0, 6, c.P, 3, 0.6), { tone: "mid" })];
    const r = Math.min(plan.w, plan.d) / 2 - 4;
    out.push(c.S(k.cylinder(node.cx, node.cy, r, 6, 2, c.P, 48, 0.5), { tone: "hi", crease: "lo" }));
    const ticks = k.radialTicks(node.cx, node.cy, r - 1.5, 12, 3, 8, [1.2, 2.4], c.P);
    out.push(c.L(ticks.minor, { tone: "lo" }), c.L(ticks.major, { tone: "mid" }));
    out.push(c.L(k.lineOnTop([node.cx, node.cy], [node.cx, node.cy - r * 0.62], 8, c.P) + k.lineOnTop([node.cx, node.cy], [node.cx + r * 0.42, node.cy + r * 0.2], 8, c.P), { tone: "hi", free: "end" }));
    out.push(c.dots([[node.cx, node.cy, 8]], { size: 0.8, tone: "hi" }));
    out.push(c.led(`${node.id}:0`, [plan.x + 5, plan.y + plan.d, 3]));
    return out.join("");
  },
  flags(node, c) {
    const { plan } = node;
    const out = [c.S(k.slabOf(plan, 0, 6, c.P, 3, 0.6), { tone: "mid" })];
    flagRows(node).forEach(({ name, slot, knob }) => {
      out.push(c.S(k.slabOf(slot, 6, 0.6, c.P, 2), { tone: "lo", crease: "none" }));
      out.push(`<g class="tp-knob" data-flag="${escape(name)}">${c.S(k.slabOf(knob, 6.6, 2.2, c.P, 2), { tone: "hi", lit: true })}</g>`);
      out.push(k.faceTextSvg(k.topMatrix([plan.x + 4, slot.y + slot.d - 0.6], 6, c.P, "x"), name.slice(0, 7), { size: 3.4, tone: "lo" }));
    });
    out.push(c.led(`${node.id}:0`, [plan.x + plan.w - 5, plan.y + plan.d, 3]));
    return out.join("");
  },
  queue(node, c) {
    return ISO.kafka(node, c);
  },
};

// Rows of switches on a flags panel: a slot and a knob that slides with the rollout.
function flagRows(node) {
  const names = node.flagNames || [];
  const { plan } = node;
  return names.slice(0, 4).map((name, i) => {
    const y = plan.y + 4 + i * ((plan.d - 8) / Math.max(1, Math.min(4, names.length)));
    const slot = { x: plan.x + plan.w - 26, y, w: 22, d: 5, r: 1 };
    return { name, slot, knob: { x: slot.x + 0.5, y: y + 0.5, w: 8, d: 4, r: 0.8 }, travel: slot.w - 9 };
  });
}

function laneOf(node, p) {
  const top = node.plan.y + 7;
  return { x: node.plan.x + node.plan.w - 8 - SLOTS * PITCH, y: top + p * LANE, w: SLOTS * PITCH, d: LANE - 3, r: 1 };
}

// Where a node's label lies on the floor in iso: in front of it, else along its right side,
// whichever no nearer node hides. `labelSpots` is shared with `build.mjs --check`.
function labelSpots(node) {
  const half = node.label.length * 2.4;
  const front = { at: [node.cx, node.plan.y + node.plan.d + 10], along: "x" };
  front.marks = [[node.cx - half, front.at[1]], front.at, [node.cx + half, front.at[1]]];
  const side = { at: [node.plan.x + node.plan.w + 9, node.cy], along: "y" };
  side.marks = [[side.at[0], node.cy - half], side.at, [side.at[0], node.cy + half]];
  return [front, side];
}

// The spots a label may take: the one `labelAt` forces, else front then side.
function labelTries(node) {
  const [front, side] = labelSpots(node);
  return node.labelAt === "side" ? [side] : node.labelAt === "front" ? [front] : [front, side];
}

function hiddenBy(model, node, spot, P) {
  const marks = spot.marks.map((m) => ({ s: k.iso([m[0], m[1], 0], P), depth: k.depthOf([m[0], m[1], 0], P) }));
  const blockers = [];
  for (const other of model.nodes) {
    if (other === node) continue;
    const hull = k.convexHull(k.pointsAt(k.boxCorners(other.plan, 0, heightOf(other)), P));
    const front = k.depthOf([other.cx, other.cy, 0], P);
    if (marks.some((m) => front > m.depth - 20 && inside(hull, m.s))) blockers.push(other.id);
  }
  return blockers;
}

function inside(hull, [x, y]) {
  for (let i = 0; i < hull.length; i++) {
    const [ax, ay] = hull[i];
    const [bx, by] = hull[(i + 1) % hull.length];
    if ((bx - ax) * (y - ay) - (by - ay) * (x - ax) < 0) return false;
  }
  return hull.length > 2;
}

function isoLabel(node, c, model) {
  // Morph frames reuse the spot chosen for the resting view.
  if (model.fastLabels && node.labelSpot) return k.faceTextSvg(k.topMatrix(node.labelSpot.at, 0, c.P, node.labelSpot.along), node.label, { size: 8, tone: "hi", anchor: "middle" });
  const tries = labelTries(node);
  const spot = tries.find((s) => !hiddenBy(model, node, s, c.P).length) || tries[0];
  node.labelSpot = spot;
  return k.faceTextSvg(k.topMatrix(spot.at, 0, c.P, spot.along), node.label, { size: 8, tone: "hi", anchor: "middle" });
}

// ---------------------------------------------------------------------------------------------
// Flat renderers: 2D glyphs that fill each footprint, in screen space.

function flatKit(P) {
  const at = (p) => k.iso([p[0], p[1], 0], P);
  const box = (plan) => {
    const [x0, y0] = at([plan.x, plan.y]);
    const [x1, y1] = at([plan.x + plan.w, plan.y + plan.d]);
    return { x: x0, y: y0, w: x1 - x0, h: y1 - y0 };
  };
  const rect = (b, cls = "tp-f", rx = 3, extra = "") => `<rect class="${cls}" x="${r1(b.x)}" y="${r1(b.y)}" width="${r1(b.w)}" height="${r1(b.h)}" rx="${rx}"${extra}/>`;
  const line = (pts, tone = "lo") => k.lineSvg(k.pathOf(pts), { tone });
  const text = (x, y, s, size = 8, cls = "tp-ft") => `<text class="${cls}" x="${r1(x)}" y="${r1(y)}" font-size="${size}" text-anchor="middle">${escape(s)}</text>`;
  const led = (id, x, y, r = 1.6) => `<circle class="tp-led" data-led="${escape(id)}" cx="${r1(x)}" cy="${r1(y)}" r="${r}"/>`;
  return { at, box, rect, line, text, led, P, scale: k.cameraOf(P).k };
}

const FLAT = {
  service(node, f) {
    const b = f.box(node.plan);
    const out = [];
    const stack = Math.min(node.replicas - 1, 3);
    for (let r = stack; r > 0; r--) out.push(f.rect({ ...b, x: b.x + r * 2.5, y: b.y - r * 2.5 }, "tp-f tp-f-back", 4));
    out.push(f.rect(b, "tp-f", 4));
    out.push(f.line([[b.x, b.y + 11], [b.x + b.w, b.y + 11]], "faint"));
    for (let r = 0; r < node.replicas; r++) out.push(f.led(`${node.id}:${r}`, b.x + 6 + r * 6, b.y + 5.5, 1.7));
    if (node.kind === "worker") out.push(`<circle class="tp-f-mark" cx="${r1(b.x + b.w - 7)}" cy="${r1(b.y + 5.5)}" r="2.6"/>`);
    return out.join("");
  },
  worker(node, f) {
    return FLAT.service(node, f);
  },
  cache(node, f) {
    const b = f.box(node.plan);
    const out = [f.rect(b, "tp-f", 4)];
    for (let i = 0; i < 4; i++) out.push(f.rect({ x: b.x + 7 + i * ((b.w - 14) / 4), y: b.y + 6, w: (b.w - 14) / 4 - 3, h: 7 }, "tp-f tp-f-chip", 1));
    out.push(f.led(`${node.id}:0`, b.x + b.w - 6, b.y + b.h - 10, 1.6));
    return out.join("");
  },
  db(node, f) {
    const b = f.box(node.plan);
    const rx = b.w / 2 - 2;
    const ry = Math.min(5, b.h / 6);
    const cx = b.x + b.w / 2;
    const top = b.y + ry + 1;
    const bot = b.y + b.h - ry - 1;
    const out = [`<path class="tp-f" d="M${r1(cx - rx)} ${r1(top)}V${r1(bot)}A${r1(rx)} ${r1(ry)} 0 0 0 ${r1(cx + rx)} ${r1(bot)}V${r1(top)}A${r1(rx)} ${r1(ry)} 0 0 0 ${r1(cx - rx)} ${r1(top)}Z"/>`];
    out.push(`<ellipse class="tp-f tp-f-top" cx="${r1(cx)}" cy="${r1(top)}" rx="${r1(rx)}" ry="${r1(ry)}"/>`);
    out.push(`<path class="k-line" data-tone="faint" d="M${r1(cx - rx)} ${r1(top + 9)}A${r1(rx)} ${r1(ry)} 0 0 0 ${r1(cx + rx)} ${r1(top + 9)}"/>`);
    out.push(f.led(`${node.id}:0`, cx + rx - 5, top + 14, 1.6));
    if (node.role) out.push(f.text(cx, top + 2.6, node.role.toUpperCase(), 5.5, "tp-ft tp-ft-dim"));
    if (node.tables || node.hasTables) out.push(`<g class="tp-rows-badge" data-rows="${escape(node.id)}">${f.text(cx, top + 22, "0 rows", 6, "tp-ft tp-ft-dim")}</g>`);
    return out.join("");
  },
  storage(node, f) {
    const b = f.box(node.plan);
    const cx = b.x + b.w / 2;
    const out = [`<path class="tp-f" d="M${r1(b.x + 2)} ${r1(b.y + 6)}L${r1(b.x + 7)} ${r1(b.y + b.h - 2)}H${r1(b.x + b.w - 7)}L${r1(b.x + b.w - 2)} ${r1(b.y + 6)}Z"/>`];
    out.push(`<ellipse class="tp-f tp-f-top" cx="${r1(cx)}" cy="${r1(b.y + 6)}" rx="${r1(b.w / 2 - 2)}" ry="4"/>`);
    out.push(f.led(`${node.id}:0`, cx, b.y + 16, 1.6));
    return out.join("");
  },
  lb(node, f) {
    const b = f.box(node.plan);
    const cx = b.x + b.w / 2;
    const cy = b.y + b.h / 2;
    const r = Math.min(b.w, b.h) / 2;
    const oct = Array.from({ length: 8 }, (_, i) => {
      const a = ((i + 0.5) / 8) * Math.PI * 2;
      return [cx + r * Math.cos(a), cy + r * Math.sin(a)];
    });
    const out = [`<path class="tp-f" d="${k.pathOf(oct, true)}"/>`];
    for (const a of [-0.6, 0, 0.6]) out.push(k.lineSvg(k.pathOf([[cx - r * 0.45, cy - 3], [cx + r * 0.5 * Math.cos(a), cy - 3 + r * 0.5 * Math.sin(a)]]), { tone: "mid", free: "end" }));
    out.push(f.led(`${node.id}:0`, cx - r * 0.45, cy - 3, 1.8));
    return out.join("");
  },
  gateway(node, f) {
    const b = f.box(node.plan);
    const out = [f.rect(b, "tp-f", 4)];
    out.push(`<path class="k-line" data-tone="lo" d="M${r1(b.x + 8)} ${r1(b.y + b.h)}V${r1(b.y + 12)}Q${r1(b.x + b.w / 2)} ${r1(b.y + 2)} ${r1(b.x + b.w - 8)} ${r1(b.y + 12)}V${r1(b.y + b.h)}"/>`);
    out.push(f.led(`${node.id}:0`, b.x + b.w / 2, b.y + 9, 1.6));
    return out.join("");
  },
  client(node, f) {
    const b = f.box(node.plan);
    const out = [f.rect({ x: b.x, y: b.y, w: b.w, h: b.h - 7 }, "tp-f", 3)];
    out.push(f.rect({ x: b.x + 3, y: b.y + 3, w: b.w - 6, h: b.h - 13 }, "tp-screen", 1));
    out.push(f.line([[b.x + b.w / 2, b.y + b.h - 7], [b.x + b.w / 2, b.y + b.h - 1]], "lo"));
    out.push(f.rect({ x: b.x + b.w / 2 - 8, y: b.y + b.h - 2, w: 16, h: 2 }, "tp-f", 1));
    out.push(f.led(`${node.id}:0`, b.x + b.w - 7, b.y + b.h - 10.5, 1.4));
    return out.join("");
  },
  box(node, f) {
    const b = f.box(node.plan);
    return [f.rect(b, "tp-f", 4), f.led(`${node.id}:0`, b.x + 6, b.y + 6, 1.6)].join("");
  },
  kafka(node, f) {
    const b = f.box(node.plan);
    const out = [f.rect(b, "tp-f", 4)];
    const s = f.scale;
    for (let p = 0; p < node.partitions; p++) {
      const lb = f.box(laneOf(node, p));
      out.push(`<g class="tp-lane" data-lane="${escape(node.id)}:${p}">`);
      for (let i = 0; i < SLOTS; i++) out.push(`<rect class="tp-cell tp-fcell" data-cell="${escape(node.id)}:${p}:${i}" x="${r1(lb.x + i * PITCH * s + 0.8)}" y="${r1(lb.y + 0.8)}" width="${r1(PITCH * s - 1.6)}" height="${r1(lb.h - 1.6)}" rx="1"/>`);
      (node.groups || ["default"]).slice(0, 3).forEach((_, g) => {
        out.push(`<path class="tp-cursor tp-fcursor" data-cursor="${escape(node.id)}:${g}:${p}" data-g="${g}" d="M${r1(lb.x)} ${r1(lb.y - 2 - g)}V${r1(lb.y + lb.h + 2 + g)}"/>`);
      });
      out.push(`</g>`);
    }
    if (node.brokers) {
      const n = node.brokers;
      const span = (b.h - 8) / n;
      for (let i = 0; i < n; i++) {
        const unit = { x: b.x + 5 * s, y: b.y + 4 * s + i * span + 0.6, w: 12 * s, h: span - 1.2 };
        out.push(`<g class="tp-broker" data-part="broker:${i}">${f.rect(unit, "tp-f tp-f-chip", 1)}${f.led(`${node.id}:b${i}`, unit.x + unit.w - 3, unit.y + unit.h / 2, 1.2)}</g>`);
      }
    } else for (let b2 = 0; b2 < 3; b2++) out.push(f.led(`${node.id}:b${b2}`, b.x + b.w - 4, b.y + 6 + b2 * 4, 1.1));
    return out.join("");
  },
  cdn(node, f) {
    const b = f.box(node.plan);
    const cx = b.x + b.w / 2;
    const cy = b.y + b.h / 2;
    const r = Math.min(b.w, b.h) / 2 - 4;
    return [f.rect(b, "tp-f", 4), `<circle class="tp-f tp-f-top" cx="${r1(cx)}" cy="${r1(cy)}" r="${r1(r)}"/>`, `<ellipse class="tp-f-mark" cx="${r1(cx)}" cy="${r1(cy)}" rx="${r1(r * 0.45)}" ry="${r1(r)}"/>`, k.lineSvg(`M${r1(cx - r)} ${r1(cy)}H${r1(cx + r)}`, { tone: "faint" }), f.led(`${node.id}:0`, b.x + 5, b.y + b.h - 5, 1.5)].join("");
  },
  dns(node, f) {
    const b = f.box(node.plan);
    const cx = b.x + b.w / 2;
    return [`<path class="tp-f" d="M${r1(cx - 9)} ${r1(b.y + b.h - 1)}L${r1(cx - 2)} ${r1(b.y + 8)}H${r1(cx + 2)}L${r1(cx + 9)} ${r1(b.y + b.h - 1)}Z"/>`, `<circle class="tp-f tp-f-top" cx="${r1(cx)}" cy="${r1(b.y + 7)}" r="5"/>`, f.led(`${node.id}:0`, cx, b.y + 7, 1.6)].join("");
  },
  external(node, f) {
    const b = f.box(node.plan);
    return [f.rect(b, "tp-f tp-f-ext", 4), ...[0, 1, 2].map((i) => `<circle class="tp-f-dot" cx="${r1(b.x + b.w / 2 - 6 + i * 6)}" cy="${r1(b.y + b.h / 2)}" r="1.3"/>`), f.led(`${node.id}:0`, b.x + 6, b.y + 6, 1.5)].join("");
  },
  scheduler(node, f) {
    const b = f.box(node.plan);
    const cx = b.x + b.w / 2;
    const cy = b.y + b.h / 2;
    const r = Math.min(b.w, b.h) / 2 - 3;
    return [f.rect(b, "tp-f", 4), `<circle class="tp-f tp-f-top" cx="${r1(cx)}" cy="${r1(cy)}" r="${r1(r)}"/>`, k.lineSvg(`M${r1(cx)} ${r1(cy)}V${r1(cy - r * 0.65)}M${r1(cx)} ${r1(cy)}L${r1(cx + r * 0.45)} ${r1(cy + r * 0.2)}`, { tone: "hi", free: "end" }), f.led(`${node.id}:0`, b.x + 5, b.y + b.h - 5, 1.5)].join("");
  },
  flags(node, f) {
    const b = f.box(node.plan);
    const out = [f.rect(b, "tp-f", 4)];
    flagRows(node).forEach(({ name, slot, knob }) => {
      out.push(f.rect(f.box(slot), "tp-f tp-f-chip", 2));
      out.push(`<g class="tp-knob" data-flag="${escape(name)}">${f.rect(f.box(knob), "tp-f-knob", 1.5)}</g>`);
      const sb = f.box(slot);
      out.push(`<text class="tp-ft tp-ft-dim" x="${r1(b.x + 4)}" y="${r1(sb.y + sb.h - 0.5)}" font-size="5.5" text-anchor="start">${escape(name.slice(0, 6))}</text>`);
    });
    out.push(f.led(`${node.id}:0`, b.x + b.w - 5, b.y + b.h - 4, 1.4));
    return out.join("");
  },
  queue(node, f) {
    return FLAT.kafka(node, f);
  },
};

// ---------------------------------------------------------------------------------------------
// One view: markup plus what the live page needs to move things in it.

// `camera` ({ azimuth, elevation }) overrides the iso camera: the page uses it to morph between views.
function renderView(model, view, width = 640, camera, options) {
  const { P, width: W, height: H } = projectionOf(model, view, width, camera, options);
  const features = model.features || {};
  const out = [];
  const iso = view === "iso" ? isoKit(P) : null;
  const flat = view === "flat" ? flatKit(P) : null;

  // Zones and regions: floor plates (iso) or dashed regions (flat). A region is heavier.
  for (const group of model.groups) {
    if (iso) {
      const z0 = -(group.depth + 1);
      const h = group.region ? 1.6 : 1;
      out.push(`<path class="k-halo" d="${k.haloOf(group.box, z0, h, P)}" style="opacity:calc(var(--tp-halo-opacity) * .5)"/>`);
      out.push(`<g class="tp-zone" data-depth="${group.depth}"${group.region ? ' data-region=""' : ""}>${iso.S(k.slabOf(group.box, z0, h, P, 6, 0.6), { tone: group.region ? "mid" : "lo", crease: "faint" })}`);
      out.push(iso.L(k.planOutline(k.insetPlan(group.box, 4), z0 + h, P, 5), { tone: "faint", dashed: !group.region }));
      // Along the plate's left edge, where node labels never sit.
      out.push(k.faceTextSvg(k.topMatrix([group.box.x + 6.5, group.box.y + group.box.d - 8], z0 + h, P, "y"), String(group.label).toUpperCase(), { size: group.region ? 7 : 6, tone: group.region ? "hi" : "mid" }));
      out.push(`</g>`);
    } else {
      const b = flat.box(group.box);
      out.push(`<g class="tp-zone" data-depth="${group.depth}"${group.region ? ' data-region=""' : ""}>${flat.rect(b, "tp-fzone", 8)}<text class="tp-ft tp-ft-dim" x="${r1(b.x + 8)}" y="${r1(b.y + b.h - 7)}" font-size="${group.region ? 8 : 7}" text-anchor="start">${escape(String(group.label).toUpperCase())}</text></g>`);
    }
  }

  // Edges on the floor, with a chevron where they arrive and a port ring (or a breaker) at the caller.
  const labels = [];
  for (const edge of model.edges) {
    const line = k.onTop(edge.points, 0, P);
    const start = k.iso([edge.points[0][0], edge.points[0][1], 0], P);
    const dashed = edge.kind === "async" || edge.kind === "replication" || edge.kind === "config";
    const [a, b] = [edge.points[edge.points.length - 2], edge.points[edge.points.length - 1]];
    const len = Math.hypot(b[0] - a[0], b[1] - a[1]) || 1;
    const u = [(b[0] - a[0]) / len, (b[1] - a[1]) / len];
    const v = [-u[1], u[0]];
    const tip = [b[0] - u[0] * 1.5, b[1] - u[1] * 1.5];
    const head = [
      [tip[0] - u[0] * 5 + v[0] * 3, tip[1] - u[1] * 5 + v[1] * 3],
      tip,
      [tip[0] - u[0] * 5 - v[0] * 3, tip[1] - u[1] * 5 - v[1] * 3],
    ];
    const tone = edge.kind === "config" ? "lo" : "mid";
    const port = edge.breaker
      ? `<circle class="tp-breaker" data-breaker="${edge.index}" cx="${r1(start[0])}" cy="${r1(start[1])}" r="2.4"/>`
      : edge.sync ? `<circle class="tp-port" cx="${r1(start[0])}" cy="${r1(start[1])}" r="1.4"/>` : "";
    out.push(`<g class="tp-edge" data-edge="${edge.index}" data-kind="${edge.kind}"><path class="tp-edge-bed" d="${line}"/>${k.lineSvg(line, { tone, dashed })}${k.lineSvg(k.onTop(head, 0, P), { tone, free: true })}${port}</g>`);
    if (features.labels !== false && edge.kind !== "config" && (edge.label || model.labels === "rate" || edge.flag || edge.unless)) labels.push(edgeLabel(edge, P, view));
  }
  if (iso) for (const node of model.nodes) out.push(`<g class="tp-label" data-label="${escape(node.id)}">${isoLabel(node, iso, model)}</g>`);
  else for (const node of model.nodes) {
    const b = flat.box(node.plan);
    out.push(`<g class="tp-label" data-label="${escape(node.id)}">${flat.text(b.x + b.w / 2, b.y + b.h + 10, node.label, 8)}</g>`);
  }
  out.push(...labels);
  out.push(`<g class="tp-packets" data-packets=""></g>`);

  // Nodes, back to front.
  const order = [...model.nodes].sort((a, b) => k.depthOf([a.cx, a.cy, 0], P) - k.depthOf([b.cx, b.cy, 0], P));
  for (const node of order) {
    const halo = iso ? `<path class="k-halo" d="${k.haloOf(k.insetPlan(node.plan, 2), 0, Math.min(heightOf(node), 10), P)}"/>` : "";
    const component = COMPONENTS[node.kind];
    const body = component
      ? (iso ? isoComponent(node, iso, k) : flatComponent(node, flat, k))
      : (iso ? (ISO[node.kind] || ISO.box)(node, iso) : (FLAT[node.kind] || FLAT.box)(node, flat));
    const extra = (node.sidecar ? sidecarOf(node, iso, flat) : "") + (node.queue ? queueCellsOf(node, iso, flat) : "");
    out.push(`<g class="tp-node" data-node="${escape(node.id)}" data-kind="${node.kind}">${halo}${body}${extra}</g>`);
  }

  const svg = k.figureSvg({ width: W, height: H, label: describe(model), body: out, className: `tp-svg tp-${view}` });
  const lift = iso ? 1.5 : 0;
  const toScreen = (p, z = 0) => k.iso([p[0], p[1], z], P);
  const vec = (dx, dy) => {
    const a = toScreen([0, 0]);
    const b = toScreen([dx, dy]);
    return [b[0] - a[0], b[1] - a[1]];
  };
  const flagNode = model.nodes.find((node) => node.kind === "flags");
  const data = {
    P,
    edges: model.edges.map((edge) => edge.points.map((p) => toScreen(p, lift)).map(([x, y]) => [r1(x), r1(y)])),
    step: vec(PITCH, 0),
    flagStep: flagNode ? vec(flagRows(flagNode)[0]?.travel || 0, 0) : [0, 0],
    packet: iso ? isoPacket(P) : null,
  };
  return { svg, data, P, width: W, height: H };
}

// A live label on an edge: at the middle of its longest leg, set off to one side.
function edgeLabel(edge, P, view) {
  let best = 0;
  let leg = [edge.corners[0], edge.corners[1]];
  for (let i = 1; i < edge.corners.length; i++) {
    const [a, b] = [edge.corners[i - 1], edge.corners[i]];
    const len = Math.hypot(b[0] - a[0], b[1] - a[1]);
    if (len > best) {
      best = len;
      leg = [a, b];
    }
  }
  const along = Math.abs(leg[1][0] - leg[0][0]) >= Math.abs(leg[1][1] - leg[0][1]) ? "x" : "y";
  const mid = [(leg[0][0] + leg[1][0]) / 2, (leg[0][1] + leg[1][1]) / 2];
  const text = edge.label || "";
  if (view === "iso") {
    const at = along === "x" ? [mid[0], mid[1] - 6] : [mid[0] + 6, mid[1]];
    return `<g class="tp-elabel" data-elabel="${edge.index}">${k.faceTextSvg(k.topMatrix(at, 0, P, along), text, { size: 6.2, tone: "mid", anchor: "middle" })}</g>`;
  }
  const [x, y] = k.iso([mid[0], mid[1], 0], P);
  return `<g class="tp-elabel" data-elabel="${edge.index}"><text class="tp-ft tp-elabel-text" x="${r1(along === "x" ? x : x + 4)}" y="${r1(along === "x" ? y - 3.5 : y + 2)}" font-size="6.2" text-anchor="${along === "x" ? "middle" : "start"}">${escape(text)}</text></g>`;
}

// A sidecar proxy: a small box on the service's right-hand side.

        const r = byName.get(name) || { rate: 0, p50: 0, p99: 0, errors: 0, count: 0 };
        const calls = (declared[name]?.calls || []).map((c) => `${c.routing ? "routing rules" : specOf.get(c.to)?.label || c.to}${c.op ? ` ${c.op}${c.table ? ` ${c.table}` : ""}` : ""}${c.p != null && c.p < 1 ? ` (${Math.round(c.p * 100)}%)` : ""}`).join(", ");
        return `<button type="button" class="tp-route" data-route="${esc(name)}"${routeFilter === name ? " data-on" : ""}><span class="tp-route-name">${esc(name)}${calls ? `<small>→ ${esc(calls)}</small>` : ""}</span><span>${rate(r.rate)}</span><span>${r.count ? ms(r.p50) : "—"}</span><span>${r.count ? ms(r.p99) : "—"}</span><span${r.errors ? " data-bad" : ""}>${r.errors ? rate(r.errors) : "·"}</span></button>`;
      });
      return `<div class="tp-routes"><div class="tp-route tp-route-head"><span>route</span><span>rate</span><span>p50</span><span>p99</span><span>errors</span></div>${rows.join("")}</div><p class="tp-ins-note">Pick a route to follow only its packets.</p>`;
    },
    function routing(id) {
      if (!sim.trafficState) return "";
      const classes = sim.trafficOf(id).filter(c => c.rate > 0).map(c => `${esc(DATA.traffic?.[c.id]?.label || c.label)} ${rate(c.rate)} arrivals`).join(" · ");
      const decisions = sim.routingOf(id).map(d => `<div class="tp-decision">${esc(d.rule)} → ${esc(d.to || "reject")} · ${d.count} ${esc(d.outcome)}</div>`).join("");
      return `<p class="tp-ins-note">${classes}${decisions ? ` · decisions over the last ${sim.cfg.window}s` : ""}</p>${decisions}`;
    },
    function tables(id) {
      const list = sim.tablesOf(id);
      if (!list.length) return "";
      // Replicas of this primary, to show how far behind each one is.
      const replicas = DATA.spec.edges.filter((e) => e.from === id && e.kind === "replication").map((e) => e.to);
      return list
        .map((t) => {
          const bits = [`<b>${esc(t.name)}</b> ${t.count} rows`, t.primary ? `${rate(t.applied)} applied` : `${rate(t.writes)} writes`];
          if (t.inserts || t.updates) bits.push(`${rate(t.inserts)} inserts · ${rate(t.updates)} updates`);
          if (t.conflicts) bits.push(`<i>${rate(t.conflicts)} conflicts</i>`);
          if (t.stale) bits.push(`<em>${rate(t.stale)} stale reads</em>`);
          if (t.lost) bits.push(`<i>${rate(t.lost)} lost updates</i>`);
          if (t.lockWaits) bits.push(`${rate(t.lockWaits)} lock waits`);
          const field = (r) => Object.entries(r.fields).map(([name, value]) => `${name}: ${typeof value === "object" ? JSON.stringify(value) : value}`).join(" · ");
          const rows = t.rows.map((r) => `<button type="button" class="tp-row" data-table="${esc(t.name)}" data-key="${esc(r.key)}" aria-label="Inspect ${esc(t.name)} ${esc(t.key)} ${esc(r.key)}"${r.age != null && r.age < 0.7 ? " data-fresh" : ""}${r.behind ? ` data-behind title="behind the primary"` : ""}><b>${esc(r.key)}</b><span>${r.version == null ? "gone" : `v${r.version}`}</span><span>${esc(field(r))}</span></button>`).join("");
          // WAL: the newest entries; amber ones haven't reached every replica yet.
          const shipped = replicas.length ? Math.min(...replicas.map((rid) => sim.tablesOf(rid).find((x) => x.name === t.name)?.wal.applied ?? 0)) : Infinity;
          const cells = t.wal.recent.map((e) => `<i title="lsn ${e.lsn} ${e.op} ${esc(e.key)} v${e.version}"${e.lsn > shipped ? " data-pending" : ""}></i>`).join("");
          const lagNotes = t.primary
            ? [`${t.behind} ${t.behind === 1 ? "entry" : "entries"} behind ${esc(specOf.get(t.primary)?.label || t.primary)}${specOf.get(id)?.lag ? ` (applies ${specOf.get(id).lag}s late)` : ""}`]
            : replicas.map((rid) => {
                const r = sim.tablesOf(rid).find((x) => x.name === t.name);
                return `${esc(specOf.get(rid)?.label || rid)} ${r ? r.behind : "?"} behind`;
              });
          return `<div class="tp-table"><div class="tp-table-head">${bits.join(" · ")}</div><div class="tp-rows">${rows || '<div class="tp-row"><span>no rows yet</span></div>'}</div>${cells ? `<div class="tp-wal"><span>WAL</span>${cells}</div>` : ""}<p class="tp-wal-note">lsn ${t.wal.lsn}${lagNotes.length ? ` · ${lagNotes.join(" · ")}` : ""}</p></div>`;
        })
        .join("");
    },
  ];

  function render() {
    if (!open) return;
    const node = sim.nodes.get(open);
    const spec = specOf.get(open);
    write("kind", $(".tp-ins-kind"), esc(spec.component || spec.kind));
    write("name", $(".tp-ins-name"), esc(spec.label || open));
    write("stat", $(".tp-ins-stat"), esc(sim.statsOf(open).replace(/^[^·]*·\s*/, "")));
    write("fail", $(".tp-ins-fail"), node.up ? "Fail" : "Restore");
    // Following needs requests through this node: offered once it has seen some.
    $(".tp-ins-follow").hidden = !(DATA.features.trace && typeof tracer !== "undefined" && (node.flow > 0 || node.emit || node.workload));
    write("body", $(".tp-ins-body"), sections.map((section) => section(open)).join(""));
    panel.toggleAttribute("data-down", !node.up);
  }

  function show(id) {
    open = id;
    written.clear();
    panel.hidden = false;
    tip.hidden = true;
    render();
  }
  function close() {
    open = null;
    panel.hidden = true;
    routeFilter = null;
    recordFilter = null;
  }

  hooks.select.push((id) => (open === id ? close() : show(id)));
  hooks.key.push((event) => {
    if (event.key !== "Escape" || !open) return false;
    close();
    return true;
  });
  let clock = 0;
  hooks.tick.push((dt) => {
    clock += dt;
    if (clock < 0.25) return;
    clock = 0;
    render();
    if (!tip.hidden && focus) drawTip(focus);
  });
  $(".tp-ins-close").addEventListener("click", close);
  $(".tp-ins-follow").addEventListener("click", () => {
    const id = open;
    tracer.follow(routeFilter || sim.routesOf(id)[0]?.name);
  });
  $(".tp-ins-fail").addEventListener("click", () => {
    if (open) toggle(open);
    render();
  });
  panel.addEventListener("click", (event) => {
    const row = event.target.closest(".tp-route[data-route]");
    if (!row) return;
    recordFilter = null;
    routeFilter = routeFilter === row.dataset.route ? null : row.dataset.route;
    written.delete("body");
    render();
  });

  // Level 1: a compact card over a hovered node that has routes. Nothing for plain nodes.
  function drawTip(id) {
    const list = sim.routesOf(id).slice(0, 4);
    if (!list.length || open === id) {
      tip.hidden = true;
      return;
    }
    tip.innerHTML = list.map((r) => `<div><b>${esc(r.name)}</b> ${rate(r.rate)}${r.count ? ` · p99 ${ms(r.p99)}` : ""}${r.errors ? ` · <i>${rate(r.errors)} err</i>` : ""}</div>`).join("");
    const el = views[view].nodes.get(id);
    if (!el) return;
    const box = el.getBoundingClientRect();
    const host = stage.getBoundingClientRect();
    tip.style.left = `${Math.max(0, Math.min(host.width - 220, box.left - host.left + box.width / 2 - 110))}px`;
    tip.style.top = `${Math.max(0, box.top - host.top - 8)}px`;
    tip.hidden = false;
  }
  hooks.focus.push((id) => (id ? drawTip(id) : (tip.hidden = true)));

  window.__topo.inspector = { show, close, get open() { return open; } };
  return { show, close, sections, render, get open() { return open; } };
})();

// Saved-record disclosure. Reads the actual store/WAL; it never creates or edits data.
const recordInspector = (() => {
  const esc = (value) => String(value).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  const panel = document.querySelector(".tp-inspect");
  let selected = null;
  const text = (value) => typeof value === "object" ? JSON.stringify(value) : String(value);

  function section(id) {
    if (!selected || selected.node !== id) return "";
    const { table, key } = selected;
    const record = sim.recordOf(id, table, key);
    if (!record) return "";
    const { row, latest, copies, keyName } = record;
    const following = recordFilter?.table === table && recordFilter.key === key;
    const fields = row ? [[keyName, key], ...Object.entries(row.fields).filter(([name]) => name !== keyName)] : [];
    const identifier = value => '"' + String(value).replace(/"/g, '""') + '"';
    const query = `SELECT * FROM ${identifier(table)} WHERE ${identifier(keyName)} = ${key};`;
    const rows = fields.map(([name, value]) => `<dt>${esc(name)}</dt><dd>${esc(text(value))}</dd>`).join("");
    const copyRows = copies.map(copy => {
      const { row: saved, latest: entry, behind } = copy;
      return `<div class="tp-record-copy" data-copy="${esc(copy.id)}"${behind ? " data-behind" : ""}><b>${esc(copy.label)}</b> · ${saved ? `v${saved.version}` : "not present"}${behind ? " · behind" : ""}<small>${saved ? esc(Object.entries(saved.fields).map(([k, v]) => `${k}: ${text(v)}`).join(" · ")) || "no fields" : "No saved row at this node"}</small><small>${entry ? `last retained ${esc(entry.op)} · lsn ${entry.lsn} · v${entry.version}` : "No retained WAL entry for this key"}</small></div>`;
    }).join("");
    return `<section class="tp-record" data-record-key="${esc(key)}"><header><strong>${esc(table)} · ${esc(keyName)} ${esc(key)}</strong><button type="button" data-follow-record aria-pressed="${following}">${following ? "Stop following writes" : "Follow writes"}</button><button type="button" data-close-record aria-label="Close record">×</button></header><pre class="tp-record-query">${esc(query)}</pre><p class="tp-ins-note">${row ? `1 saved row · version ${row.version} · all ${fields.length} fields` : "0 saved rows"} · read-only view of simulated storage</p><dl aria-label="Saved record fields">${rows}</dl><p class="tp-ins-note">Saved at ${esc(record.label)}. ${latest ? `Latest retained primary write: ${esc(latest.op)} v${latest.version}, lsn ${latest.lsn}, at ${latest.at.toFixed(2)}s.` : "No primary write for this key remains in the bounded WAL history."}</p><div class="tp-record-copies">${copyRows}</div><p class="tp-ins-note">${following ? "Following this key: its packets stay bright; saved versions and WAL entries update here as workload writes arrive." : "Select Follow writes to keep this key in view as traffic saves and replicates it."}</p></section>`;
  }

  inspector.sections.push(section);
  panel.addEventListener("click", event => {
    const row = event.target.closest("button.tp-row[data-table]");
    if (row) {
      selected = { node: inspector.open, table: row.dataset.table, key: Number(row.dataset.key) };
      recordFilter = null;
    } else if (event.target.closest("[data-follow-record]") && selected) {
      if (recordFilter) recordFilter = null;
      else {
        if (typeof tracer !== "undefined") tracer.stop();
        routeFilter = null;
        recordFilter = { table: selected.table, key: selected.key };
      }
    } else if (event.target.closest("[data-close-record]")) {
      selected = null;
      recordFilter = null;
    } else return;
    inspector.render();
  });
  hooks.select.push(() => { selected = null; recordFilter = null; });
  window.__topo.records = { get selected() { return selected; }, get following() { return recordFilter; } };
  return { section };
})();

// Follow one request: level 3 of the disclosure ladder. Inlined after topo-inspect.js when
// the `trace` feature is on. The next request on a route is picked; time slows to a quarter;
// its packets and path stay lit while everything else dims; and a timeline under the card
// lists each step, indented under the call that made it, with its model-time duration.
const tracer = (() => {
  const esc = (text) => String(text).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  const labelOf = (id) => DATA.spec.nodes.find((node) => node.id === id)?.label || id;
  const ms = (n) => (n >= 1000 ? `${(n / 1000).toFixed(1)}s` : n >= 10 ? `${n.toFixed(0)}ms` : `${n.toFixed(1)}ms`);
  const panel = document.createElement("section");
  panel.className = "tp-trace";
  panel.hidden = true;
  panel.setAttribute("aria-live", "polite");
  panel.innerHTML = `<header><span class="tp-ins-kind">following</span><strong class="tp-tr-name"></strong><span class="tp-tr-stat"></span><button type="button" class="tp-tr-again">Another</button><button type="button" class="tp-ins-close" aria-label="Stop following">×</button></header><div class="tp-tr-body"></div>`;
  stage.after(panel);
  let endpoint = null;
  let active = false;
  let lingering = 0;

  function follow(route) {
    inspector.close();
    endpoint = route || null;
    sim.follow(endpoint, trafficDisplay?.selected);
    active = true;
    lingering = 0;
    timeScale = 0.25;
    stage.setAttribute("data-tracing", "");
    panel.hidden = false;
    render();
  }
  function stop() {
    if (!active && panel.hidden) return;
    active = false;
    sim.unfollow();
    timeScale = 1;
    panel.hidden = true;
    stage.removeAttribute("data-tracing");
    for (const v of viewList) {
      for (const el of v.nodes.values()) el.removeAttribute("data-traced");
      v.edges.forEach((el) => el.removeAttribute("data-traced"));
    }
  }

  function render() {
    const t = sim.tracing;
    if (!t) return;
    const spans = t.spans;
    const root = spans[0];
    panel.querySelector(".tp-tr-name").textContent = t.endpoint || endpoint || "a request";
    panel.querySelector(".tp-tr-stat").textContent = !root ? "waiting for the next one…" : t.done ? `${ms(root.total)}${root.ok === false ? " · failed" : ""}` : "in flight…";
    if (sim.trafficState && root) panel.querySelector(".tp-tr-stat").textContent += t.truncated ? " · truncated (256 spans / 60s limit)" : sim.tracePending() ? (t.done ? " · async pending" : "") : " · journey complete";
    // Light the path: every node with a span, and the edges between parent and child spans.
    const nodes = new Set(spans.map((s) => s.node));
    const edges = new Set();
    for (const s of spans) if (s.parent != null) {
      const from = spans[s.parent]?.node;
      const index = DATA.spec.edges.findIndex((e) => e.from === from && e.to === s.node);
      if (index >= 0) edges.add(index);
    }
    for (const v of viewList) {
      for (const [id, el] of v.nodes) el.toggleAttribute("data-traced", nodes.has(id));
      v.edges.forEach((el, index) => el.toggleAttribute("data-traced", edges.has(index)));
    }
    if (!root) return void (panel.querySelector(".tp-tr-body").innerHTML = "");
    const total = Math.max(...spans.map((s) => (s.start || 0) + (s.total || 0)), root.total || 0, 0.001);
    const order = [];
    const depth = new Map();
    const walk = (parent, d) => spans.filter((s) => s.parent === parent).forEach((s) => (order.push(s), depth.set(s.id, d), walk(s.id, d + 1)));
    walk(null, 0);
    panel.querySelector(".tp-tr-body").innerHTML = (root.context ? `<div class="tp-tr-context">${esc(DATA.traffic?.[root.traffic]?.label || root.traffic || "Unclassified")} · ${esc(JSON.stringify(root.context))}</div>` : "") + order
      .map((s) => {
        const left = ((s.start || 0) / total) * 100;
        const width = s.done ? Math.max(0.8, ((s.total || 0) / total) * 100) : 0.8;
        return `<div class="tp-span"${s.ok === false ? " data-bad" : ""}${s.done ? "" : " data-open"}><span class="tp-span-name" style="padding-left:${depth.get(s.id) * 12}px">${esc(labelOf(s.node))}${s.label && s.parent != null ? ` <small>${esc(s.label)}</small>` : ""}${s.async ? " <small>async</small>" : ""}</span><span class="tp-span-ms">${s.done ? ms(s.total) : "…"}</span><span class="tp-span-bar"><i style="left:${left.toFixed(2)}%;width:${width.toFixed(2)}%"></i></span></div>${(s.decisions || []).map(d => `<div class="tp-decision">${esc(d.rule)} → ${esc(d.to || "reject")} · ${esc(d.outcome)}${d.observations.map(o => `<br>${esc(o.field)}: ${o.exists ? esc(JSON.stringify(o.value)) : "missing"} · ${esc(o.op)} ${esc(JSON.stringify(o.expected))} → ${o.result}`).join("")}</div>`).join("")}`;
      })
      .join("");
  }

  let clock = 0;
  hooks.tick.push((dt) => {
    if (!active) return;
    clock += dt;
    if (clock < 0.12) return;
    clock = 0;
    render();
    // Once the request has answered and its async steps have landed, return to normal speed
    // but keep the timeline up until the reader closes it.
    const t = sim.tracing;
    if (t?.truncated || (t?.done && t.spans.every((s) => s.done) && (!sim.trafficState || !sim.tracePending()))) {
      lingering += 0.12;
      if (lingering > 0.6) {
        timeScale = 1;
        active = false;
      }
    }
  });
  hooks.key.push((event) => {
    if (event.key === "Escape" && !panel.hidden) {
      stop();
      return true;
    }
    if ((event.key === "t" || event.key === "T") && focus) {
      follow(sim.routesOf(focus)[0]?.name);
      return true;
    }
    return false;
  });
  hooks.select.push(() => !panel.hidden && stop());
  panel.querySelector(".tp-ins-close").addEventListener("click", stop);
  panel.querySelector(".tp-tr-again").addEventListener("click", () => follow(endpoint));
  window.__topo.tracer = { follow, stop, get active() { return active; } };
  return { follow, stop, get active() { return active; } };
})();

// The scenario player, inlined after topo-live.js when the spec has a `scenario` and the
// `scenario` feature is on. A timeline under the stage shows the named phases and each step;
// the story plays and loops on its own. Scrubbing or jumping to a phase re-simulates from 0
// (the sim is seeded, so the same time always looks the same). Clicking a node takes over:
// the story stops applying and the reader plays freely until they press play again.
(() => {
  const story = normalizeScenario(DATA.spec.scenario);
  if (!story) return;
  const plate = stage.closest(".k-card");
  const hint = plate.querySelector('[data-corner="hint"]');
  const hintText = hint ? hint.textContent : "";
  const pct = (t) => `${((100 * t) / story.length).toFixed(3)}%`;
  const esc = (text) => String(text).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");

  const phases = story.phases
    .map((phase, index) => `<button type="button" class="tp-phase" data-at="${phase.at}" style="left:${pct(phase.at)};width:${pct(phase.end - phase.at)}" title="${esc(phase.name)} (${index + 1})"><span>${esc(phase.name)}</span></button>`)
    .join("");
  const ticks = story.steps.map((step) => `<i class="tp-tick" style="left:${pct(step.at)}"${step.say ? ` title="${esc(step.say)}"` : ""}></i>`).join("");
  const bar = document.createElement("div");
  bar.className = "tp-story";
  bar.innerHTML = `<div class="tp-timeline"><button type="button" class="tp-play"></button><div class="tp-track" tabindex="0" role="slider" aria-label="Story time" aria-valuemin="0" aria-valuemax="${story.length}">${phases}${ticks}<div class="tp-head"></div></div><span class="tp-time"></span></div><p class="tp-say" aria-live="polite"></p>`;
  stage.after(bar);
  const play = bar.querySelector(".tp-play");
  const track = bar.querySelector(".tp-track");
  const head = bar.querySelector(".tp-head");
  const clock = bar.querySelector(".tp-time");
  const line = bar.querySelector(".tp-say");

  let mode = "story";
  let playing = !still.matches;
  paused = !playing;
  let preview = null;

  // Going forward in the story steps the current sim on; going back (or leaving free play)
  // re-simulates from 0. Either way the same time looks the same: the sim is seeded.
  function seek(t) {
    t = Math.max(0, Math.min(t, story.length));
    const next = mode === "story" && t >= sim.time ? sim : createSim(DATA.spec);
    next.quiet = true;
    while (next.time < t - 1e-9) next.step(1 / 60);
    next.quiet = false;
    resetVisuals(next);
    inspector.close();
    if (typeof tracer !== "undefined") tracer.stop();
    mode = "story";
    render();
  }

  // The last of a sorted list at or before t.
  const lastAt = (list, t) => {
    let found;
    for (const item of list) if (item.at <= t + 1e-6) found = item;
    return found;
  };
  const spoken = story.steps.filter((step) => step.say);
  // Writes only what changed: this runs every frame.
  const written = new Map();
  const write = (key, fn, value) => {
    if (written.get(key) === value) return;
    written.set(key, value);
    fn(value);
  };
  let shown = { say: null, phase: null };
  function render() {
    const t = preview ?? Math.min(sim.time, story.length);
    write("head", (v) => (head.style.left = v), pct(Math.round(t * 20) / 20));
    write("clock", (v) => {
      clock.textContent = `${v}s`;
      track.setAttribute("aria-valuenow", v);
    }, t.toFixed(1));
    write("mode", (v) => {
      bar.dataset.mode = mode;
      play.textContent = v === "playing" ? "❚❚" : "▶";
      play.setAttribute("aria-label", mode === "free" ? "Resume the story" : playing ? "Pause" : "Play");
    }, mode === "free" ? "free" : playing ? "playing" : "paused");
    const phase = mode === "story" ? lastAt(story.phases, t) : null;
    const step = mode === "story" ? lastAt(spoken, t) : null;
    if (phase !== shown.phase) {
      shown.phase = phase;
      bar.querySelectorAll(".tp-phase").forEach((el) => el.toggleAttribute("data-now", phase && +el.dataset.at === phase.at));
      if (hint) hint.textContent = mode === "free" ? "Free play · ▶ resumes the story" : story.phases.length > 1 ? `Click to inspect · 1–${Math.min(9, story.phases.length)} jump` : hintText;
    }
    const text = mode === "free" ? "You've taken over: inspect a node, then use Fail/Restore or F." : step ? step.say : "";
    if (text !== shown.say) {
      shown.say = text;
      line.textContent = text;
    }
  }

  hooks.tick.push(() => {
    if (mode === "story" && sim.time >= story.length) {
      if (story.loop) seek(0);
      else {
        playing = false;
        paused = true;
      }
    }
    render();
  });
  // Steps can open detail at the right moment: { inspect: "pg" } / { inspect: false },
  // { follow: "POST /orders" | true } / { follow: false }.
  hooks.step.push((index) => {
    const step = story.steps.find((s) => s.index === index);
    if (!step || mode !== "story") return;
    if (step.inspect === false) inspector.close();
    else if (step.inspect) inspector.show(step.inspect);
    if (typeof tracer !== "undefined") {
      if (step.follow === false) tracer.stop();
      else if (step.follow) tracer.follow(step.follow === true ? null : step.follow);
    }
  });
  hooks.takeover.push(() => {
    if (mode !== "story") return;
    mode = "free";
    playing = true;
    paused = false;
    // Free play: the rest of the script no longer applies.
    sim.stepIndex = Infinity;
    shown.phase = undefined;
    render();
  });
  hooks.key.push((event) => {
    if (/^[1-9]$/.test(event.key) && story.phases[+event.key - 1]) {
      seek(story.phases[+event.key - 1].at);
      return true;
    }
    if (event.key === "p" || event.key === "P") {
      toggle_();
      return true;
    }
    return false;
  });

  function toggle_() {
    if (mode === "free") {
      seek(sim.time);
      playing = true;
    } else playing = !playing;
    paused = !playing;
    render();
  }
  play.addEventListener("click", toggle_);
  bar.querySelectorAll(".tp-phase").forEach((el) =>
    el.addEventListener("click", (event) => {
      event.stopPropagation();
      seek(+el.dataset.at);
    }),
  );
  const fractionOf = (event) => {
    const box = track.getBoundingClientRect();
    return Math.max(0, Math.min(1, (event.clientX - box.left) / box.width));
  };
  track.addEventListener("pointerdown", (event) => {
    if (event.target.closest(".tp-phase")) return;
    track.setPointerCapture(event.pointerId);
    preview = fractionOf(event) * story.length;
    render();
  });
  track.addEventListener("pointermove", (event) => {
    if (preview == null) return;
    preview = fractionOf(event) * story.length;
    render();
  });
  const release = () => {
    if (preview == null) return;
    const t = preview;
    preview = null;
    seek(t);
  };
  track.addEventListener("pointerup", release);
  track.addEventListener("pointercancel", release);
  track.addEventListener("keydown", (event) => {
    const t = Math.min(sim.time, story.length);
    if (event.key === "ArrowRight") seek(t + 1);
    else if (event.key === "ArrowLeft") seek(t - 1);
    else if (event.key === "Home") seek(0);
    else if (event.key === " ") toggle_();
    else return;
    event.preventDefault();
  });
  window.__topo.story = { seek, get mode() { return mode; }, get playing() { return playing; }, story };
  render();
})();
</script></body></html>
