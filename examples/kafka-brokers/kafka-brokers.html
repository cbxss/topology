  const fade = (el, from, to, ms) => el.animate([{ opacity: from }, { opacity: to }], { duration: ms, easing: "ease-out", fill: "forwards" }).finished;
  frame(0);
  hidePool(views[view]);
  const leaving = views[view].svg;
  stage.appendChild(holder);
  if (name === "flat") leaving.setAttribute("hidden", "");
  const run = (start) => {
    const step = (now) => {
      const t = Math.min(1, (now - start) / 650);
      frame(t);
      if (t < 1) return requestAnimationFrame(step);
      swap(name);
      const arriving = views[name].svg;
      if (name === "flat") {
        // The top-down iso frame and the 2D glyphs share one layout: crossfade between them.
        holder.style.position = "absolute";
        holder.style.inset = "0";
        fade(arriving, 0, 1, 220);
        fade(holder, 1, 0, 220).then(() => holder.remove()).then(() => (morphing = false));
      } else {
        holder.remove();
        morphing = false;
      }
    };
    requestAnimationFrame(step);
  };
  if (name === "iso") {
    // Fade the top-down frame in over the 2D view, then take its place.
    holder.style.position = "absolute";
    holder.style.inset = "0";
    fade(holder, 0, 1, 180).then(() => {
      leaving.setAttribute("hidden", "");
      holder.style.position = "";
      holder.style.inset = "";
      run(performance.now());
    });
  }
  else run(performance.now());
}

// Forget what a view's attributes were last set to, so the next draw writes them all.
function hidePool(v) {
  for (const slot of v.pool) {
    slot.g.style.display = "none";
    slot.shown = false;
  }
}
function resetView(v) {
  hidePool(v);
  v.cellState.clear();
  v.cursors.forEach((cursor) => (cursor.at = -1));
  v.status.clear();
}

function swap(name) {
  views[view].svg.setAttribute("hidden", "");
  hidePool(views[view]);
  view = name;
  views[view].svg.removeAttribute("hidden");
  resetView(views[view]);
  document.querySelectorAll(".tp-views button").forEach((button) => button.setAttribute("aria-pressed", String(button.dataset.view === name)));
  drawLogs();
  drawPackets();
}

let frame = 0;
let last = 0;
let visible = false;
let logClock = 0;
let statusClock = 0;
function tick(now) {
  const dt = last ? Math.min((now - last) / 1000, 0.1) : 1 / 60;
  last = now;
  if (!paused) sim.step(dt * (window.__topoSpeed ?? 1));
  events(now);
  for (const hook of hooks.tick) hook(dt);
  logClock += dt;
  statusClock += dt;
  if (logClock > 0.05) {
    logClock = 0;
    drawLogs();
  }
  if (statusClock > 0.25) {
    statusClock = 0;
    drawStatus();
  }
  drawPackets();
  say(false, now);
  frame = visible ? requestAnimationFrame(tick) : 0;
}
const run = () => {
  if (!frame && visible) {
    last = 0;
    frame = requestAnimationFrame(tick);
  }
};
new IntersectionObserver((entries) => {
  visible = entries[entries.length - 1].isIntersecting;
  run();
}, { rootMargin: "120px 0px" }).observe(stage);

const nodeAt = (target) => target.closest?.("[data-node]")?.dataset.node;
const toggle = (id) => {
  for (const hook of hooks.takeover) hook(id);
  const node = sim.nodes.get(id);
  if (node) sim.setUp(id, !node.up);
  say(true);
};
stage.addEventListener("pointerover", (event) => {
  const id = nodeAt(event.target);
  if (id && id !== focus) {
    pinned = false;
    setFocus(id);
  }
});
stage.addEventListener("pointerleave", () => {
  if (!pinned) setFocus(null);
});
stage.addEventListener("click", (event) => {
  const part = event.target.closest?.("[data-part^='broker:']");
  const id = nodeAt(event.target);
  if (part && id) {
    const b = +part.dataset.part.slice(7);
    for (const hook of hooks.takeover) hook(id);
    sim.setBroker(id, b, !sim.logs.get(id).brokers[b]);
    drawStatus();
    say(true);
  } else if (id) toggle(id);
});
const ring = DATA.spec.nodes.map((node) => node.id);
stage.addEventListener("keydown", (event) => {
  const here = focus ? ring.indexOf(focus) : -1;
  if (hooks.key.some((hook) => hook(event))) {
    event.preventDefault();
    return;
  }
  if (event.key === "ArrowRight" || event.key === "ArrowDown") {
    pinned = true;
    setFocus(ring[(here + 1) % ring.length]);
  } else if (event.key === "ArrowLeft" || event.key === "ArrowUp") {
    pinned = true;
    setFocus(ring[(here - 1 + ring.length) % ring.length]);
  } else if ((event.key === "Enter" || event.key === " ") && focus) {
    toggle(focus);
  } else if (event.key === "v" || event.key === "V") {
    setView(view === "iso" ? "flat" : "iso");
  } else if (event.key === "Escape") {
    pinned = false;
    setFocus(null);
  } else return;
  event.preventDefault();
});
document.querySelectorAll(".tp-views button").forEach((button) => button.addEventListener("click", () => setView(button.dataset.view)));

// Swap in another sim (a scrub re-simulates from 0) and bring every attribute up to date.
function resetVisuals(next) {
  sim = next;
  for (const v of viewList) {
    resetView(v);
    for (const [id, el] of v.nodes) el.toggleAttribute("data-down", !sim.nodes.get(id).up);
  }
  for (const el of lit.keys()) el.removeAttribute("data-on");
  lit.clear();
  sim.events.length = 0;
  drawLogs();
  drawStatus();
  drawPackets();
  say(true);
}

window.__topo = { get sim() { return sim; }, setView, setFocus, toggle, resetVisuals, data: DATA, get kit() { return typeof TOPO !== "undefined" ? TOPO : null; }, get view() { return view; }, get morphing() { return morphing; } };
drawLogs();
drawStatus();
say(true);

// The scenario player, inlined after topo-live.js when the spec has a `scenario` and the
// `scenario` feature is on. A timeline under the stage shows the named phases and each step;
// the story plays and loops on its own. Scrubbing or jumping to a phase re-simulates from 0
// (the sim is seeded, so the same time always looks the same). Clicking a node takes over:
// the story stops applying and the reader plays freely until they press play again.
(() => {
  const story = normalizeScenario(DATA.spec.scenario);
  if (!story) return;
  const plate = stage.closest(".k-card");
  const hint = plate.querySelector('[data-corner="hint"]');
  const hintText = hint ? hint.textContent : "";
  const pct = (t) => `${((100 * t) / story.length).toFixed(3)}%`;
  const esc = (text) => String(text).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");

  const phases = story.phases
    .map((phase, index) => `<button type="button" class="tp-phase" data-at="${phase.at}" style="left:${pct(phase.at)};width:${pct(phase.end - phase.at)}" title="${esc(phase.name)} (${index + 1})"><span>${esc(phase.name)}</span></button>`)
    .join("");
  const ticks = story.steps.map((step) => `<i class="tp-tick" style="left:${pct(step.at)}"${step.say ? ` title="${esc(step.say)}"` : ""}></i>`).join("");
  const bar = document.createElement("div");
  bar.className = "tp-story";
  bar.innerHTML = `<div class="tp-timeline"><button type="button" class="tp-play"></button><div class="tp-track" tabindex="0" role="slider" aria-label="Story time" aria-valuemin="0" aria-valuemax="${story.length}">${phases}${ticks}<div class="tp-head"></div></div><span class="tp-time"></span></div><p class="tp-say" aria-live="polite"></p>`;
  stage.after(bar);
  const play = bar.querySelector(".tp-play");
  const track = bar.querySelector(".tp-track");
  const head = bar.querySelector(".tp-head");
  const clock = bar.querySelector(".tp-time");
  const line = bar.querySelector(".tp-say");

  let mode = "story";
  let playing = !still.matches;
  paused = !playing;
  let preview = null;

  // Going forward in the story steps the current sim on; going back (or leaving free play)
  // re-simulates from 0. Either way the same time looks the same: the sim is seeded.
  function seek(t) {
    t = Math.max(0, Math.min(t, story.length));
    const next = mode === "story" && t >= sim.time ? sim : createSim(DATA.spec);
    next.quiet = true;
    while (next.time < t - 1e-9) next.step(1 / 60);
    next.quiet = false;
    resetVisuals(next);
    mode = "story";
    render();
  }

  // The last of a sorted list at or before t.
  const lastAt = (list, t) => {
    let found;
    for (const item of list) if (item.at <= t + 1e-6) found = item;
    return found;
  };
  const spoken = story.steps.filter((step) => step.say);
  // Writes only what changed: this runs every frame.
  const written = new Map();
  const write = (key, fn, value) => {
    if (written.get(key) === value) return;
    written.set(key, value);
    fn(value);
  };
  let shown = { say: null, phase: null };
  function render() {
    const t = preview ?? Math.min(sim.time, story.length);
    write("head", (v) => (head.style.left = v), pct(Math.round(t * 20) / 20));
    write("clock", (v) => {
      clock.textContent = `${v}s`;
      track.setAttribute("aria-valuenow", v);
    }, t.toFixed(1));
    write("mode", (v) => {
      bar.dataset.mode = mode;
      play.textContent = v === "playing" ? "❚❚" : "▶";
      play.setAttribute("aria-label", mode === "free" ? "Resume the story" : playing ? "Pause" : "Play");
    }, mode === "free" ? "free" : playing ? "playing" : "paused");
    const phase = mode === "story" ? lastAt(story.phases, t) : null;
    const step = mode === "story" ? lastAt(spoken, t) : null;
    if (phase !== shown.phase) {
      shown.phase = phase;
      bar.querySelectorAll(".tp-phase").forEach((el) => el.toggleAttribute("data-now", phase && +el.dataset.at === phase.at));
      if (hint) hint.textContent = mode === "free" ? "Free play · ▶ resumes the story" : story.phases.length > 1 ? `Click to take over · 1–${Math.min(9, story.phases.length)} jump` : hintText;
    }
    const text = mode === "free" ? "You've taken over: click nodes to fail and restore them." : step ? step.say : "";
    if (text !== shown.say) {
      shown.say = text;
      line.textContent = text;
    }
  }

  hooks.tick.push(() => {
    if (mode === "story" && sim.time >= story.length) {
      if (story.loop) seek(0);
      else {
        playing = false;
        paused = true;
      }
    }
    render();
  });
  hooks.takeover.push(() => {
    if (mode !== "story") return;
    mode = "free";
    playing = true;
    paused = false;
    // Free play: the rest of the script no longer applies.
    sim.stepIndex = Infinity;
    shown.phase = undefined;
    render();
  });
  hooks.key.push((event) => {
    if (/^[1-9]$/.test(event.key) && story.phases[+event.key - 1]) {
      seek(story.phases[+event.key - 1].at);
      return true;
    }
    if (event.key === "p" || event.key === "P") {
      toggle_();
      return true;
    }
    return false;
  });

  function toggle_() {
    if (mode === "free") {
      seek(sim.time);
      playing = true;
    } else playing = !playing;
    paused = !playing;
    render();
  }
  play.addEventListener("click", toggle_);
  bar.querySelectorAll(".tp-phase").forEach((el) =>
    el.addEventListener("click", (event) => {
      event.stopPropagation();
      seek(+el.dataset.at);
    }),
  );
  const fractionOf = (event) => {
    const box = track.getBoundingClientRect();
    return Math.max(0, Math.min(1, (event.clientX - box.left) / box.width));
  };
  track.addEventListener("pointerdown", (event) => {
    if (event.target.closest(".tp-phase")) return;
    track.setPointerCapture(event.pointerId);
    preview = fractionOf(event) * story.length;
    render();
  });
  track.addEventListener("pointermove", (event) => {
    if (preview == null) return;
    preview = fractionOf(event) * story.length;
    render();
  });
  const release = () => {
    if (preview == null) return;
    const t = preview;
    preview = null;
    seek(t);
  };
  track.addEventListener("pointerup", release);
  track.addEventListener("pointercancel", release);
  track.addEventListener("keydown", (event) => {
    const t = Math.min(sim.time, story.length);
    if (event.key === "ArrowRight") seek(t + 1);
    else if (event.key === "ArrowLeft") seek(t - 1);
    else if (event.key === "Home") seek(0);
    else if (event.key === " ") toggle_();
    else return;
    event.preventDefault();
  });
  window.__topo.story = { seek, get mode() { return mode; }, get playing() { return playing; }, story };
  render();
})();
</script></body></html>
