oker:0"><rect class="tp-f tp-f-chip" x="248.2" y="87.7" width="14.9" height="15.6" rx="1"/><circle class="tp-led" data-led="topic:b0" cx="260.1" cy="95.5" r="1.2"/></g><g class="tp-broker" data-part="broker:1"><rect class="tp-f tp-f-chip" x="248.2" y="104.5" width="14.9" height="15.6" rx="1"/><circle class="tp-led" data-led="topic:b1" cx="260.1" cy="112.3" r="1.2"/></g><g class="tp-broker" data-part="broker:2"><rect class="tp-f tp-f-chip" x="248.2" y="121.3" width="14.9" height="15.6" rx="1"/><circle class="tp-led" data-led="topic:b2" cx="260.1" cy="129" r="1.2"/></g></g><g class="tp-node" data-node="ledger-b" data-kind="worker"><rect class="tp-f" x="547" y="145.4" width="67" height="44.6" rx="4"/><path class="k-line" data-tone="faint" d="M547 156.4L614 156.4"/><circle class="tp-led" data-led="ledger-b:0" cx="553" cy="150.9" r="1.7"/><circle class="tp-f-mark" cx="607" cy="150.9" r="2.6"/></g></svg></div></div><figcaption class="k-legend"><span class="k-keys"><span class="k-key"><svg class="k-swatch" data-mark="lit" viewBox="0 0 16 10" aria-hidden="true"><path d="M2 4.5 8 1.5 14 4.5 14 6 8 9 2 6Z"/></svg>Request</span><span class="k-key"><svg class="k-swatch" data-mark="raised" viewBox="0 0 16 10" aria-hidden="true"><path d="M2 4.5 8 1.5 14 4.5 14 6 8 9 2 6Z"/></svg>Response</span><span class="k-key"><svg class="k-swatch" data-mark="blue" viewBox="0 0 16 10" aria-hidden="true"><path d="M1.5 5h13"/></svg>Record pulled by a consumer</span><span class="k-key"><svg class="k-swatch" data-mark="amber" viewBox="0 0 16 10" aria-hidden="true"><path d="M1.5 5h13"/></svg>Retry</span><span class="k-key"><svg class="k-swatch" data-mark="dashed" viewBox="0 0 16 10" aria-hidden="true"><path d="M1.5 5h13"/></svg>Async link</span><span class="k-key"><svg class="k-swatch" data-mark="red" viewBox="0 0 16 10" aria-hidden="true"><path d="M1.5 5h13"/></svg>Error, refused or dropped</span></span><span class="k-caption">payments.v1 has 3 partitions on 3 brokers (RF 3, min ISR 2) and producers wait for acks=all. Partition 0 is hot: it gets half the writes. Click a broker unit on the plinth to fail it yourself; a dimmed lane is a partition with no leader.</span></figcaption></figure></main><script type="module">// The model behind every figure: a small, seeded, tick-based simulation of requests moving
// through a system. The page inlines this file (exports stripped) and draws `sim.packets`;
// `scripts/build.mjs --check` runs the same code in Node and prints what the readout will say.
// Every number a figure shows comes from here.
//
// Time. Sim time is real time for everything the model decides (service time, queue waits,
// timeouts, backoff, breaker windows, rates), except packet travel, which is slowed down so
// people can watch it. Latency is therefore built up in model time rather than measured off
// the clock: a job costs its queue wait plus its service time plus its slowest sync call, and a
// call costs its network round trip (`ms` on the edge, default `sim.net`) plus the callee's job,
// plus any earlier failed attempts and their backoff.

const SIM_DEFAULTS = { speed: 150, per: 1, rebalance: 0.9, window: 2, seed: 7, refuse: 0.02, net: 0.5, length: 0, loop: true };
const SERVICE_MS = { client: 0, lb: 0.3, gateway: 1, service: 8, worker: 15, cache: 0.4, db: 4, storage: 20, kafka: 2, queue: 1, cdn: 0.5, dns: 1, external: 120, flags: 1, scheduler: 0, box: 5 };
const DETECT = { lb: 0.6, gateway: 0.6, dns: 3 };

function rngOf(seed) {
  let s = seed >>> 0 || 1;
  return () => {
    s ^= s << 13;
    s ^= s >>> 17;
    s ^= s << 5;
    return (s >>> 0) / 4294967296;
  };
}

const isLog = (node) => node.kind === "kafka" || node.kind === "queue";
// A log's consumer group for an edge out of it: a queue has one shared group.
const groupOf = (log, edge) => (log.kind === "queue" ? "queue" : edge.group || "default");

// The grammar of scenario targets: "a>b" is an edge, "topic:b0" a Kafka broker, else a node.
function targetOf(id, nodeIds) {
  if (id.includes(">")) {
    const [from, to] = id.split(">");
    return { type: "edge", from, to };
  }
  const broker = /^(.*):b(\d+)$/.exec(id);
  if (broker && !(nodeIds && nodeIds.has(id))) return { type: "broker", node: broker[1], broker: +broker[2] };
  return { type: "node", id };
}

const routeOf = (node) => node.route || (node.kind === "lb" || node.kind === "gateway" || node.kind === "dns" ? "roundrobin" : "all");

function hashOf(text) {
  let h = 2166136261;
  for (let i = 0; i < text.length; i++) h = Math.imul(h ^ text.charCodeAt(i), 16777619);
  return h >>> 0;
}

// Scenario steps may name a phase instead of a time: { phase: "incident", after: 1.5 }.
function normalizeScenario(scenario) {
  if (!scenario) return null;
  const phases = (scenario.phases || []).map((phase) => ({ ...phase })).sort((a, b) => a.at - b.at);
  const byName = new Map(phases.map((phase) => [phase.name, phase]));
  const steps = (scenario.steps || []).map((step, index) => {
    let at = step.at;
    if (at == null && step.phase != null) {
      const phase = byName.get(step.phase);
      if (!phase) throw new Error(`scenario step ${index}: unknown phase "${step.phase}"`);
      at = phase.at + (step.after || 0);
    }
    if (at == null) throw new Error(`scenario step ${index}: needs \`at\` or \`phase\``);
    return { ...step, at, index };
  });
  steps.sort((a, b) => a.at - b.at || a.index - b.index);
  const last = Math.max(0, ...steps.map((step) => step.at), ...phases.map((phase) => phase.at));
  const length = scenario.length || Math.ceil(last + 8);
  phases.forEach((phase, index) => (phase.end = phases[index + 1]?.at ?? length));
  return { length, loop: scenario.loop !== false, steps, phases };
}

// One pass: [items where test holds, the rest].
function split(list, test) {
  const yes = [];
  const no = [];
  for (const item of list) (test(item) ? yes : no).push(item);
  return [yes, no];
}

const quantile = (sorted, q) => (sorted.length ? sorted[Math.min(sorted.length - 1, Math.floor(q * sorted.length))] : 0);

// spec: { nodes, edges (with `len` in world units), sim, scenario, flags, features }.
function createSim(spec) {
  // Disabled tool features have already been stripped from the spec (stripFeatures).
  const features = spec.features || {};
  const cfg = { ...SIM_DEFAULTS, ...(spec.sim || {}) };
  const scenario = normalizeScenario(spec.scenario);
  if (scenario) cfg.length = scenario.length;
  const rand = rngOf(cfg.seed);
  const nodes = new Map();
  const edges = spec.edges.map((edge, index) => ({
    ...edge,
    index,
    sent: 0,
    dropped: 0,
    failed: 0,
    fast: 0,
    recent: [],
    recentErrors: [],
    flow: 0,
    errorRate: 0,
    breaker: breakerOf(edge.breaker),
  }));
  for (const node of spec.nodes) {
    nodes.set(node.id, {
      ...node,
      up: node.up !== false,
      downSince: node.up === false ? 0 : null,
      ms: node.ms ?? SERVICE_MS[node.kind] ?? 5,
      queueMax: node.queue || 0,
      out: [],
      into: [],
      rr: 0,
      tokens: 0,
      bucket: node.capacity ? node.capacity * (node.burst ?? 0.25) + 1 : 0,
      handled: 0,
      jobs: new Set(),
      working: [],
      waiting: [],
      clock: rand() / Math.max(typeof node.emit === "number" ? node.emit : 1, 0.001),
      nextBurst: 0,
      flow: 0,
      dropRate: 0,
      errorRate: 0,
      recent: [],
      recentDrops: [],
      recentErrors: [],
      service: [],
      roots: [],
      hist: [],
      replica: 0,
    });
  }
  for (const edge of edges) {
    nodes.get(edge.from).out.push(edge);
    nodes.get(edge.to).into.push(edge);
  }
  // What each node forwards along, worked out once: data edges, replication edges, and
  // whether any edge is gated by a flag.
  for (const node of nodes.values()) {
    const live = node.out.filter((edge) => edge.kind !== "config");
    node.data = live.filter((edge) => edge.kind !== "replication");
    node.repl = live.filter((edge) => edge.kind === "replication");
    node.gated = live.some((edge) => edge.flag || edge.unless);
    node.answers = node.data.some((edge) => edge.sync);
  }

  // Feature flags in the modelled system. A service evaluates flags locally from the last
  // config it got; while the flag service is down, changes don't reach anyone.
  const flags = new Map();
  for (const [name, flag] of Object.entries(spec.flags || {})) flags.set(name, { name, rollout: flag.rollout ?? 0, sticky: !!flag.sticky, effective: flag.rollout ?? 0 });
  const flagNode = [...nodes.values()].find((node) => node.kind === "flags");

  // Logs: kafka topics (partitions, consumer groups with exclusive assignment) and queues
  // (one lane, competing consumers).
  const logs = new Map();
  for (const node of nodes.values()) {
    if (!isLog(node)) continue;
    const partitions = node.kind === "queue" ? 1 : node.partitions || 3;
    const groups = new Map();
    for (const edge of node.out) {
      const name = groupOf(node, edge);
      if (!groups.has(name)) groups.set(name, { name, members: [], committed: Array(partitions).fill(0), assign: new Map(), pause: 0, generation: 0 });
      groups.get(name).members.push(edge);
    }
    const log = { node, partitions, end: Array(partitions).fill(0), rr: 0, groups: [...groups.values()], appended: 0 };
    // Brokers: each partition has `rf` replicas, led round-robin. Losing a leader pauses its
    // partitions for `election` seconds; with acks "all", a partition whose in-sync replicas
    // fall below `minIsr` refuses writes.
    if (node.kind === "kafka" && node.brokers) {
      const n = node.brokers;
      log.brokers = Array(n).fill(true);
      log.rf = Math.min(node.rf ?? 3, n);
      log.minIsr = Math.min(node.minIsr ?? 2, log.rf);
      log.acks = node.acks ?? 1;
      log.election = node.election ?? 2;
      log.parts = Array.from({ length: partitions }, (_, p) => ({ replicas: Array.from({ length: log.rf }, (_, i) => (p + i) % n), leader: p % n, electUntil: 0 }));
    }
    logs.set(node.id, log);
  }

  function breakerOf(value) {
    return value ? { errors: 0.5, min: 8, window: 2, open: 3, ...(value === true ? {} : value), state: "closed", outcomes: [], bad: 0, until: 0, trial: false } : null;
  }
  const durationOf = (edge) => Math.max(edge.len / cfg.speed, 0.08);
  // Timeouts are judged in model time when the reply arrives. For a reply that never comes,
  // a backstop deadline in sim time: the call's animation round trip, the slowest sync call
  // its target makes in turn, the timeout and a second's grace.
  const allowance = new Map();
  const allowanceOf = (edge, seen = new Set()) => {
    if (allowance.has(edge.index)) return allowance.get(edge.index);
    if (seen.has(edge.index)) return 0;
    seen.add(edge.index);
    const target = nodes.get(edge.to);
    const below = target.out.filter((e) => e.sync && e.kind !== "replication").map((e) => allowanceOf(e, seen));
    const value = 2 * durationOf(edge) + Math.max(0, ...below);
    allowance.set(edge.index, value);
    return value;
  };
  edges.forEach((edge) => allowanceOf(edge));

  const sim = { cfg, nodes, edges, logs, flags, scenario, features, packets: [], time: 0, events: [], rand, calls: new Set(), timed: new Set(), timers: [], stepIndex: 0, histClock: 0, hist: [] };
  let ids = 0;
  const newMsg = (source) => ({ id: ++ids, source, born: sim.time, draws: null });

  function rebalance(log, group, now) {
    const live = group.members.filter((edge) => nodes.get(edge.to).up);
    group.assign = new Map();
    if (log.node.kind === "queue") {
      for (const edge of live) group.assign.set(edge.index, [0]);
    } else {
      live.forEach((edge) => group.assign.set(edge.index, []));
      for (let p = 0; p < log.partitions; p++) if (live.length) group.assign.get(live[p % live.length].index).push(p);
      group.generation++;
      if (now > 0) group.pause = cfg.rebalance;
    }
    sim.events.push({ type: "rebalance", log: log.node.id, group: group.name, at: now });
  }
  for (const log of logs.values()) for (const group of log.groups) rebalance(log, group, 0);

  function launch(edge, kind, extra = {}) {
    const packet = { edge: edge.index, t: 0, dir: kind === "response" || kind === "error" ? -1 : 1, kind, duration: durationOf(edge), launched: sim.time, ...extra };
    if (packet.dir > 0) {
      edge.sent++;
      edge.recent.push(sim.time);
    }
    sim.packets.push(packet);
    return packet;
  }

  const burst = (edge, at = 1) => sim.packets.push({ edge: edge.index, t: at, dir: 1, kind: "drop", age: 0, duration: 1 });

  // --- jobs -----------------------------------------------------------------------------------

  function startJob(node, msg, call, extra = {}) {
    const job = { node, msg, call, waiting: 0, forwarded: false, failed: false, dead: false, done: false, arrived: sim.time, cost: 0, ...extra };
    node.jobs.add(job);
    node.handled++;
    node.recent.push(sim.time);
    node.replica = (node.replica + 1) % Math.max(1, node.replicas || 1);
    if (!sim.quiet) sim.events.push({ type: "handle", node: node.id, replica: node.replica, at: sim.time });
    if (!node.capacity) return begin(job);
    if (node.bucket >= 1) {
      node.bucket -= 1;
      return begin(job);
    }
    if (node.waiting.length < node.queueMax) return node.waiting.push(job);
    reject(job);
  }

  function begin(job) {
    const node = job.node;
    // Service time varies: ±40% around `ms`, and one request in 30 takes 2-5x as long.
    const base = node.ms + (node.sidecar ? node.sidecarMs ?? 1.5 : 0);
    const spread = cfg.jitter === false ? 1 : (0.6 + 0.8 * rand()) * (rand() < 1 / 30 ? 2 + 3 * rand() : 1);
    job.readyAt = sim.time + (base * spread) / 1000;
    node.working.push(job);
  }

  // A request that never got in: counted at the node and on the edge, drawn as a red burst.
  function dropAt(edge, node) {
    node.recentDrops.push(sim.time);
    if (!edge) return;
    edge.dropped++;
    burst(edge);
  }

  // Over capacity with a full buffer: answer 503 at once.
  function reject(job) {
    dropAt(job.call ? job.call.edge : job.via, job.node);
    respond(job, false);
  }

  function respond(job, ok) {
    if (job.dead || job.done) return;
    job.done = true;
    const node = job.node;
    node.jobs.delete(job);
    if (!ok) node.recentErrors.push(sim.time);
    const own = job.readyAt != null ? (job.readyAt - job.arrived) * 1000 : 0;
    const ms = own + job.cost;
    node.service.push({ at: sim.time, ms });
    if (job.call) launch(job.call.edge, ok ? "response" : "error", { call: job.call, ms });
    if (job.root && node.answers) node.roots.push({ at: sim.time, ms, ok });
  }

  function ready(job) {
    if (job.dead || job.done) return;
    const node = job.node;
    if (!node.up) return;
    if (isLog(node)) return respond(job, true);
    if (node.errorRate && rand() < node.errorRate) return respond(job, false);
    forward(job);
    job.forwarded = true;
    if (job.waiting === 0) respond(job, !job.failed);
  }

  const decide = (msg, name) => {
    const flag = flags.get(name);
    if (!flag) return false;
    if (flag.sticky) return (hashOf(`${msg.source}:${name}`) % 10000) / 10000 < flag.effective;
    msg.draws ??= {};
    if (msg.draws[name] === undefined) msg.draws[name] = rand() < flag.effective;
    return msg.draws[name];
  };
  const healthy = (node, router) => node.up || sim.time - node.downSince < (router.detect ?? router.ttl ?? DETECT[router.kind] ?? 0);

  function forward(job) {
    const node = job.node;
    const open = (edge) => (edge.flag ? decide(job.msg, edge.flag) : edge.unless ? !decide(job.msg, edge.unless) : true);
    for (const edge of node.repl) if (!node.gated || open(edge)) launch(edge, "replication", { msg: job.msg });
    const data = node.gated ? node.data.filter(open) : node.data;
    if (!data.length) return;
    const mode = routeOf(node);
    const chosen = [];
    if (mode === "roundrobin") {
      // Health checks notice a dead target only after `detect` seconds (`ttl` for DNS).
      for (let tries = 0; tries < data.length; tries++) {
        const edge = data[node.rr++ % data.length];
        if (node.health === false || healthy(nodes.get(edge.to), node)) {
          chosen.push(edge);
          break;
        }
      }
      if (!chosen.length) job.failed = true;
    } else if (mode === "random") {
      const total = data.reduce((sum, edge) => sum + (edge.p ?? 1), 0);
      let pick = rand() * total;
      chosen.push(data.find((edge) => (pick -= edge.p ?? 1) <= 0) || data[data.length - 1]);
    } else {
      // A CDN or cache with `hit` sends only its misses on.
      for (const edge of data) if (rand() < (edge.p ?? (node.hit != null ? 1 - node.hit : 1))) chosen.push(edge);
    }
    for (const edge of chosen) {
      if (edge.sync) {
        job.waiting++;
        callOut(job, edge, 0);
      } else launch(edge, "request", { msg: job.msg });
    }
  }

  // --- calls: one attempt of a sync request ---------------------------------------------------

  const netOf = (edge) => (edge.ms ?? cfg.net) * 2;

  function callOut(job, edge, attempt, prior = 0) {
    const br = edge.breaker;
    let trial = false;
    if (br) {
      if (br.state === "open" && sim.time >= br.until) setBreaker(edge, "half");
      if (br.state === "open" || (br.state === "half" && br.trial)) {
        edge.fast++;
        return finish(job, false, prior);
      }
      if (br.state === "half") {
        br.trial = true;
        trial = true;
      }
    }
    const call = { job, edge, attempt, trial, prior, sent: sim.time, deadline: edge.timeout ? sim.time + allowance.get(edge.index) + edge.timeout + 1 : Infinity, done: false, packets: [] };
    sim.calls.add(call);
    if (edge.timeout) sim.timed.add(call);
    call.packets.push(launch(edge, attempt ? "retry" : "request", { call, msg: job.msg }));
  }

  function setBreaker(edge, state) {
    const br = edge.breaker;
    br.state = state;
    br.trial = false;
    if (state === "open") br.until = sim.time + br.open;
    if (state === "closed") {
      br.outcomes = [];
      br.bad = 0;
    }
    sim.events.push({ type: "breaker", edge: edge.index, state, at: sim.time });
  }

  function settle(call, ok, ms) {
    if (call.done) return;
    const spent = call.prior + ms;
    call.done = true;
    sim.calls.delete(call);
    sim.timed.delete(call);
    const { edge, job } = call;
    if (!ok) {
      edge.failed++;
      edge.recentErrors.push(sim.time);
    }
    const br = edge.breaker;
    if (br) {
      if (call.trial) setBreaker(edge, ok ? "closed" : "open");
      else if (br.state === "closed") {
        br.outcomes.push({ at: sim.time, ok });
        if (!ok) br.bad++;
        let old = 0;
        while (old < br.outcomes.length && br.outcomes[old].at < sim.time - br.window) if (!br.outcomes[old++].ok) br.bad--;
        if (old) br.outcomes.splice(0, old);
        if (br.outcomes.length >= br.min && br.bad / br.outcomes.length >= br.errors) setBreaker(edge, "open");
      }
    }
    if (!ok && call.attempt < (edge.retries || 0) && !job.dead && !job.done) {
      const wait = (edge.backoff ?? 0.05) * 2 ** call.attempt * (0.5 + rand());
      sim.timers.push({ at: sim.time + wait, run: () => !job.dead && !job.done && callOut(job, edge, call.attempt + 1, spent + wait * 1000) });

    }
    finish(job, ok, spent);
  }

  function finish(job, ok, ms) {
    job.waiting--;

    if (!ok) job.failed = true;

  }

  // --- arrivals -------------------------------------------------------------------------------

  function arrive(packet) {
    const edge = edges[packet.edge];
    if (packet.dir < 0) {
      const call = packet.call;
      if (!call || call.done) return;
      const ms = netOf(edge) + (packet.ms || 0);
      // The caller gave up at `timeout` in model time: this reply is late and ignored.
      if (edge.timeout && ms > edge.timeout * 1000) {
        call.timedOut = true;
        return settle(call, false, edge.timeout * 1000);
      }
      return settle(call, packet.kind === "response", ms);
    }
    const node = nodes.get(edge.to);
    if (!node.up) {
      dropAt(edge, node);
      // Connection refused: the caller hears about it straight away.
      if (packet.call) {
        const call = packet.call;
        sim.timers.push({ at: sim.time + cfg.refuse, run: () => !call.done && call.packets.push(launch(edge, "error", { call, ms: 0 })) });
      }
      return;
    }
    if (isLog(node)) {
      const log = logs.get(node.id);
      const p = chooseP(log, edge, packet);
      if (!writable(log, p)) {
        dropAt(edge, node);
        if (packet.call) launch(edge, "error", { call: packet.call, ms: netOf(edge) });
        return;
      }
      log.end[p]++;
      log.appended++;
    }
    startJob(node, packet.msg || newMsg(edge.from), packet.call || null, { via: edge });
  }

  const isrOf = (log, part) => part.replicas.filter((b) => log.brokers[b]).length;
  const readable = (log, p) => !log.parts || (sim.time >= log.parts[p].electUntil && log.brokers[log.parts[p].leader]);
  const writable = (log, p) => readable(log, p) && (!log.parts || log.acks !== "all" || isrOf(log, log.parts[p]) >= log.minIsr);

  function setBroker(id, b, up) {
    const log = logs.get(id);
    if (!log?.brokers || b < 0 || b >= log.brokers.length || log.brokers[b] === up) return;
    log.brokers[b] = up;
    sim.events.push({ type: up ? "broker-up" : "broker-down", node: id, broker: b, at: sim.time });
    for (const part of log.parts) {
      if (!up && part.leader === b) {
        const next = part.replicas.find((r) => log.brokers[r]);
        if (next != null) {
          part.leader = next;
          part.electUntil = sim.time + log.election;
        }
      } else if (up && !log.brokers[part.leader] && part.replicas.includes(b)) {
        part.leader = b;
        part.electUntil = sim.time + log.election;
      }
    }
  }

  function chooseP(log, edge, packet) {
    if (packet.partition != null) return packet.partition;
    if (edge.key != null) return hashOf(String(edge.key)) % log.partitions;
    const skew = log.node.skew;
    if (skew) {
      const total = skew.reduce((a, b) => a + b, 0);
      let pick = rand() * total;
      for (let p = 0; p < log.partitions; p++) if ((pick -= skew[p] ?? 0) <= 0) return p;
      return log.partitions - 1;
    }
    return log.rr++ % log.partitions;
  }

  // --- sources --------------------------------------------------------------------------------

  const emitAt = (node, t) => {
    const emit = node.emit;
    if (typeof emit === "number") return emit;
    if (Array.isArray(emit)) {
      const span = cfg.length || emit[emit.length - 1][0] || 1;
      const x = cfg.loop && cfg.length ? t % span : t;
      if (x <= emit[0][0]) return emit[0][1];
      for (let i = 1; i < emit.length; i++) {
        const [t1, r1] = emit[i];
        const [t0, r0] = emit[i - 1];
        if (x <= t1) return r0 + ((r1 - r0) * (x - t0)) / Math.max(t1 - t0, 1e-6);
      }
      return emit[emit.length - 1][1];
    }
    return 0;
  };

  const emitOne = (node) => startJob(node, newMsg(node.id), null, { root: true });

  // --- the tick -------------------------------------------------------------------------------

  function step(dt) {
    sim.time += dt;
    const now = sim.time;
    if (scenario) {
      while (sim.stepIndex < scenario.steps.length && scenario.steps[sim.stepIndex].at <= now) {
        const s = scenario.steps[sim.stepIndex++];
        apply(s);
        sim.events.push({ type: "step", index: s.index, at: now });
      }
    }
    if (sim.timers.length) {
      const [due, later] = split(sim.timers, (timer) => timer.at <= now);
      if (due.length) {
        sim.timers = later;
        due.forEach((timer) => timer.run());
      }
    }
    for (const node of nodes.values()) {
      if (node.capacity) node.bucket = Math.min(node.capacity * (node.burst ?? 0.25) + 1, node.bucket + node.capacity * dt);

      if (node.emit && typeof node.emit === "object" && !Array.isArray(node.emit)) {

        if (now >= node.nextBurst) {
          node.nextBurst = now + node.emit.every;
          for (let i = 0; i < node.emit.burst; i++) sim.timers.push({ at: now + (i / node.emit.burst) * 0.33, run: () => node.up && emitOne(node) });
        }
      } else if (node.emit) {
        const rate = emitAt(node, now);
        if (rate > 0) {

        begin(node.waiting.shift());

        for (const packet of call.packets) if (packet.dir < 0) packet.kind = "late";
        call.timedOut = true;
        settle(call, false, call.edge.timeout * 1000);
      }
    }

    for (const log of logs.values()) {
      for (const group of log.groups) {
        if (group.pause > 0) {
          group.pause = Math.max(0, group.pause - dt);
          continue;
        }
        for (const edge of group.members) {
          const consumer = nodes.get(edge.to);
          if (!consumer.up) continue;

          const rate = edge.rate ?? consumer.rate ?? 40;
          consumer.tokens = Math.min(consumer.tokens + rate * dt, 3);

            let most = 0;

                best = p;
              }

              break;
            }
            consumer.tokens -= 1;

        }
      }
    }

    const live = [];
    const moving = sim.packets;
    sim.packets = [];

        continue;
      }

      if (packet.t >= 1) {

      } else live.push(packet);
    }
    sim.packets = live.concat(sim.packets);
    const window = Math.min(cfg.window, Math.max(now, 0.25));
    const trim = (list, keep = cfg.window) => {
      let old = 0;
      while (old < list.length && (list[old].at ?? list[old]) < now - keep) old++;
      if (old) list.splice(0, old);
    };
    for (const node of nodes.values()) {
      trim(node.recent);
      trim(node.recentDrops);
      trim(node.recentErrors);
      trim(node.service, 3);
      trim(node.roots, 3);
      node.flow = node.recent.length / window;
      node.dropRate = node.recentDrops.length / window;
      node.errorRateSeen = node.recentErrors.length / window;
    }
    for (const edge of edges) {
      trim(edge.recent);
      trim(edge.recentErrors);
      edge.flow = edge.recent.length / window;
      edge.errorRate = edge.recentErrors.length / window;
    }
    sim.histClock += dt;
    if (sim.histClock >= 0.25) {
      sim.histClock = 0;
      for (const node of nodes.values()) {
        node.hist.push(node.flow);
        if (node.hist.length > 120) node.hist.shift();
      }
      sim.hist.push(totalIn());
      if (sim.hist.length > 120) sim.hist.shift();
    }
    if (sim.events.length > 512) sim.events.splice(0, sim.events.length - 512);
  }

  const totalIn = () => [...nodes.values()].reduce((sum, node) => sum + (node.emit && node.up ? node.flow : 0), 0);

  function setUp(id, up) {
    const target = targetOf(id, nodes);
    if (target.type === "broker") return setBroker(target.node, target.broker, up);
    const node = nodes.get(id);
    if (!node || node.up === up) return;
    node.up = up;
    node.downSince = up ? null : sim.time;
    if (!up) {
      // In-flight work is lost; callers waiting on it get a reset.
      for (const job of node.jobs) {
        if (job.call && !job.done && !job.call.done) job.call.packets.push(launch(job.call.edge, "error", { call: job.call, ms: 0 }));
        job.dead = true;
      }
      node.jobs.clear();
      node.working = [];
      node.waiting = [];
    }
    if (up && node === flagNode) for (const flag of flags.values()) syncFlag(flag);
    sim.events.push({ type: up ? "recover" : "fail", node: id, at: sim.time });
    for (const log of logs.values()) for (const group of log.groups) if (group.members.some((edge) => edge.to === id)) rebalance(log, group, sim.time);
  }

  function syncFlag(flag) {
    if (flagNode && !flagNode.up) return;
    if (flag.effective === flag.rollout) return;
    flag.effective = flag.rollout;
    sim.events.push({ type: "flag", flag: flag.name, rollout: flag.effective, at: sim.time });
  }

  // "from>to" in a scenario's `set` changes that edge: retries, timeout, backoff, p, breaker.
  const EDGE_SETTABLE = new Set(["retries", "timeout", "backoff", "p", "breaker", "rate"]);
  function setEdge(key, props) {
    const { from, to } = targetOf(key);
    const list = edges.filter((edge) => edge.from === from && edge.to === to);
    if (!list.length) throw new Error(`scenario: no edge "${key}"`);
    for (const edge of list) for (const [name, value] of Object.entries(props)) {
      if (!EDGE_SETTABLE.has(name)) throw new Error(`scenario: can't set "${name}" on an edge (settable: ${[...EDGE_SETTABLE].join(", ")})`);
      if (name === "breaker") {
        edge.breaker = breakerOf(value);
        sim.events.push({ type: "breaker", edge: edge.index, state: edge.breaker ? "closed" : "none", at: sim.time });
      } else edge[name] = value;
      if (name === "timeout") allowanceOf(edge);
    }
  }

  const SETTABLE = new Set(["emit", "rate", "capacity", "burst", "errorRate", "ms", "queue", "detect", "ttl", "route", "health", "sidecarMs"]);
  function apply(step) {
    if (step.fail) [].concat(step.fail).forEach((id) => setUp(id, false));
    if (step.recover) [].concat(step.recover).forEach((id) => setUp(id, true));
    if (step.set) {
      for (const [id, props] of Object.entries(step.set)) {
        if (targetOf(id).type === "edge") {
          setEdge(id, props);
          continue;
        }
        const node = nodes.get(id);
        if (!node) throw new Error(`scenario: unknown node "${id}"`);
        for (const [key, value] of Object.entries(props)) {
          if (!SETTABLE.has(key)) throw new Error(`scenario: can't set "${key}" (settable: ${[...SETTABLE].join(", ")})`);
          if (key === "queue") node.queueMax = value;
          else node[key] = value;
          if (key === "emit" && typeof value === "number") node.clock = Math.min(node.clock, 1 / Math.max(value, 0.001));
        }
      }
    }
    for (const [name, rollout] of [[step.flag, step.rollout ?? 1], [step.kill, 0]]) {
      if (!name) continue;
      const flag = flags.get(name);
      if (!flag) throw new Error(`scenario: unknown flag "${name}"`);
      flag.rollout = rollout;
      syncFlag(flag);
    }
  }

  sim.step = (dt) => {
    // Sub-step so a long frame doesn't teleport packets past their arrival.
    const n = Math.max(1, Math.ceil(dt / (1 / 60)));
    for (let i = 0; i < n; i++) step(dt / n);
  };
  sim.setUp = setUp;
  sim.setBroker = setBroker;
  sim.readable = readable;
  sim.isrOf = isrOf;
  sim.apply = apply;
  sim.totalIn = totalIn;
  sim.lagOf = (id, groupName) => {
    const log = logs.get(id);
    if (!log) return 0;
    const group = groupName ? log.groups.find((g) => g.name === groupName) : log.groups[0];
    if (!group) return 0;
    return log.end.reduce((sum, end, p) => sum + end - group.committed[p], 0);
  };
  sim.latencyOf = (id) => latencyOf(id ? [nodes.get(id)] : [...nodes.values()]);
  sim.statsOf = (id) => statsOf(sim, id);
  sim.summary = () => summaryOf(sim);
  return sim;
}

// p50 / p99 of completed requests started at these sources, over the last 3 s of model time.
function latencyOf(sources) {
  const samples = [];
  let failed = 0;
  for (const node of sources) for (const root of node?.roots || []) {
    if (root.ok) samples.push(root.ms);
    else failed++;
  }
  samples.sort((a, b) => a - b);
  return { p50: quantile(samples, 0.5), p99: quantile(samples, 0.99), count: samples.length, failed };
}

const fmt = (n) => (n >= 10000 ? `${(n / 1000).toFixed(0)}k` : n >= 1000 ? `${(n / 1000).toFixed(1)}k` : n >= 10 ? n.toFixed(0) : n.toFixed(1));
const formatRate = (n, per = 1) => `${fmt(n * per)}/s`;
const formatCount = (n, per = 1) => fmt(n * per).replace(/\.0$/, "");
const formatMs = (ms) => (ms >= 1000 ? `${(ms / 1000).toFixed(1)}s` : ms >= 10 ? `${ms.toFixed(0)}ms` : `${ms.toFixed(1)}ms`);

function statsOf(sim, id) {
  const node = sim.nodes.get(id);
  if (!node) return "";
  const per = sim.cfg.per;
  const name = node.label || node.id;
  if (!node.up) return `${name} · down${node.dropRate ? ` · ${formatRate(node.dropRate, per)} refused` : ""}`;
  const log = sim.logs.get(id);
  if (log) {
    const parts = log.groups.map((group) => {
      const lag = sim.lagOf(id, group.name);
      const live = [...group.assign.values()].filter((list) => list.length).length;
      return `${log.groups.length > 1 ? group.name + " " : ""}lag ${formatCount(lag, per)}${group.pause > 0 ? " · rebalancing" : node.kind === "kafka" ? ` · ${live}/${group.members.length} consumers` : ""}`;
    });
    if (log.brokers) {
      const live = log.brokers.filter(Boolean).length;
      const electing = log.parts.filter((part) => sim.time < part.electUntil).length;
      const offline = log.parts.filter((part) => !log.brokers[part.leader]).length;
      const under = log.parts.filter((part) => sim.isrOf(log, part) < log.minIsr).length;
      parts.push(`brokers ${live}/${log.brokers.length}`);
      if (electing) parts.push(`${electing} electing`);
      if (offline) parts.push(`${offline} offline`);
      if (under) parts.push(`${under} under min ISR${log.acks === "all" ? " (writes refused)" : ""}`);
    }
    return `${name} · in ${formatRate(node.flow, per)} · ${parts.join(" · ")}`;
  }
  if (node.kind === "flags") {
    const list = [...sim.flags.values()].map((flag) => `${flag.name} ${Math.round(flag.effective * 100)}%${flag.effective !== flag.rollout ? ` (→${Math.round(flag.rollout * 100)}%)` : ""}`);
    return `${name} · ${list.join(" · ") || "no flags"}`;
  }
  const bits = [`${name} · ${formatRate(node.flow, per)}`];
  if (node.roots.length) {
    const lat = latencyOf([node]);
    if (lat.count) bits.push(`p50 ${formatMs(lat.p50)} · p99 ${formatMs(lat.p99)}`);
  } else if (node.service.length) {
    const sorted = node.service.map((s) => s.ms).sort((a, b) => a - b);
    bits.push(`${formatMs(quantile(sorted, 0.5))} p50`);
  }
  if (node.capacity) bits.push(`cap ${formatRate(node.capacity, per)}`);
  if (node.queueMax) bits.push(`queue ${node.waiting.length}/${node.queueMax}`);
  if (node.dropRate) bits.push(`${formatRate(node.dropRate, per)} rejected`);
  if (node.errorRateSeen) bits.push(`${formatRate(node.errorRateSeen, per)} errors`);
  for (const edge of node.out) if (edge.breaker && edge.breaker.state !== "closed") bits.push(`breaker → ${sim.nodes.get(edge.to).label || edge.to} ${edge.breaker.state}`);
  return bits.join(" · ");
}

function summaryOf(sim) {
  const per = sim.cfg.per;
  let lag = 0;
  let drops = 0;
  for (const node of sim.nodes.values()) drops += node.dropRate;
  for (const id of sim.logs.keys()) lag += sim.lagOf(id);
  const bits = [`${formatRate(sim.totalIn(), per)} in`];
  const lat = sim.latencyOf();
  if (lat.count) bits.push(`p50 ${formatMs(lat.p50)} · p99 ${formatMs(lat.p99)}`);
  if (sim.logs.size) bits.push(`lag ${formatCount(lag, per)}`);
  const failing = lat.failed / 3;
  const down = [...sim.nodes.values()].filter((node) => !node.up).length;
  bits.push(failing > 0.05 ? `${formatRate(failing, per)} failing` : drops ? `${formatRate(drops, per)} lost` : down ? `${down} down` : "healthy");
  return bits.join(" · ");
}

// The drawing core: an orthographic camera over a floor (x, y) with z up, shaded prisms,
// lines laid on faces, SVG string emitters, and the framed card a figure sits in.
// World units are about one pixel of the real thing; the camera is fitted to the scene.

const DEG = Math.PI / 180;

// --- camera -------------------------------------------------------------------------------------

// P = { origin: [sx, sy], scale, azimuth, elevation } (degrees). Azimuth turns the floor;
// elevation tilts it toward the viewer: 90 looks straight down.
function cameraOf(P) {
  const a = (P.azimuth ?? 45) * DEG;
  const e = (P.elevation ?? 30) * DEG;
  return { sa: Math.sin(a), ca: Math.cos(a), se: Math.sin(e), ce: Math.cos(e), k: P.scale };

function iso([x, y, z], P) {
  const c = cameraOf(P);
  const across = x * c.sa - y * c.ca;
  const away = x * c.ca + y * c.sa;
  return [P.origin[0] + across * c.k, P.origin[1] + (away * c.se - z * c.ce) * c.k];

// Larger is nearer the viewer: sort ascending to paint back to front.
function depthOf([x, y, z], P) {

function fitProjection(points, width, height, { pad = 24, azimuth = 45, elevation = 30 } = {}) {
  const unit = { origin: [0, 0], scale: 1, azimuth, elevation };
  let [x0, y0, x1, y1] = [Infinity, Infinity, -Infinity, -Infinity];
  for (const point of points) {
    const [x, y] = iso(point, unit);
    x0 = Math.min(x0, x);
    x1 = Math.max(x1, x);
    y0 = Math.min(y0, y);
    y1 = Math.max(y1, y);
  }
  const scale = Math.min((width - 2 * pad) / Math.max(x1 - x0, 1e-6), (height - 2 * pad) / Math.max(y1 - y0, 1e-6));

// Monotone-chain convex hull of screen points.
function convexHull(points) {

  const turn = (o, p, q) => (p[0] - o[0]) * (q[1] - o[1]) - (p[1] - o[1]) * (q[0] - o[0]);

function roundedPlan({ x, y, w, d, r }, steps = 8) {

    [x + w - rr, y + d - rr, 0],
    [x + rr, y + d - rr, 90],

  [x + inset, y + inset],

  [x + inset, y + d - inset],
  [x + w - inset, y + d - inset],

function boxCorners({ x, y, w, d }, z0, z1) {

// A convex floor outline extruded from z to z + height. Each visible side gets one of four

function extrude(ring, z, height, P, { bevel = 0 } = {}) {
  const n = ring.length;

  const outward = area > 0 ? 1 : -1;

  const base = ring.map(([x, y]) => iso([x, y, z], P));
  const shades = [[], [], [], []];
  const crease = [];
  const bevels = [];
  const centre = ring.reduce((sum, p) => [sum[0] + p[0] / n, sum[1] + p[1] / n], [0, 0]);
  for (let i = 0; i < n; i++) {

    const [bx, by] = ring[j];

  return {
    fill: pathOf(hull, true),
    shades: shades.map((list) => list.join("")),
    top: pathOf(top, true),
    crease: crease.join(""),
    bevel: bevels.join(""),
    outline: pathOf(hull, true),

const slabOf = (plan, z, height, P, steps = 8, bevel = 0) => extrude(roundedPlan(plan, steps), z, height, P, { bevel });

// The half of a horizontal circle at height z that faces the viewer: a band on a cylinder.
function sideArc(cx, cy, r, z, P, steps = 24) {

function sideSeam(plan, z, P, steps = 8) {

  for (const node of model.nodes) pts.push(...k.boxCorners(node.plan, 0, view === "iso" ? heightOf(node) : 0));
  for (const group of model.groups) pts.push(...k.boxCorners(group.box, -2, 0));
  for (const node of model.nodes) pts.push([node.cx - node.label.length * 2.6, node.plan.y + node.plan.d + 14, 0], [node.cx + node.label.length * 2.6, node.plan.y + node.plan.d + 14, 0]);
  return pts;
}

function heightOf(node) {
  if (node.kind === "service" || node.kind === "worker") return node.replicas * 8.8 + 1;
  if (isLog(node)) return 10;
  return node.h;
}

function projectionOf(model, view, width = 640, camera) {
  const { azimuth, elevation } = camera || VIEWS[view];
  const pts = extentOf(model, view);
  const unit = { origin: [0, 0], scale: 1, azimuth, elevation };
  const flat = pts.map((p) => k.iso(p, unit));
  const xs = flat.map(([x]) => x);
  const ys = flat.map(([, y]) => y);
  const aspect = (Math.max(...ys) - Math.min(...ys)) / (Math.max(...xs) - Math.min(...xs));
  const pad = 26;
  const height = Math.round(Math.min(760, Math.max(240, (width - pad * 2) * aspect + pad * 2)));
  return { P: k.fitProjection(pts, width, height, { pad, azimuth, elevation }), width, height };
}

// ---------------------------------------------------------------------------------------------
// Isometric renderers. Each returns markup for one node at rest; the live page only toggles
// attributes (LEDs, record cells, down) and moves cursors and packets.

function isoKit(P) {
  const at = (p) => k.iso(p, P);
  const S = (paths, style) => k.solidSvg(paths, style);
  const L = (d, style) => k.lineSvg(d, style);
  const led = (id, p, r = 1.3) => {
    const [x, y] = at(p);
    return `<circle class="tp-led" data-led="${escape(id)}" cx="${r1(x)}" cy="${r1(y)}" r="${r}"/>`;
  };
  const dots = (pts, style) => k.dotsSvg(pts.map(at), style);
  // A closed rectangle on the +y face (the face toward the lower left).
  const faceY = (x0, x1, y, z0, z1) => k.pathOf([at([x0, y, z0]), at([x1, y, z0]), at([x1, y, z1]), at([x0, y, z1])], true);
  const faceX = (x, y0, y1, z0, z1) => k.pathOf([at([x, y0, z0]), at([x, y1, z0]), at([x, y1, z1]), at([x, y0, z1])], true);
  return { at, S, L, led, dots, faceY, faceX, P };
}

const ISO = {
  service(node, c) {
    const { plan } = node;
    const out = [];
    for (let r = 0; r < node.replicas; r++) {
      const z = r * 8.8;
      const top = r === node.replicas - 1;
      out.push(c.S(k.slabOf(plan, z, 8, c.P, 3, 0.6), { tone: "mid", crease: "faint" }));
      const fy = plan.y + plan.d;
      for (let b = 0; b < 3; b++) out.push(c.L(c.faceY(plan.x + 14 + b * 11, plan.x + 23 + b * 11, fy, z + 2.4, z + 5.6), { tone: "lo" }));
      out.push(c.L(c.faceX(plan.x + plan.w, plan.y + 6, plan.y + plan.d - 6, z + 3.2, z + 4.8), { tone: "faint" }));
      out.push(c.led(`${node.id}:${r}`, [plan.x + 6, fy, z + 4]));
      if (top) {
        out.push(c.L(k.planOutline(k.insetPlan(plan, 4), z + 8, c.P, 3), { tone: "faint" }));
        out.push(c.dots(k.corners(plan, 2.2).map(([x, y]) => [x, y, z + 8]), { size: 0.5, tone: "lo" }));
        if (node.kind === "worker") out.push(c.L(k.ring(node.cx, node.cy, 6, z + 8, c.P, 24) + k.ring(node.cx, node.cy, 2.4, z + 8, c.P, 16), { tone: "lo" }));
      }
    }
    return out.join("");
  },
  worker(node, c) {
    return ISO.service(node, c);
  },
  cache(node, c) {
    const { plan } = node;
    const out = [c.S(k.slabOf(plan, 0, 5, c.P, 3, 0.6), { tone: "mid" })];
    out.push(c.L(k.planOutline(k.insetPlan(plan, 3), 5, c.P, 3), { tone: "faint" }));
    const chips = [];
    for (let row = 0; row < 2; row++)
      for (let col = 0; col < 4; col++) chips.push({ x: plan.x + 6 + col * 11.4, y: plan.y + 6 + row * 13, w: 8.6, d: 10, r: 0.8 });
    chips.sort((a, b) => a.x + a.y - (b.x + b.y));
    for (const chip of chips) out.push(c.S(k.slabOf(chip, 5, 2.6, c.P, 2), { tone: "hi", crease: "lo" }));
    out.push(c.led(`${node.id}:0`, [plan.x + 5, plan.y + plan.d, 2.5]));
    out.push(c.dots([[plan.x + 11, plan.y + plan.d, 2.5], [plan.x + 15, plan.y + plan.d, 2.5]], { size: 0.6, tone: "lo" }));
    return out.join("");
  },
  db(node, c) {
    const r = Math.min(node.w, node.d) / 2;
    const out = [];
    const toward = [Math.cos(Math.PI / 4), Math.sin(Math.PI / 4)];
    for (let s = 0; s < 3; s++) {
      const z = s * 10;
      out.push(c.S(k.cylinder(node.cx, node.cy, r, z, 9, c.P, 48, s === 2 ? 0.8 : 0), { tone: "mid" }));
      out.push(c.L(k.sideArc(node.cx, node.cy, r, z + 4.5, c.P, 32), { tone: "faint" }));
      out.push(c.led(`${node.id}:${s === 2 ? 0 : "x" + s}`, [node.cx + r * toward[0], node.cy + r * toward[1], z + 4.5], 1.1));
    }
    out.push(c.L(k.ring(node.cx, node.cy, r - 4, 29, c.P, 40), { tone: "lo" }));
    out.push(c.dots([[node.cx, node.cy, 29]], { size: 0.8, tone: "mid" }));
    if (node.role) out.push(k.faceTextSvg(k.topMatrix([node.cx, node.cy + 4], 29, c.P, "x"), node.role.toUpperCase(), { size: 4, tone: "lo", anchor: "middle" }));
    return out.join("");
  },
  storage(node, c) {
    const r = Math.min(node.w, node.d) / 2;
    const out = [];
    [r - 5, r - 2.5, r].forEach((radius, s) => {
      out.push(c.S(k.cylinder(node.cx, node.cy, radius, s * 8, s === 2 ? 10 : 8, c.P, 48, s === 2 ? 0.8 : 0), { tone: "mid" }));
    });
    out.push(c.L(k.ring(node.cx, node.cy, r - 3, 26, c.P, 40), { tone: "lo" }));
    out.push(c.L(k.ring(node.cx, node.cy, r - 7, 26, c.P, 40), { tone: "faint" }));
    out.push(c.led(`${node.id}:0`, [node.cx + r * 0.707, node.cy + r * 0.707, 21], 1.1));
    return out.join("");
  },
  lb(node, c) {
    const r = Math.min(node.w, node.d) / 2;
    const rot = Array.from({ length: 8 }, (_, i) => {
      const a = ((i + 0.5) / 8) * Math.PI * 2;
      return [node.cx + r * Math.cos(a), node.cy + r * Math.sin(a)];
    });
    const out = [c.S(k.extrude(rot, 0, 10, c.P, { bevel: 0.8 }), { tone: "mid" })];
    out.push(c.L(k.ring(node.cx, node.cy, r - 6, 10, c.P, 40), { tone: "faint" }));
    const fan = [-0.6, 0, 0.6].map((a) => k.lineOnTop([node.cx - 9, node.cy], [node.cx + 11 * Math.cos(a), node.cy + 11 * Math.sin(a)], 10, c.P)).join("");
    out.push(c.L(fan, { tone: "mid", free: "end" }));
    out.push(c.dots([[node.cx - 9, node.cy, 10]], { size: 0.9, tone: "hi" }));
    out.push(c.led(`${node.id}:0`, [node.cx + r * 0.92 * 0.707, node.cy + r * 0.92 * 0.707, 5], 1.2));
    return out.join("");
  },
  gateway(node, c) {
    const { plan } = node;
    const out = [c.S(k.slabOf(plan, 0, 4, c.P, 3, 0.6), { tone: "mid" })];
    const posts = [
      { x: plan.x + 4, y: plan.y + 4, w: 9, d: plan.d - 8, r: 1 },
      { x: plan.x + plan.w - 13, y: plan.y + 4, w: 9, d: plan.d - 8, r: 1 },
    ];
    for (const post of posts) out.push(c.S(k.slabOf(post, 4, 9, c.P, 2, 0.4), { tone: "mid" }));
    const beam = { x: plan.x + 2, y: plan.y + 3, w: plan.w - 4, d: plan.d - 6, r: 1.5 };
    out.push(c.S(k.slabOf(beam, 13, 3, c.P, 3, 0.6), { tone: "hi", crease: "lo" }));
    out.push(c.L(k.planOutline(k.insetPlan(beam, 3), 16, c.P, 3), { tone: "faint" }));
    out.push(c.led(`${node.id}:0`, [plan.x + plan.w / 2, plan.y + plan.d - 3, 14.5]));
    return out.join("");
  },
  client(node, c) {
    const { plan } = node;
    const out = [];
    const deck = { x: plan.x, y: plan.y + 8, w: plan.w, d: plan.d - 8, r: 2 };
    out.push(c.S(k.slabOf(deck, 0, 2.4, c.P, 3, 0.4), { tone: "mid" }));
    out.push(c.L(k.planOutline(k.insetPlan({ ...deck, y: deck.y + 3, d: deck.d - 9 }, 3), 2.4, c.P, 2), { tone: "faint" }));
    out.push(c.L(k.planOutline({ x: node.cx - 6, y: deck.y + deck.d - 6, w: 12, d: 4, r: 1 }, 2.4, c.P, 2), { tone: "faint" }));
    const lid = { x: plan.x, y: plan.y + 4, w: plan.w, d: 3, r: 1 };
    out.push(c.S(k.slabOf(lid, 2.4, 22, c.P, 2, 0.4), { tone: "mid" }));
    const fy = lid.y + lid.d;
    out.push(`<path class="tp-screen" d="${c.faceY(plan.x + 3, plan.x + plan.w - 3, fy, 5, 22)}"/>`);
    for (let i = 0; i < 3; i++) out.push(c.L(k.segment([plan.x + 7, fy, 18 - i * 4], [plan.x + 7 + [22, 16, 19][i], fy, 18 - i * 4], c.P), { tone: "lo", free: true }));
    out.push(c.led(`${node.id}:0`, [plan.x + plan.w - 7, fy, 8]));
    return out.join("");
  },
  box(node, c) {
    const { plan } = node;
    const out = [c.S(k.slabOf(plan, 0, 14, c.P, 3, 0.6), { tone: "mid" })];
    out.push(c.L(k.planOutline(k.insetPlan(plan, 4), 14, c.P, 3), { tone: "faint" }));
    out.push(c.L(k.sideSeam(plan, 4, c.P, 3), { tone: "faint" }));
    out.push(c.led(`${node.id}:0`, [plan.x + 6, plan.y + plan.d, 9]));
    return out.join("");
  },
  kafka(node, c) {
    const { plan } = node;
    const out = [c.S(k.slabOf(plan, 0, 6, c.P, 3, 0.8), { tone: "mid" })];
    const fy = plan.y + plan.d;
    if (node.brokers) {
      // One small broker unit per broker down the left end; click one to fail it.
      const n = node.brokers;
      const span = (plan.d - 8) / n;
      for (let i = n - 1; i >= 0; i--) {
        const unit = { x: plan.x + 5, y: plan.y + 4 + i * span + 0.8, w: 12, d: span - 1.6, r: 1 };
        out.push(`<g class="tp-broker" data-part="broker:${i}">${c.S(k.slabOf(unit, 6, 5, c.P, 2, 0.4), { tone: "mid" })}${c.led(`${node.id}:b${i}`, [unit.x + unit.w, unit.y + unit.d / 2, 8.5], 1)}</g>`);
      }
    } else {
      for (let b = 0; b < 3; b++) out.push(c.led(`${node.id}:b${b}`, [plan.x + 6 + b * 5, fy, 3], 1.1));
      out.push(c.L(c.faceY(plan.x + 24, plan.x + plan.w - 6, fy, 2, 4), { tone: "faint" }));
    }
    for (let p = 0; p < node.partitions; p++) {
      const lane = laneOf(node, p);
      out.push(`<g class="tp-lane" data-lane="${escape(node.id)}:${p}">`);
      out.push(c.S(k.slabOf({ ...lane, x: lane.x - 2, w: lane.w + 4, y: lane.y - 0.5, d: lane.d + 1, r: 1 }, 6, 0.6, c.P, 2), { tone: "lo", crease: "none" }));
      for (let i = 0; i < SLOTS; i++) {
        const cell = { x: lane.x + i * PITCH + 0.7, y: lane.y + 0.8, w: PITCH - 1.4, d: lane.d - 1.6, r: 0.6 };
        out.push(`<g class="tp-cell" data-cell="${escape(node.id)}:${p}:${i}">${c.S(k.slabOf(cell, 6.6, 2.2, c.P, 2), { tone: "lo", crease: "none" })}</g>`);
      }
      (node.groups || ["default"]).slice(0, 3).forEach((_, g) => {
        const post = { x: lane.x - 0.8, y: lane.y - 1.4, w: 1.6, d: lane.d + 2.8, r: 0.4 };
        out.push(`<g class="tp-cursor" data-cursor="${escape(node.id)}:${g}:${p}" data-g="${g}">${c.S(k.slabOf(post, 6.6, 4.4 + g * 1.6, c.P, 1), { tone: "hi", lit: g === 0 })}</g>`);
      });
      out.push(`</g>`);
    }
    return out.join("");
  },
  cdn(node, c) {
    const { plan } = node;
    const r = Math.min(plan.w, plan.d) / 2 - 5;
    const out = [c.S(k.slabOf(plan, 0, 4, c.P, 3, 0.6), { tone: "mid" })];
    out.push(c.S(k.cylinder(node.cx, node.cy, r, 4, 6, c.P, 48, 0.6), { tone: "hi", crease: "lo" }));
    out.push(c.L(k.sideArc(node.cx, node.cy, r, 7, c.P, 32), { tone: "faint" }));
    out.push(c.L(k.ring(node.cx, node.cy, r * 0.62, 10, c.P, 40) + k.ring(node.cx, node.cy, r * 0.25, 10, c.P, 24), { tone: "lo" }));
    out.push(c.L(k.lineOnTop([node.cx - r, node.cy], [node.cx + r, node.cy], 10, c.P) + k.lineOnTop([node.cx, node.cy - r], [node.cx, node.cy + r], 10, c.P), { tone: "faint" }));
    out.push(c.led(`${node.id}:0`, [plan.x + 5, plan.y + plan.d, 2]));
    return out.join("");
  },
  dns(node, c) {
    const out = [c.S(k.slabOf(k.insetPlan(node.plan, 4), 0, 3, c.P, 3, 0.5), { tone: "mid" })];
    out.push(c.S(k.cylinder(node.cx, node.cy, 3, 3, 17, c.P, 20), { tone: "mid", crease: "none" }));
    out.push(c.L([8, 13].map((z) => k.sideArc(node.cx, node.cy, 3, z, c.P, 12)).join(""), { tone: "faint" }));
    out.push(c.S(k.cylinder(node.cx, node.cy, 10, 20, 2.4, c.P, 40, 0.5), { tone: "hi", crease: "lo" }));
    out.push(c.L(k.ring(node.cx, node.cy, 6, 22.4, c.P, 32), { tone: "lo" }));
    out.push(c.led(`${node.id}:0`, [node.cx, node.cy, 22.4], 1.3));
    return out.join("");
  },
  external(node, c) {
    const { plan } = node;
    const out = [`<g class="tp-ext">${c.S(k.slabOf(plan, 0, 14, c.P, 3, 0.6), { tone: "mid" })}</g>`];
    out.push(c.L(k.planOutline(k.insetPlan(plan, 4), 14, c.P, 3), { tone: "faint", dashed: true }));
    out.push(c.dots([0, 1, 2].map((i) => [node.cx - 5 + i * 5, node.cy, 14]), { size: 0.9, tone: "mid" }));
    out.push(c.led(`${node.id}:0`, [plan.x + 6, plan.y + plan.d, 9]));
    return out.join("");
  },
  scheduler(node, c) {
    const { plan } = node;
    const out = [c.S(k.slabOf(plan, 0, 6, c.P, 3, 0.6), { tone: "mid" })];
    const r = Math.min(plan.w, plan.d) / 2 - 4;
    out.push(c.S(k.cylinder(node.cx, node.cy, r, 6, 2, c.P, 48, 0.5), { tone: "hi", crease: "lo" }));
    const ticks = k.radialTicks(node.cx, node.cy, r - 1.5, 12, 3, 8, [1.2, 2.4], c.P);
    out.push(c.L(ticks.minor, { tone: "lo" }), c.L(ticks.major, { tone: "mid" }));
    out.push(c.L(k.lineOnTop([node.cx, node.cy], [node.cx, node.cy - r * 0.62], 8, c.P) + k.lineOnTop([node.cx, node.cy], [node.cx + r * 0.42, node.cy + r * 0.2], 8, c.P), { tone: "hi", free: "end" }));
    out.push(c.dots([[node.cx, node.cy, 8]], { size: 0.8, tone: "hi" }));
    out.push(c.led(`${node.id}:0`, [plan.x + 5, plan.y + plan.d, 3]));
    return out.join("");
  },
  flags(node, c) {
    const { plan } = node;
    const out = [c.S(k.slabOf(plan, 0, 6, c.P, 3, 0.6), { tone: "mid" })];
    flagRows(node).forEach(({ name, slot, knob }) => {
      out.push(c.S(k.slabOf(slot, 6, 0.6, c.P, 2), { tone: "lo", crease: "none" }));
      out.push(`<g class="tp-knob" data-flag="${escape(name)}">${c.S(k.slabOf(knob, 6.6, 2.2, c.P, 2), { tone: "hi", lit: true })}</g>`);
      out.push(k.faceTextSvg(k.topMatrix([plan.x + 4, slot.y + slot.d - 0.6], 6, c.P, "x"), name.slice(0, 7), { size: 3.4, tone: "lo" }));
    });
    out.push(c.led(`${node.id}:0`, [plan.x + plan.w - 5, plan.y + plan.d, 3]));
    return out.join("");
  },
  queue(node, c) {
    return ISO.kafka(node, c);
  },
};

// Rows of switches on a flags panel: a slot and a knob that slides with the rollout.
function flagRows(node) {
  const names = node.flagNames || [];
  const { plan } = node;
  return names.slice(0, 4).map((name, i) => {
    const y = plan.y + 4 + i * ((plan.d - 8) / Math.max(1, Math.min(4, names.length)));
    const slot = { x: plan.x + plan.w - 26, y, w: 22, d: 5, r: 1 };
    return { name, slot, knob: { x: slot.x + 0.5, y: y + 0.5, w: 8, d: 4, r: 0.8 }, travel: slot.w - 9 };
  });
}

function laneOf(node, p) {
  const top = node.plan.y + 7;
  return { x: node.plan.x + node.plan.w - 8 - SLOTS * PITCH, y: top + p * LANE, w: SLOTS * PITCH, d: LANE - 3, r: 1 };
}

// Where a node's label lies on the floor in iso: in front of it, else along its right side,
// whichever no nearer node hides. `labelSpots` is shared with `build.mjs --check`.
function labelSpots(node) {
  const half = node.label.length * 2.4;
  const front = { at: [node.cx, node.plan.y + node.plan.d + 10], along: "x" };
  front.marks = [[node.cx - half, front.at[1]], front.at, [node.cx + half, front.at[1]]];
  const side = { at: [node.plan.x + node.plan.w + 9, node.cy], along: "y" };
  side.marks = [[side.at[0], node.cy - half], side.at, [side.at[0], node.cy + half]];
  return [front, side];
}

// The spots a label may take: the one `labelAt` forces, else front then side.
function labelTries(node) {
  const [front, side] = labelSpots(node);
  return node.labelAt === "side" ? [side] : node.labelAt === "front" ? [front] : [front, side];
}

function hiddenBy(model, node, spot, P) {
  const marks = spot.marks.map((m) => ({ s: k.iso([m[0], m[1], 0], P), depth: k.depthOf([m[0], m[1], 0], P) }));
  const blockers = [];
  for (const other of model.nodes) {
    if (other === node) continue;
    const hull = k.convexHull(k.pointsAt(k.boxCorners(other.plan, 0, heightOf(other)), P));
    const front = k.depthOf([other.cx, other.cy, 0], P);
    if (marks.some((m) => front > m.depth - 20 && inside(hull, m.s))) blockers.push(other.id);
  }
  return blockers;
}

function inside(hull, [x, y]) {
  for (let i = 0; i < hull.length; i++) {
    const [ax, ay] = hull[i];
    const [bx, by] = hull[(i + 1) % hull.length];
    if ((bx - ax) * (y - ay) - (by - ay) * (x - ax) < 0) return false;
  }
  return hull.length > 2;
}

function isoLabel(node, c, model) {
  // Morph frames reuse the spot chosen for the resting view.
  if (model.fastLabels && node.labelSpot) return k.faceTextSvg(k.topMatrix(node.labelSpot.at, 0, c.P, node.labelSpot.along), node.label, { size: 8, tone: "hi", anchor: "middle" });
  const tries = labelTries(node);
  const spot = tries.find((s) => !hiddenBy(model, node, s, c.P).length) || tries[0];
  node.labelSpot = spot;
  return k.faceTextSvg(k.topMatrix(spot.at, 0, c.P, spot.along), node.label, { size: 8, tone: "hi", anchor: "middle" });
}

// ---------------------------------------------------------------------------------------------
// Flat renderers: 2D glyphs that fill each footprint, in screen space.

function flatKit(P) {
  const at = (p) => k.iso([p[0], p[1], 0], P);
  const box = (plan) => {
    const [x0, y0] = at([plan.x, plan.y]);
    const [x1, y1] = at([plan.x + plan.w, plan.y + plan.d]);
    return { x: x0, y: y0, w: x1 - x0, h: y1 - y0 };
  };
  const rect = (b, cls = "tp-f", rx = 3, extra = "") => `<rect class="${cls}" x="${r1(b.x)}" y="${r1(b.y)}" width="${r1(b.w)}" height="${r1(b.h)}" rx="${rx}"${extra}/>`;
  const line = (pts, tone = "lo") => k.lineSvg(k.pathOf(pts), { tone });
  const text = (x, y, s, size = 8, cls = "tp-ft") => `<text class="${cls}" x="${r1(x)}" y="${r1(y)}" font-size="${size}" text-anchor="middle">${escape(s)}</text>`;
  const led = (id, x, y, r = 1.6) => `<circle class="tp-led" data-led="${escape(id)}" cx="${r1(x)}" cy="${r1(y)}" r="${r}"/>`;
  return { at, box, rect, line, text, led, P, scale: k.cameraOf(P).k };
}

const FLAT = {
  service(node, f) {
    const b = f.box(node.plan);
    const out = [];
    const stack = Math.min(node.replicas - 1, 3);
    for (let r = stack; r > 0; r--) out.push(f.rect({ ...b, x: b.x + r * 2.5, y: b.y - r * 2.5 }, "tp-f tp-f-back", 4));
    out.push(f.rect(b, "tp-f", 4));
    out.push(f.line([[b.x, b.y + 11], [b.x + b.w, b.y + 11]], "faint"));
    for (let r = 0; r < node.replicas; r++) out.push(f.led(`${node.id}:${r}`, b.x + 6 + r * 6, b.y + 5.5, 1.7));
    if (node.kind === "worker") out.push(`<circle class="tp-f-mark" cx="${r1(b.x + b.w - 7)}" cy="${r1(b.y + 5.5)}" r="2.6"/>`);
    return out.join("");
  },
  worker(node, f) {
    return FLAT.service(node, f);
  },
  cache(node, f) {
    const b = f.box(node.plan);
    const out = [f.rect(b, "tp-f", 4)];
    for (let i = 0; i < 4; i++) out.push(f.rect({ x: b.x + 7 + i * ((b.w - 14) / 4), y: b.y + 6, w: (b.w - 14) / 4 - 3, h: 7 }, "tp-f tp-f-chip", 1));
    out.push(f.led(`${node.id}:0`, b.x + b.w - 6, b.y + b.h - 10, 1.6));
    return out.join("");
  },
  db(node, f) {
    const b = f.box(node.plan);
    const rx = b.w / 2 - 2;
    const ry = Math.min(5, b.h / 6);
    const cx = b.x + b.w / 2;
    const top = b.y + ry + 1;
    const bot = b.y + b.h - ry - 1;
    const out = [`<path class="tp-f" d="M${r1(cx - rx)} ${r1(top)}V${r1(bot)}A${r1(rx)} ${r1(ry)} 0 0 0 ${r1(cx + rx)} ${r1(bot)}V${r1(top)}A${r1(rx)} ${r1(ry)} 0 0 0 ${r1(cx - rx)} ${r1(top)}Z"/>`];
    out.push(`<ellipse class="tp-f tp-f-top" cx="${r1(cx)}" cy="${r1(top)}" rx="${r1(rx)}" ry="${r1(ry)}"/>`);
    out.push(`<path class="k-line" data-tone="faint" d="M${r1(cx - rx)} ${r1(top + 9)}A${r1(rx)} ${r1(ry)} 0 0 0 ${r1(cx + rx)} ${r1(top + 9)}"/>`);
    out.push(f.led(`${node.id}:0`, cx + rx - 5, top + 14, 1.6));
    if (node.role) out.push(f.text(cx, top + 2.6, node.role.toUpperCase(), 5.5, "tp-ft tp-ft-dim"));
    return out.join("");
  },
  storage(node, f) {
    const b = f.box(node.plan);
    const cx = b.x + b.w / 2;
    const out = [`<path class="tp-f" d="M${r1(b.x + 2)} ${r1(b.y + 6)}L${r1(b.x + 7)} ${r1(b.y + b.h - 2)}H${r1(b.x + b.w - 7)}L${r1(b.x + b.w - 2)} ${r1(b.y + 6)}Z"/>`];
    out.push(`<ellipse class="tp-f tp-f-top" cx="${r1(cx)}" cy="${r1(b.y + 6)}" rx="${r1(b.w / 2 - 2)}" ry="4"/>`);
    out.push(f.led(`${node.id}:0`, cx, b.y + 16, 1.6));
    return out.join("");
  },
  lb(node, f) {
    const b = f.box(node.plan);
    const cx = b.x + b.w / 2;
    const cy = b.y + b.h / 2;
    const r = Math.min(b.w, b.h) / 2;
    const oct = Array.from({ length: 8 }, (_, i) => {
      const a = ((i + 0.5) / 8) * Math.PI * 2;
      return [cx + r * Math.cos(a), cy + r * Math.sin(a)];
    });
    const out = [`<path class="tp-f" d="${k.pathOf(oct, true)}"/>`];
    for (const a of [-0.6, 0, 0.6]) out.push(k.lineSvg(k.pathOf([[cx - r * 0.45, cy - 3], [cx + r * 0.5 * Math.cos(a), cy - 3 + r * 0.5 * Math.sin(a)]]), { tone: "mid", free: "end" }));
    out.push(f.led(`${node.id}:0`, cx - r * 0.45, cy - 3, 1.8));
    return out.join("");
  },
  gateway(node, f) {
    const b = f.box(node.plan);
    const out = [f.rect(b, "tp-f", 4)];
    out.push(`<path class="k-line" data-tone="lo" d="M${r1(b.x + 8)} ${r1(b.y + b.h)}V${r1(b.y + 12)}Q${r1(b.x + b.w / 2)} ${r1(b.y + 2)} ${r1(b.x + b.w - 8)} ${r1(b.y + 12)}V${r1(b.y + b.h)}"/>`);
    out.push(f.led(`${node.id}:0`, b.x + b.w / 2, b.y + 9, 1.6));
    return out.join("");
  },
  client(node, f) {
    const b = f.box(node.plan);
    const out = [f.rect({ x: b.x, y: b.y, w: b.w, h: b.h - 7 }, "tp-f", 3)];
    out.push(f.rect({ x: b.x + 3, y: b.y + 3, w: b.w - 6, h: b.h - 13 }, "tp-screen", 1));
    out.push(f.line([[b.x + b.w / 2, b.y + b.h - 7], [b.x + b.w / 2, b.y + b.h - 1]], "lo"));
    out.push(f.rect({ x: b.x + b.w / 2 - 8, y: b.y + b.h - 2, w: 16, h: 2 }, "tp-f", 1));
    out.push(f.led(`${node.id}:0`, b.x + b.w - 7, b.y + b.h - 10.5, 1.4));
    return out.join("");
  },
  box(node, f) {
    const b = f.box(node.plan);
    return [f.rect(b, "tp-f", 4), f.led(`${node.id}:0`, b.x + 6, b.y + 6, 1.6)].join("");
  },
  kafka(node, f) {
    const b = f.box(node.plan);
    const out = [f.rect(b, "tp-f", 4)];
    const s = f.scale;
    for (let p = 0; p < node.partitions; p++) {
      const lb = f.box(laneOf(node, p));
      out.push(`<g class="tp-lane" data-lane="${escape(node.id)}:${p}">`);
      for (let i = 0; i < SLOTS; i++) out.push(`<rect class="tp-cell tp-fcell" data-cell="${escape(node.id)}:${p}:${i}" x="${r1(lb.x + i * PITCH * s + 0.8)}" y="${r1(lb.y + 0.8)}" width="${r1(PITCH * s - 1.6)}" height="${r1(lb.h - 1.6)}" rx="1"/>`);
      (node.groups || ["default"]).slice(0, 3).forEach((_, g) => {
        out.push(`<path class="tp-cursor tp-fcursor" data-cursor="${escape(node.id)}:${g}:${p}" data-g="${g}" d="M${r1(lb.x)} ${r1(lb.y - 2 - g)}V${r1(lb.y + lb.h + 2 + g)}"/>`);
      });
      out.push(`</g>`);
    }
    if (node.brokers) {
      const n = node.brokers;
      const span = (b.h - 8) / n;
      for (let i = 0; i < n; i++) {
        const unit = { x: b.x + 5 * s, y: b.y + 4 * s + i * span + 0.6, w: 12 * s, h: span - 1.2 };
        out.push(`<g class="tp-broker" data-part="broker:${i}">${f.rect(unit, "tp-f tp-f-chip", 1)}${f.led(`${node.id}:b${i}`, unit.x + unit.w - 3, unit.y + unit.h / 2, 1.2)}</g>`);
      }
    } else for (let b2 = 0; b2 < 3; b2++) out.push(f.led(`${node.id}:b${b2}`, b.x + b.w - 4, b.y + 6 + b2 * 4, 1.1));
    return out.join("");
  },
  cdn(node, f) {
    const b = f.box(node.plan);
    const cx = b.x + b.w / 2;
    const cy = b.y + b.h / 2;
    const r = Math.min(b.w, b.h) / 2 - 4;
    return [f.rect(b, "tp-f", 4), `<circle class="tp-f tp-f-top" cx="${r1(cx)}" cy="${r1(cy)}" r="${r1(r)}"/>`, `<ellipse class="tp-f-mark" cx="${r1(cx)}" cy="${r1(cy)}" rx="${r1(r * 0.45)}" ry="${r1(r)}"/>`, k.lineSvg(`M${r1(cx - r)} ${r1(cy)}H${r1(cx + r)}`, { tone: "faint" }), f.led(`${node.id}:0`, b.x + 5, b.y + b.h - 5, 1.5)].join("");
  },
  dns(node, f) {
    const b = f.box(node.plan);
    const cx = b.x + b.w / 2;
    return [`<path class="tp-f" d="M${r1(cx - 9)} ${r1(b.y + b.h - 1)}L${r1(cx - 2)} ${r1(b.y + 8)}H${r1(cx + 2)}L${r1(cx + 9)} ${r1(b.y + b.h - 1)}Z"/>`, `<circle class="tp-f tp-f-top" cx="${r1(cx)}" cy="${r1(b.y + 7)}" r="5"/>`, f.led(`${node.id}:0`, cx, b.y + 7, 1.6)].join("");
  },
  external(node, f) {
    const b = f.box(node.plan);
    return [f.rect(b, "tp-f tp-f-ext", 4), ...[0, 1, 2].map((i) => `<circle class="tp-f-dot" cx="${r1(b.x + b.w / 2 - 6 + i * 6)}" cy="${r1(b.y + b.h / 2)}" r="1.3"/>`), f.led(`${node.id}:0`, b.x + 6, b.y + 6, 1.5)].join("");
  },
  scheduler(node, f) {
    const b = f.box(node.plan);
    const cx = b.x + b.w / 2;
    const cy = b.y + b.h / 2;
    const r = Math.min(b.w, b.h) / 2 - 3;
    return [f.rect(b, "tp-f", 4), `<circle class="tp-f tp-f-top" cx="${r1(cx)}" cy="${r1(cy)}" r="${r1(r)}"/>`, k.lineSvg(`M${r1(cx)} ${r1(cy)}V${r1(cy - r * 0.65)}M${r1(cx)} ${r1(cy)}L${r1(cx + r * 0.45)} ${r1(cy + r * 0.2)}`, { tone: "hi", free: "end" }), f.led(`${node.id}:0`, b.x + 5, b.y + b.h - 5, 1.5)].join("");
  },
  flags(node, f) {
    const b = f.box(node.plan);
    const out = [f.rect(b, "tp-f", 4)];
    flagRows(node).forEach(({ name, slot, knob }) => {
      out.push(f.rect(f.box(slot), "tp-f tp-f-chip", 2));
      out.push(`<g class="tp-knob" data-flag="${escape(name)}">${f.rect(f.box(knob), "tp-f-knob", 1.5)}</g>`);
      const sb = f.box(slot);
      out.push(`<text class="tp-ft tp-ft-dim" x="${r1(b.x + 4)}" y="${r1(sb.y + sb.h - 0.5)}" font-size="5.5" text-anchor="start">${escape(name.slice(0, 6))}</text>`);
    });
    out.push(f.led(`${node.id}:0`, b.x + b.w - 5, b.y + b.h - 4, 1.4));
    return out.join("");
  },
  queue(node, f) {
    return FLAT.kafka(node, f);
  },
};

// ---------------------------------------------------------------------------------------------
// One view: markup plus what the live page needs to move things in it.

// `camera` ({ azimuth, elevation }) overrides the iso camera: the page uses it to morph between views.
function renderView(model, view, width = 640, camera) {
  const { P, width: W, height: H } = projectionOf(model, view, width, camera);
  const features = model.features || {};
  const out = [];
  const iso = view === "iso" ? isoKit(P) : null;
  const flat = view === "flat" ? flatKit(P) : null;

  // Zones and regions: floor plates (iso) or dashed regions (flat). A region is heavier.
  for (const group of model.groups) {
    if (iso) {
      const z0 = -(group.depth + 1);
      const h = group.region ? 1.6 : 1;
      out.push(`<path class="k-halo" d="${k.haloOf(group.box, z0, h, P)}" style="opacity:calc(var(--tp-halo-opacity) * .5)"/>`);
      out.push(`<g class="tp-zone" data-depth="${group.depth}"${group.region ? ' data-region=""' : ""}>${iso.S(k.slabOf(group.box, z0, h, P, 6, 0.6), { tone: group.region ? "mid" : "lo", crease: "faint" })}`);
      out.push(iso.L(k.planOutline(k.insetPlan(group.box, 4), z0 + h, P, 5), { tone: "faint", dashed: !group.region }));
      // Along the plate's left edge, where node labels never sit.
      out.push(k.faceTextSvg(k.topMatrix([group.box.x + 6.5, group.box.y + group.box.d - 8], z0 + h, P, "y"), String(group.label).toUpperCase(), { size: group.region ? 7 : 6, tone: group.region ? "hi" : "mid" }));
      out.push(`</g>`);
    } else {
      const b = flat.box(group.box);
      out.push(`<g class="tp-zone" data-depth="${group.depth}"${group.region ? ' data-region=""' : ""}>${flat.rect(b, "tp-fzone", 8)}<text class="tp-ft tp-ft-dim" x="${r1(b.x + 8)}" y="${r1(b.y + b.h - 7)}" font-size="${group.region ? 8 : 7}" text-anchor="start">${escape(String(group.label).toUpperCase())}</text></g>`);
    }
  }

  // Edges on the floor, with a chevron where they arrive and a port ring (or a breaker) at the caller.
  const labels = [];
  for (const edge of model.edges) {
    const line = k.onTop(edge.points, 0, P);
    const start = k.iso([edge.points[0][0], edge.points[0][1], 0], P);
    const dashed = edge.kind === "async" || edge.kind === "replication" || edge.kind === "config";
    const [a, b] = [edge.points[edge.points.length - 2], edge.points[edge.points.length - 1]];
    const len = Math.hypot(b[0] - a[0], b[1] - a[1]) || 1;
    const u = [(b[0] - a[0]) / len, (b[1] - a[1]) / len];
    const v = [-u[1], u[0]];
    const tip = [b[0] - u[0] * 1.5, b[1] - u[1] * 1.5];
    const head = [
      [tip[0] - u[0] * 5 + v[0] * 3, tip[1] - u[1] * 5 + v[1] * 3],
      tip,
      [tip[0] - u[0] * 5 - v[0] * 3, tip[1] - u[1] * 5 - v[1] * 3],
    ];
    const tone = edge.kind === "config" ? "lo" : "mid";
    const port = edge.breaker
      ? `<circle class="tp-breaker" data-breaker="${edge.index}" cx="${r1(start[0])}" cy="${r1(start[1])}" r="2.4"/>`
      : edge.sync ? `<circle class="tp-port" cx="${r1(start[0])}" cy="${r1(start[1])}" r="1.4"/>` : "";
    out.push(`<g class="tp-edge" data-edge="${edge.index}" data-kind="${edge.kind}"><path class="tp-edge-bed" d="${line}"/>${k.lineSvg(line, { tone, dashed })}${k.lineSvg(k.onTop(head, 0, P), { tone, free: true })}${port}</g>`);
    if (features.labels !== false && edge.kind !== "config" && (edge.label || model.labels === "rate" || edge.flag || edge.unless)) labels.push(edgeLabel(edge, P, view));
  }
  if (iso) for (const node of model.nodes) out.push(`<g class="tp-label" data-label="${escape(node.id)}">${isoLabel(node, iso, model)}</g>`);
  else for (const node of model.nodes) {
    const b = flat.box(node.plan);
    out.push(`<g class="tp-label" data-label="${escape(node.id)}">${flat.text(b.x + b.w / 2, b.y + b.h + 10, node.label, 8)}</g>`);
  }
  out.push(...labels);
  out.push(`<g class="tp-packets" data-packets=""></g>`);

  // Nodes, back to front.
  const order = [...model.nodes].sort((a, b) => k.depthOf([a.cx, a.cy, 0], P) - k.depthOf([b.cx, b.cy, 0], P));
  for (const node of order) {
    const halo = iso ? `<path class="k-halo" d="${k.haloOf(k.insetPlan(node.plan, 2), 0, Math.min(heightOf(node), 10), P)}"/>` : "";
    const body = iso ? (ISO[node.kind] || ISO.box)(node, iso) : (FLAT[node.kind] || FLAT.box)(node, flat);
    const extra = (node.sidecar ? sidecarOf(node, iso, flat) : "") + (node.queue ? queueCellsOf(node, iso, flat) : "");
    out.push(`<g class="tp-node" data-node="${escape(node.id)}" data-kind="${node.kind}">${halo}${body}${extra}</g>`);
  }

  const svg = k.figureSvg({ width: W, height: H, label: describe(model), body: out, className: `tp-svg tp-${view}` });
  const lift = iso ? 1.5 : 0;
  const toScreen = (p, z = 0) => k.iso([p[0], p[1], z], P);
  const vec = (dx, dy) => {
    const a = toScreen([0, 0]);
    const b = toScreen([dx, dy]);
    return [b[0] - a[0], b[1] - a[1]];
  };
  const flagNode = model.nodes.find((node) => node.kind === "flags");
  const data = {
    P,
    edges: model.edges.map((edge) => edge.points.map((p) => toScreen(p, lift)).map(([x, y]) => [r1(x), r1(y)])),
    step: vec(PITCH, 0),
    flagStep: flagNode ? vec(flagRows(flagNode)[0]?.travel || 0, 0) : [0, 0],
    packet: iso ? isoPacket(P) : null,
  };
  return { svg, data, P, width: W, height: H };
}

// A live label on an edge: at the middle of its longest leg, set off to one side.
function edgeLabel(edge, P, view) {
  let best = 0;
  let leg = [edge.corners[0], edge.corners[1]];
  for (let i = 1; i < edge.corners.length; i++) {
    const [a, b] = [edge.corners[i - 1], edge.corners[i]];
    const len = Math.hypot(b[0] - a[0], b[1] - a[1]);
    if (len > best) {
      best = len;
      leg = [a, b];
    }
  }
  const along = Math.abs(leg[1][0] - leg[0][0]) >= Math.abs(leg[1][1] - leg[0][1]) ? "x" : "y";
  const mid = [(leg[0][0] + leg[1][0]) / 2, (leg[0][1] + leg[1][1]) / 2];
  const text = edge.label || "";
  if (view === "iso") {
    const at = along === "x" ? [mid[0], mid[1] - 6] : [mid[0] + 6, mid[1]];
    return `<g class="tp-elabel" data-elabel="${edge.index}">${k.faceTextSvg(k.topMatrix(at, 0, P, along), text, { size: 6.2, tone: "mid", anchor: "middle" })}</g>`;
  }
  const [x, y] = k.iso([mid[0], mid[1], 0], P);
  return `<g class="tp-elabel" data-elabel="${edge.index}"><text class="tp-ft tp-elabel-text" x="${r1(along === "x" ? x : x + 4)}" y="${r1(along === "x" ? y - 3.5 : y + 2)}" font-size="6.2" text-anchor="${along === "x" ? "middle" : "start"}">${escape(text)}</text></g>`;
}

// A sidecar proxy: a small box on the service's right-hand side.
function sidecarOf(node, iso, flat) {
  const { plan } = node;
  const box = { x: plan.x + plan.w + 1.5, y: plan.y + plan.d - 14, w: 9, d: 12, r: 1 };
  if (iso) return `<g class="tp-sidecar">${iso.S(k.slabOf(box, 0, Math.max(6, heightOf(node) * 0.6), iso.P, 2, 0.4), { tone: "mid" })}${iso.led(`${node.id}:s`, [box.x + box.w / 2, box.y + box.d, 3], 0.9)}</g>`;
  return `<g class="tp-sidecar">${flat.rect(flat.box(box), "tp-f tp-f-chip", 1.5)}</g>`;
}

// A node's buffer: up to 8 cells along its top, lit by how full the queue is.
function queueCellsOf(node, iso, flat) {
  const n = Math.min(8, node.queue);
  const out = [];
  if (iso) {
    const z = heightOf(node);
    for (let i = 0; i < n; i++) {
      const cell = { x: node.cx - n * 2.2 + i * 4.4, y: node.cy + 2, w: 3.4, d: 3.4, r: 0.5 };
      out.push(`<g class="tp-cell tp-qcell" data-qcell="${escape(node.id)}:${i}">${iso.S(k.slabOf(cell, z, 1.4, iso.P, 2), { tone: "lo", crease: "none" })}</g>`);
    }
  } else {
    const b = flat.box(node.plan);
    const size = Math.min(4, (b.w - 8) / n - 1);
    for (let i = 0; i < n; i++) out.push(`<rect class="tp-cell tp-fcell tp-qcell" data-qcell="${escape(node.id)}:${i}" x="${r1(b.x + 4 + i * (size + 1))}" y="${r1(b.y + b.h - size - 3)}" width="${r1(size)}" height="${r1(size)}" rx=".6"/>`);
  }
  return out.join("");
}

// A packet is a tiny cube drawn once around the screen origin; the page translates it.
function isoPacket(P) {
  const P0 = { ...P, origin: [0, 0] };
  const s = 2.2;
  const paths = k.slabOf({ x: -s, y: -s, w: s * 2, d: s * 2, r: 0 }, 0, s * 1.6, P0, 1);
  return { top: paths.top, sides: paths.shades.filter(Boolean).join(""), outline: paths.outline };
}

function describe(model) {
  const kinds = model.nodes.map((node) => `${node.label} (${node.kind})`).join(", ");
  const links = model.edges.map((edge) => `${model.byId.get(edge.from).label} to ${model.byId.get(edge.to).label}`).join("; ");
  return `${model.title}: ${kinds}. Connections: ${links}.`;
}

// The one way a model is built, in Node and in the page: resolve the tool's features, lay
// out and route the spec, then add hops if they're on.
function modelOf(spec, featureLayers = []) {
  const features = resolveFeatures(spec.features, ...featureLayers);
  const model = prepare(stripFeatures(spec, features));
  model.features = features;
  if (features.hops) applyHops(model);
  return model;
}

const GEOMETRY = new Set(["plan", "cx", "cy", "w", "d", "h", "auto", "at", "labelSpot", "groups", "index", "points", "lens", "corners", "ends", "ports", "channel", "axisOf", "via", "bend", "axis"]);
const strip = (object) => Object.fromEntries(Object.entries(object).filter(([key, value]) => !GEOMETRY.has(key) && value !== undefined));

// What the sim needs: everything in the spec except geometry, plus each edge's length.
function simSpec(model) {
  return {
    nodes: model.nodes.map(strip),
    edges: model.edges.map((edge) => ({ ...strip(edge), len: edge.len })),
    sim: model.sim,
    scenario: model.scenario,
    flags: model.flags,
    features: model.features,
  };
}

const TOPO_CSS = `
.tp-stage{position:relative;outline:none;touch-action:manipulation}
.tp-stage:focus-visible{outline:1px dashed var(--tp-faint);outline-offset:6px}
.tp-svg[hidden]{display:none}
.tp-morph{pointer-events:none}
.tp-morph svg{display:block}
.tp-node{cursor:pointer;transition:opacity .25s var(--tp-ease)}
