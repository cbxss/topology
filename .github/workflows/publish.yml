name: Publish to npm

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  verify:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: verify
    # Manual releases use main; tagged releases must match package.json below.
    if: github.ref_type == 'tag' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Validate release version
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          const pkg = JSON.parse(readFileSync('package.json', 'utf8'));
          assert.equal(pkg.name, '@cbxss/topology');
          assert.match(pkg.version, /^\d+\.\d+\.\d+$/, 'Only stable releases are published as latest');
          if (process.env.GITHUB_REF_TYPE === 'tag') {
            assert.equal(process.env.GITHUB_REF_NAME, `v${pkg.version}`, 'Tag must match package.json version');
          }
          JS

      - name: Publish public package with provenance
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_PUBLISH }}
