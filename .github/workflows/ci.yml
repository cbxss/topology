name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  examples:
    name: Test, check and rebuild the examples
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Model and page tests
        run: node --test tests/*.test.mjs

      - name: Evals file is valid
        run: node -e 'const e = require("./evals/evals.json"); if (e.skill_name !== "topology" || !e.evals.every((x) => x.id && x.prompt && x.expected_output)) process.exit(1)'

      - name: Check every example's model and story
        run: |
          for spec in examples/*/*.spec.mjs; do
            echo "::group::$spec"
            node scripts/build.mjs "$spec" --check
            echo "::endgroup::"
          done

      - name: Rebuild every example, both themes
        run: |
          for spec in examples/*/*.spec.mjs; do
            node scripts/build.mjs "$spec"
            node scripts/build.mjs "$spec" --light
          done

      - name: Committed pages are unchanged
        run: |
          git status --short
          git diff --stat --exit-code
          test -z "$(git status --porcelain)"
